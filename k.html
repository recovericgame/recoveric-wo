<script>
/* hotfix502b(대표 9/27): 안드로이드는 카카오톡 · 엣지 · 웨일 · 삼성 인터넷 등 어디서 열어도 크롬으로 넘긴다 (기본 브라우저가 엣지인 휴대폰 때문)
   아이폰은 카톡 안이면 사파리로(아이폰은 사파리에서만 앱 설치가 된다). 크롬이 없으면 지금 브라우저에 그대로 남는다 */
(function () {
  var ua = navigator.userAgent || '', L = location;
  if (!/^https?:$/.test(L.protocol) || /[?&]cx=1/.test(L.search)) return;
  var kakao = /KAKAOTALK/i.test(ua), android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var realChrome = /Chrome\/\d/.test(ua) && !/EdgA|Edg\/|SamsungBrowser|Whale|NAVER|OPR\/|Opera|KAKAOTALK|; wv\)|Firefox|FxiOS|YaBrowser|MiuiBrowser|HeyTapBrowser|Line\/|DuckDuckGo|DaumApps|Instagram|FBAN|FBAV/.test(ua);
  var go = null;
  var k = (L.hash.match(/k=([^&]+)/) || [])[1] || '';
  var q = L.search ? L.search.slice(1).split('&').filter(function (x) { return x && x.indexOf('k=') !== 0; }) : [];
  if (k) q.push('k=' + k); q.push('cx=1');
  var url = L.protocol + '//' + L.host + L.pathname + '?' + q.join('&');
  var url0 = L.protocol + '//' + L.host + L.pathname + (q.filter(function (x) { return x !== 'cx=1'; }).length ? '?' + q.filter(function (x) { return x !== 'cx=1'; }).join('&') : '');
  if (kakao) {   /* hotfix547: 카톡은 카톡이 직접 바깥 브라우저로 — 바깥에서 크롬이 아니면 아래 줄이 크롬으로 한 번 더 */
    go = function () { L.href = window.__hwpGoUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url0); };
  } else if (android && !realChrome) {
    go = function () { L.href = window.__hwpGoUrl = 'intent://' + L.host + L.pathname + '?' + q.join('&') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end'; };
  } else if (kakao && ios) {
    go = function () { L.href = window.__hwpGoUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); };
  }
  if (!go) return;
  window.__hwpKakao = true;
  try { document.documentElement.style.visibility = 'hidden'; } catch (e) {}   /* hotfix547: 넘어가는 동안 앱 화면이 번쩍 보이지 않게 */
  try { go(); } catch (e) {}
  document.addEventListener('DOMContentLoaded', function () {
    var b = document.getElementById('kk-go'); if (b) b.addEventListener('click', go);
    var s2 = document.getElementById('kk-stay'); if (s2) s2.addEventListener('click', function () { L.replace(url); });
    setTimeout(function () { var el = document.getElementById('kk'); if (el) el.classList.add('on'); try { document.documentElement.style.visibility = ''; } catch (e) {} }, 1500);   /* 못 넘어갔을 때만 안내 */
  });
})();
</script>
<title>편직팀 · 현일텍스</title>
<!-- hotfix568: 카톡 미리보기 (앱 모양과 같게) -->
<meta property="og:type" content="website">
<meta property="og:title" content="편직팀 · 현일텍스">
<meta property="og:description" content="현일텍스 편직공장 앱 — 생지 출고 요청 · [출고했어요] · 송장 사진 (눌러서 로그인)">
<meta property="og:image" content="https://recovericgame.github.io/recoveric-wo/k-og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="600">
<meta property="og:url" content="https://recovericgame.github.io/recoveric-wo/k.html">
<meta name="description" content="현일텍스 편직공장 앱 — 생지 출고 요청 · [출고했어요] · 송장 사진 (눌러서 로그인)">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--g0:#064e3b;--g1:#065f46;--g2:#059669;--g3:#10b981;--ink:#0f172a;--sub:#475569;--dim:#94a3b8;--line:#e2e8f0;--bg:#f2f7f4;--amber:#b45309;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* 로그인 */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:34px 24px calc(28px + env(safe-area-inset-bottom));background:radial-gradient(120% 70% at 20% 0%,#10b981 0%,#065f46 55%,#064e3b 100%);color:#fff}
.lg-logo{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin:0 auto 14px;display:block}
.lg-t{text-align:center;font-size:40px;font-weight:900;letter-spacing:3px}
.lg-s{text-align:center;font-size:15px;opacity:.85;margin:4px 0 26px}
.lg-f label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px;opacity:.9}
.lg-f input[type=text]{width:100%;height:56px;border:0;border-radius:14px;padding:0 16px;font-size:18px;font-family:inherit;color:var(--ink)}
.pwmask{-webkit-text-security:disc}
.lg-auto{display:flex!important;align-items:center;gap:8px;font-weight:600!important;margin-top:14px!important}.lg-auto input{width:20px;height:20px}.lg-auto small{opacity:.75;font-weight:400}
.lg-btn{width:100%;height:58px;border:0;border-radius:16px;background:#fff;color:var(--g1);font-size:19px;font-weight:900;margin-top:18px}
.lg-btn:disabled{opacity:.6}
.lg-msg{min-height:22px;text-align:center;margin-top:12px;font-weight:700;color:#fde68a}
.lg-inst{display:block;margin:10px auto 0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:800}
.lg-foot{text-align:center;font-size:12.5px;opacity:.7;margin-top:22px;line-height:1.6}
/* 앱 */
.hd{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;box-shadow:0 2px 12px rgba(6,78,59,.25)}
.hd .r1{display:flex;align-items:center;gap:10px}
.hd img{width:40px;height:40px;border-radius:11px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.hd .t{font-size:22px;font-weight:900;letter-spacing:1px;line-height:1.1}
.hd .v{font-size:13.5px;opacity:.9}
.hd .v b{background:rgba(255,255,255,.18);border-radius:8px;padding:1px 7px;margin-right:4px}
.hd .inb{margin-left:auto;background:#fff;color:var(--g1);border:0;border-radius:11px;padding:8px 12px;font-size:14px;font-weight:900}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#a7f3d0;margin-right:5px;vertical-align:1px}.live.off{background:#fca5a5}
.wrap{padding:6px 14px calc(96px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.sec-t{font-size:15px;font-weight:800;color:var(--sub);margin:16px 2px 4px}
.empty{text-align:center;color:var(--dim);padding:56px 10px;font-size:16px;line-height:1.7}
.empty b{display:block;font-size:48px;color:#a7f3d0;margin-bottom:6px}
/* hotfix568: 삼선 메뉴 · 보낼 곳 고르기 */
.mnb{position:relative;width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;flex:none}
.mnb i{display:block;width:20px;height:2.5px;border-radius:2px;background:#fff}
.mnb em{position:absolute;top:-4px;right:-4px;font-style:normal;background:var(--red);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px;font-weight:800;border:2px solid var(--g1)}
.fbar{position:sticky;top:calc(70px + env(safe-area-inset-top));z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#ecfdf5;border-bottom:1px solid #bbf7d0;padding:9px 14px;font-size:14.5px;font-weight:700;color:var(--g0)}
.fbar .fc{background:#fff;border:1px solid #86efac;border-radius:20px;padding:5px 12px}
.fbar button{margin-left:auto;border:0;background:var(--g1);color:#fff;border-radius:20px;padding:7px 13px;font-size:14px;font-weight:800}
.drw{position:fixed;inset:0;z-index:25;pointer-events:none}
.drw-bg{position:absolute;inset:0;background:rgba(6,40,30,.45);opacity:0;transition:opacity .2s}
.drw-a{position:absolute;top:0;bottom:0;left:0;width:min(84vw,340px);background:#fff;transform:translateX(-102%);transition:transform .22s ease-out;overflow:auto;overscroll-behavior:contain;padding-bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:6px 0 28px rgba(0,0,0,.2)}
.drw.on{pointer-events:auto}.drw.on .drw-bg{opacity:1}.drw.on .drw-a{transform:none}
.dh{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.dh b{display:block;font-size:21px}.dh small{opacity:.88;font-size:13.5px}
.dsec{padding:10px 10px 4px}.dsec>h4{margin:8px 8px 6px;font-size:13px;color:var(--dim);font-weight:800;letter-spacing:.5px}
.di{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:13px;padding:13px 12px;font-size:16.5px;font-weight:700;color:var(--ink);text-align:left}
.di .dc{margin-left:auto;background:#f1f5f9;color:#334155;border-radius:11px;min-width:28px;padding:2px 9px;font-size:14px;font-weight:800;text-align:center}
.di .dc.red{background:#fee2e2;color:#b91c1c}.di .dc.amb{background:#fef3c7;color:#92400e}
.di .dot{width:10px;height:10px;border-radius:50%;flex:none;background:#cbd5e1}
.di.on{background:#ecfdf5;color:var(--g1)}.di.on .dc{background:var(--g2);color:#fff}
.di.red-t{color:var(--red)}
.dver{text-align:center;color:var(--dim);font-size:12px;padding:14px 0 6px}
.mnav{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;margin:12px 0}
.mnav button{border:0;background:#f1f5f9;border-radius:10px;width:46px;height:40px;font-size:20px;font-weight:900;color:var(--g1)}.mnav button:disabled{opacity:.35}
.mnav b{font-size:17px}
/* 카드 */
.k-card{background:#fff;border-radius:20px;padding:15px 15px 14px;margin:12px 0;border:2px solid transparent;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 24px -18px rgba(6,78,59,.45)}
.k-card.new{border-color:#f87171}.k-card.part{border-color:#fb923c}.k-card.cx{background:#f8fafc;border-color:#cbd5e1}.k-card.inv{border-color:#f59e0b}
.k-tag{display:inline-block;font-size:13px;font-weight:800;border-radius:10px;padding:3px 10px}
.t-r{background:#fee2e2;color:#b91c1c}.t-o{background:#ffedd5;color:#c2410c}.t-g{background:#dcfce7;color:#166534}.t-s{background:#f1f5f9;color:#475569}.t-y{background:#fef3c7;color:#92400e}
.k-it{font-size:18px;font-weight:800;margin-top:7px;line-height:1.3}.k-lot{font-size:34px;font-weight:900;color:var(--amber);letter-spacing:.5px;margin-left:6px;vertical-align:-2px}
.k-q3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 9px;text-align:center}
.k-q3 div{background:#f1f5f9;border-radius:13px;padding:7px 2px}.k-q3 small{display:block;font-size:13px;font-weight:700;color:var(--sub)}.k-q3 b{display:block;font-size:26px;line-height:1.15}
.k-q3 .left{background:#ecfdf5;border:2px solid var(--g3)}.k-q3 .left b{color:var(--g1)}
.k-bar{height:9px;border-radius:5px;background:#e2e8f0;overflow:hidden;margin:0 0 10px}.k-bar i{display:block;height:100%;background:var(--g2)}
.k-meta{font-size:14.5px;color:#334155;margin-bottom:10px;line-height:1.55}
.k-note{font-size:13.5px;color:var(--sub);background:#f8fafc;border-left:4px solid #a7f3d0;border-radius:8px;padding:7px 10px;margin-bottom:10px;white-space:pre-wrap}
.k-go{display:block;width:100%;border:0;border-radius:15px;padding:16px 8px;font-size:19.5px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g1))}
.k-go.blue{background:linear-gradient(135deg,#2563eb,#1d4ed8)}.k-go.gray{background:#e2e8f0;color:#334155}.k-go.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
.k-sum{background:linear-gradient(135deg,#ecfdf5,#fff);border-radius:20px;padding:16px;margin:12px 0;border:1px solid #bbf7d0}.k-sum b{font-size:32px;color:var(--g1)}
.k-row{background:#fff;border-radius:15px;padding:12px 14px;margin:8px 0;border:1px solid var(--line);font-size:15px;line-height:1.55}
/* 아래 탭 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.06)}
.nav button{flex:1;border:0;background:none;border-radius:14px;padding:8px 2px;font-size:14px;font-weight:800;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--g1);background:#ecfdf5}
.nav button em{position:absolute;top:3px;left:calc(50% + 8px);font-style:normal;background:var(--red);color:#fff;border-radius:10px;min-width:20px;padding:1px 6px;font-size:12px}
/* 설정 */
.set{background:#fff;border-radius:18px;padding:6px 16px;margin:12px 0;border:1px solid var(--line)}
.set .rw{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #f1f5f9;font-size:16px}
.set .rw:last-child{border-bottom:0}.set .rw b{flex:1}.set .rw small{display:block;font-weight:500;color:var(--sub);font-size:13px}
.set .rw button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;font-size:14.5px;font-weight:800;color:var(--ink)}
.set .rw button.g{background:var(--g2);border-color:var(--g2);color:#fff}.set .rw button.red{color:var(--red);border-color:#fecaca}
.seg{display:flex;gap:5px}.seg button{padding:8px 10px!important}.seg button.on{background:var(--g1)!important;border-color:var(--g1)!important;color:#fff!important}
.ok-t{color:var(--g1);font-weight:800;font-size:14px}.bad-t{color:var(--red);font-weight:800;font-size:14px}
/* 아래 창 */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(6,40,30,.45);display:none;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
#sheet.on{display:flex}
.sh{width:100%;max-width:560px;background:#fff;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh .grab{width:46px;height:5px;border-radius:3px;background:#e2e8f0;margin:2px auto 12px}
.sh h3{margin:0 0 3px;font-size:21px}.sh .sub{font-size:14px;color:var(--sub);margin-bottom:10px}
.sh .row2{display:flex;gap:8px;margin-top:14px}.sh .row2 button{flex:1;height:56px;border-radius:15px;border:0;font-size:17px;font-weight:900}
.sh .ok{background:linear-gradient(135deg,var(--g2),var(--g1));color:#fff}.sh .ok:disabled{opacity:.45}.sh .no{background:#f1f5f9;color:#334155}
.k-num{display:flex;align-items:center;gap:8px;margin:4px 0 6px}.k-num button{width:58px;height:62px;border-radius:15px;border:0;background:#e2e8f0;font-size:32px;font-weight:900;color:var(--ink)}
.k-num input{flex:1;min-width:0;height:64px;border:2px solid #86efac;border-radius:15px;font-size:32px;font-weight:900;text-align:center;font-family:inherit}
.k-lab{font-size:15.5px;font-weight:800;color:#334155;margin-top:12px}
.k-ph{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:68px;border:2px dashed #86efac;border-radius:15px;background:#f0fdf4;font-size:17px;font-weight:800;color:var(--g1);margin-top:6px}
.k-ph img{max-height:130px;max-width:100%;border-radius:8px}
.k-warn{background:#fff7ed;border:2px solid #fb923c;border-radius:13px;padding:10px 12px;font-size:15px;margin-top:8px;color:#9a3412;font-weight:700}
.k-okm{background:#ecfdf5;border:2px solid #34d399;border-radius:13px;padding:9px 12px;font-size:14.5px;margin-top:8px;color:#065f46;font-weight:700}
.ig{display:flex;gap:14px;align-items:flex-start;margin:6px 0 10px}
.ig-steps{margin:0;padding-left:20px;font-size:15px;line-height:1.65}.ig-steps li{margin-bottom:8px}
.ig-note{font-size:13.5px;color:var(--sub);background:#f8fafc;border-radius:11px;padding:10px 12px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;border-radius:13px;padding:12px 18px;font-size:15px;font-weight:700;opacity:0;transition:.25s;z-index:40;max-width:90vw;text-align:center;pointer-events:none;word-break:keep-all}
#toast.on{opacity:.96;transform:translateX(-50%)}#toast.err{background:var(--red)}
.kk{display:none;position:fixed;inset:0;z-index:50;background:var(--g1);color:#fff;padding:40px 26px;text-align:center;flex-direction:column;justify-content:center;gap:14px}
.kk.on{display:flex}.kk b{font-size:21px}.kk p{opacity:.88;line-height:1.6;margin:0}.kk button{height:54px;border:0;border-radius:13px;background:#fff;color:var(--g1);font-size:17px;font-weight:900}
.moved{position:fixed;inset:0;z-index:60;background:var(--g1);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:30px;text-align:center;font-size:17px;line-height:1.6}
</style>
</head>
<body>
<div id="login">
  <img class="lg-logo" src="k-icon-192.png" alt="">
  <div class="lg-t">편직팀</div>
  <div class="lg-s">현일텍스 생지 출고 · 휴대폰으로 [출고했어요]</div>
  <form class="lg-f" id="lg-form" autocomplete="off">
    <label for="lg-id">아이디</label><input id="lg-id" type="text" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="예: daechul">
    <label for="lg-pw">비밀번호</label><input id="lg-pw" type="text" class="pwmask" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="비밀번호">
    <label class="lg-auto"><input type="checkbox" id="lg-auto" checked>자동 로그인 <small>다음부터 바로 들어갑니다</small></label>
    <button class="lg-btn" id="lg-btn" type="submit">들어가기</button>
  </form>
  <div class="lg-msg" id="lg-msg"></div>
  <button type="button" class="lg-inst hide" id="lg-inst">바탕화면에 [편직팀] 앱 설치</button>
  <div class="lg-foot">아이디 · 비밀번호는 현일텍스가 드립니다.<br>현일텍스 주식회사 · FABIWOS</div>

      <div class="k-lab">몇 절 보냈어요?</div>
      <div class="k-num"><button type="button" id="k-m">−</button><input id="k-j" type="number" inputmode="decimal" value="${kQ(st.j)}"><button type="button" id="k-p">+</button></div>
      <div class="k-lab">송장 무게 합계 (kg) <small style="font-weight:600;color:#64748b">(모르면 비워 두세요)</small></div>
      <div class="k-num"><input id="k-kg" type="number" inputmode="decimal" placeholder="예: 210.4" value="${esc(st.kg)}"></div>
      ${kPhotoField(st)}
      <div class="row2"><button type="button" class="no" data-x>닫기</button><button type="button" class="ok" id="k-send"${st.busy ? ' disabled' : ''}>${st.busy ? '보내는 중…' : '보내기'}</button></div>`);
    $('sheet').querySelector('[data-x]').addEventListener('click', () => { closeSheet(); render(); });
    const J = $('k-j'), K = $('k-kg');
    J.addEventListener('input', () => { st.j = J.value; }); K.addEventListener('input', () => { st.kg = K.value; });
    $('k-m').addEventListener('click', () => { st.j = Math.max(0, (parseFloat(J.value) || 0) - 1); J.value = kQ(st.j); });
    $('k-p').addEventListener('click', () => { st.j = (parseFloat(J.value) || 0) + 1; J.value = kQ(st.j); });
    kBindPhoto(st, draw);
    $('k-send').addEventListener('click', async () => {
      const j = parseFloat(J.value) || 0; const kg = parseFloat(K.value) || 0;
      if (!(j > 0)) { toast('보낸 절수를 넣어 주세요', true); J.focus(); return; }
      if (j > v.pend && !confirm(`주문보다 많이 보냈나요? (남은 ${kQ(v.pend)}절 · 적은 ${kQ(j)}절)\n\n맞으면 [확인]`)) return;
      st.busy = true; st.j = j; st.kg = K.value; draw();
      let ref = ''; if (st.q && st.q.blob) { try { ref = await kUpload(st.q.blob, x.k); } catch (e) { toast('사진은 올리지 못했습니다 — 숫자만 보냅니다', true); } }
      const ok = await put(x, { kind: 'ship', part: 'gs', body: j, n: kg || 0, ref: ref || undefined });
      st.busy = false;
      if (ok) { closeSheet(); ring(); toast(j < v.pend ? `${kQ(j)}절 보냈다고 알렸습니다 — 남은 ${kQ(v.pend - j)}절은 할 일에 남습니다` : `${kQ(j)}절 보냈다고 현일텍스에 알렸습니다`); render(); } else draw();
    });
  };
  draw();
}
function kPhotoSheet(x) {
  const st = { q: null, busy: false };
  const draw = () => {
    sheet(`<h3>송장 사진 보내기</h3><div class="sub">${esc(x.item)} ${esc(x.lot || '')} · ${esc(x.date)} · ${esc(x.no)}</div>${kPhotoField(st)}
      <div class="row2"><button type="button" class="no" data-x>닫기</button><button type="button" class="ok" id="k-send"${!st.q || st.busy ? ' disabled' : ''}>${st.busy ? '보내는 중…' : '보내기'}</button></div>`);
    $('sheet').querySelector('[data-x]').addEventListener('click', () => { closeSheet(); render(); });
    kBindPhoto(st, draw);
    $('k-send').addEventListener('click', async () => { if (!st.q) return; st.busy = true; draw(); let ref = '';
      try { ref = await kUpload(st.q.blob, x.k); } catch (e) { st.busy = false; draw(); toast('사진을 올리지 못했습니다 — 팩스로 보내 주세요', true); return; }
      const ok = await put(x, { kind: 'st', part: 'gs', stage: 'photo', ref }); st.busy = false; if (ok) { closeSheet(); toast('송장 사진을 보냈습니다'); render(); } else draw(); });
  };
  draw();
}
document.addEventListener('click', async e => {
  if (e.target.closest && e.target.closest('[data-dclear]')) { S.dest = ''; S.kind = ''; lsSet(vKey('dest'), ''); window.scrollTo(0, 0); render(); return; }
  const ymb = e.target.closest && e.target.closest('[data-ym]'); if (ymb) { const now = new Date(); const base = S.ym || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0')); const [y, m] = base.split('-').map(Number); const d = new Date(y, m - 1 + Number(ymb.dataset.ym), 1); S.ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); render(); return; }
  const nb = e.target.closest && e.target.closest('#nav [data-tab]'); if (nb) { if (nb.dataset.tab === 'todo') S.kind = ''; S.tab = nb.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const nm = e.target.closest && e.target.closest('[data-nm]'); if (nm) { try { localStorage.setItem('hwk.nmode', nm.dataset.nm); } catch (_) {} ring(nm.dataset.nm); render(); return; }
  const sb = e.target.closest && e.target.closest('[data-set]');
  if (sb) { const a = sb.dataset.set; if ($('drw').classList.contains('on')) openDrw(false);
    if (a === 'push') { const ok = await pushReg(true); toast(ok ? '알림이 켜졌습니다 — 앱을 꺼 둬도 울립니다' : '알림 등록이 안 됐습니다' + (S.pushErr ? ' — ' + S.pushErr.slice(0, 60) : ''), !ok); render(); }
    else if (a === 'test') ring();
    else if (a === 'inst') doInstall();
    else if (a === 'out') { if (!confirm('로그아웃합니까?')) return; S.sess = null; S.acc = null; await pushOff(); await signOut(auth); }
    return; }
  const t = e.target.closest && e.target.closest('[data-kgo],[data-kph],[data-kack]'); if (!t) return;
  const x = kList().find(i => i.k === (t.dataset.kgo || t.dataset.kph || t.dataset.kack)); if (!x) return;
  if (t.dataset.kgo) kShipSheet(x);
  else if (t.dataset.kph) kPhotoSheet(x);
  else { const a = lsGet(vKey('ack'), []); lsSet(vKey('ack'), a.concat(x.k + ':' + x.cxl).slice(-300)); put(x, { kind: 'st', part: 'gs', stage: 'ack_cxl' }); render(); }
});
window.__hwk = { S, render, kView };
</script>

  var kakao = /KAKAOTALK/i.test(ua), android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);

  if (k) q.push('k=' + k); q.push('cx=1');
  var url = L.protocol + '//' + L.host + L.pathname + '?' + q.join('&');
  var url0 = L.protocol + '//' + L.host + L.pathname + (q.filter(function (x) { return x !== 'cx=1'; }).length ? '?' + q.filter(function (x) { return x !== 'cx=1'; }).join('&') : '');
  if (kakao) {   /* hotfix547: 카톡은 카톡이 직접 바깥 브라우저로 — 바깥에서 크롬이 아니면 아래 줄이 크롬으로 한 번 더 */
    go = function () { L.href = window.__hwpGoUrl = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url0); };

#kcam .g{position:absolute;inset:0;bottom:118px;pointer-events:none;background-image:linear-gradient(to right,transparent calc(33.33% - 1px),rgba(255,255,255,.55) calc(33.33% - 1px),rgba(255,255,255,.55) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),rgba(255,255,255,.55) calc(66.66% - 1px),rgba(255,255,255,.55) 66.66%,transparent 66.66%),linear-gradient(to bottom,transparent calc(33.33% - 1px),rgba(255,255,255,.55) calc(33.33% - 1px),rgba(255,255,255,.55) 33.33%,transparent 33.33%,transparent calc(66.66% - 1px),rgba(255,255,255,.55) calc(66.66% - 1px),rgba(255,255,255,.55) 66.66%,transparent 66.66%)}
#kcam .fr{position:absolute;left:8%;right:8%;top:6%;bottom:calc(118px + 4%);border:3px solid #34d399;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.18);pointer-events:none}
#kcam .tip{position:absolute;top:12px;left:0;right:0;text-align:center;color:#fff;font-size:16px;font-weight:800;text-shadow:0 1px 4px #000}
#kcam .bar{height:118px;display:flex;align-items:center;justify-content:space-around;background:#0b1f17;padding-bottom:env(safe-area-inset-bottom)}
#kcam .bar button{border:0;background:#1f3d31;color:#fff;font-size:16px;font-weight:800;border-radius:14px;padding:12px 16px}
#kcam .bar .shot{width:78px;height:78px;border-radius:50%;background:#fff;border:6px solid #34d399;padding:0}
.k-hseg{display:flex;gap:6px;margin:12px 0 8px}.k-hseg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-size:15px;font-weight:800;color:#475569}.k-hseg button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.k-hrng{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:10px}.k-hrng input,.k-hrng select{flex:1;min-width:0;font-size:16px;font-weight:700;border:1px solid #cbd5e1;border-radius:10px;padding:9px 8px;background:#fff}
.k-hrng span{color:#64748b;font-weight:800}
.k-row .k-cx{float:right;border:1px solid #fecaca;background:#fff;color:#b91c1c;font-size:13px;font-weight:800;border-radius:10px;padding:5px 10px;margin-left:6px}
.k-warn{background:#fff7ed;border:2px solid #fb923c;border-radius:13px;padding:10px 12px;font-size:15px;margin-top:8px;color:#9a3412;font-weight:700}
.k-okm{background:#ecfdf5;border:2px solid #34d399;border-radius:13px;padding:9px 12px;font-size:14.5px;margin-top:8px;color:#065f46;font-weight:700}
.ig{display:flex;gap:14px;align-items:flex-start;margin:6px 0 10px}
.ig-steps{margin:0;padding-left:20px;font-size:15px;line-height:1.65}.ig-steps li{margin-bottom:8px}
.ig-note{font-size:13.5px;color:var(--sub);background:#f8fafc;border-radius:11px;padding:10px 12px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;border-radius:13px;padding:12px 18px;font-size:15px;font-weight:700;opacity:0;transition:.25s;z-index:40;max-width:90vw;text-align:center;pointer-events:none;word-break:keep-all}
#toast.on{opacity:.96;transform:translateX(-50%)}#toast.err{background:var(--red)}
.kk{display:none;position:fixed;inset:0;z-index:50;background:var(--g1);color:#fff;padding:40px 26px;text-align:center;flex-direction:column;justify-content:center;gap:14px}
.kk.on{display:flex}.kk b{font-size:21px}.kk p{opacity:.88;line-height:1.6;margin:0}.kk button{height:54px;border:0;border-radius:13px;background:#fff;color:var(--g1);font-size:17px;font-weight:900}
.moved{position:fixed;inset:0;z-index:60;background:var(--g1);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:30px;text-align:center;font-size:17px;line-height:1.6}

/* hotfix620: 카톡 모양 대화 (HWChat) */
.k620w{margin:-6px -14px 0;min-height:calc(100vh - 120px);background:#cfe3d7;padding:0 0 160px}
.k620w .hwk-th{min-height:60vh}
.k620nb{position:sticky;top:var(--k620top,64px);z-index:4}
.k620b{padding:0!important;background:transparent!important;border:0!important;box-shadow:0 -4px 14px rgba(15,23,42,.08)!important}
@media (min-width:700px){ body.k620pc{background:linear-gradient(135deg,#e6f2ee,#dbe6ef)} body.k620pc>*:not(script):not(style){max-width:480px;margin-left:auto;margin-right:auto}
  body.k620pc .nav,body.k620pc .k620b,body.k620pc .kc-bar{left:50%!important;right:auto!important;width:480px;transform:translateX(-50%)}
  body.k620pc{box-shadow:none}body.k620pc .wrap{background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px #e2e8f0} }
/* hotfix622: 보낼 곳 고르기 */
.k-bdg{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:999px;font-size:13px;font-weight:800;vertical-align:1px}.k-bdg.req{background:#fef2f2;color:#b91c1c}.k-bdg.opt{background:#f1f5f9;color:var(--sub)}
.k-ref{background:#f1f5f9;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.5;color:var(--sub);margin:6px 0 2px}.k-ref b{font-size:17px;font-weight:900}
.k-hint{font-size:14.5px;color:var(--sub);margin:2px 2px 0}
.k-err-t{font-size:15px;font-weight:800;color:var(--red);margin:2px 2px 4px;word-break:keep-all}
.k-num input.k-bad{border:2px solid var(--red);background:#fef2f2}.k-dp.k-bad{border:1.5px dashed #fca5a5;border-radius:14px;padding:6px}
.k-over{background:#fffbeb;border:2px solid #fbbf24;border-radius:13px;padding:10px 12px;font-size:15px;font-weight:800;color:var(--amber);margin-top:12px}
.k-wait{color:var(--amber)}.st-is.st-wait{background:#fffbeb;color:#92400e;font-size:15px}   /* hotfix668: 확인 중 N절 (현일텍스 확인 전 출고 보고) */
.sh .row2.k-r14 .ok{flex:1.4}
/* hotfix689(경선 회사): 송장 판독 카드 — 맨 위 판정 한 줄(일치 초록 · 작은 차이 주황 · 차이 빨강 · 대조 대기 회색) · 틀린 칸만 펼침 · 큰 숫자 · 44px 이상 */
.kiv{margin-top:10px;border:2px solid var(--gray-200);border-radius:var(--r-l);background:var(--surface);font-variant-numeric:tabular-nums}.kiv>:first-child{border-radius:calc(var(--r-l) - 2px) calc(var(--r-l) - 2px) 0 0}
.kiv-top{position:sticky;top:0;z-index:3;padding:8px 14px;background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
.kiv[data-v="match"]{border-color:var(--st-ok-line)}.kiv[data-v="match"] .kiv-top{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.kiv[data-v="minor"]{border-color:var(--st-warn-line)}.kiv[data-v="minor"] .kiv-top{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.kiv[data-v="mismatch"]{border-color:var(--st-bad-solid)}.kiv[data-v="mismatch"] .kiv-top{background:var(--st-bad-solid);color:#fff}.kiv[data-v="mismatch"] .kiv-top .kiv-sm,.kiv[data-v="mismatch"] .kiv-top .kiv-sm b{color:#fff}
.kiv[data-v="wait"] .kiv-top,.kiv[data-v="read"] .kiv-top{background:var(--gray-100);color:var(--gray-700)}
.kiv-vd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.kiv-vd b{font-size:26px;font-weight:900;line-height:1.2}.kiv-vd span{font-size:var(--fs-md);font-weight:800}
.kiv-sm{margin-top:4px;font-size:var(--fs-md);font-weight:700;color:var(--gray-700)}.kiv-sm b{font-size:19px;color:var(--ink)}
.kiv-bar{height:6px;border-radius:3px;background:var(--gray-200);margin-top:8px;overflow:hidden}.kiv-bar i{display:block;height:100%;width:30%;background:var(--brand-700);animation:kivb 1.1s ease-in-out infinite}
@keyframes kivb{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.kiv-cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:4px 10px;align-items:center;padding:10px 14px;font-size:var(--fs-md);font-weight:700;border-bottom:1px solid var(--gray-200)}
.kiv-cmp em{font-style:normal;color:var(--gray-700);font-size:14px}.kiv-cmp b.none{font-size:14px;font-weight:700;color:var(--gray-700)}.kiv-cmp b{font-size:20px;text-align:right}.kiv-cmp b.bad{color:var(--st-bad-ink);background:var(--st-bad-bg);border-radius:8px;padding:0 6px}
.kiv-body{display:flex;flex-direction:column;gap:8px;padding:10px 14px}
.kiv-img{display:block;width:100%;max-height:120px;object-fit:contain;object-position:center top;border-radius:var(--r-m);background:var(--gray-100);border:1px solid var(--gray-200);cursor:zoom-in;image-orientation:from-image}.kiv-img.big{max-height:none}
.kiv-rows{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kiv-r{display:flex;align-items:center;gap:6px;min-height:var(--tap);padding:4px 10px;border:1px solid var(--gray-200);border-radius:var(--r-m);background:var(--surface);font-family:inherit;text-align:left;color:var(--ink)}
.kiv-r i{font-style:normal;font-size:14px;color:var(--gray-700);min-width:18px}.kiv-r b{font-size:20px;font-weight:900;flex:1;text-align:right}
.kiv-r.flag{border:2px solid var(--st-bad-line);background:var(--st-bad-bg)}.kiv-r.flag b{color:var(--st-bad-ink)}.kiv-r.new{animation:kivn .4s ease-out}
@keyframes kivn{from{background:var(--st-info-bg)}to{background:var(--surface)}}
.kiv-r.wide{grid-column:1 / -1}
.kiv-c{display:inline-block;padding:1px 7px;border-radius:999px;font-size:14px;font-weight:800;background:var(--st-info-bg);color:var(--st-info-ink);white-space:nowrap}.kiv-c.w{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.kiv-more{grid-column:1 / -1;min-height:var(--tap);border:1px dashed var(--gray-300);border-radius:var(--r-m);background:var(--gray-50);font-size:var(--fs-md);font-weight:800;color:var(--gray-700);font-family:inherit}
.kiv-ed{grid-column:1 / -1;display:flex;gap:6px;align-items:center}.kiv-ed input{flex:1;min-width:0;height:52px;border:2px solid var(--brand-700);border-radius:var(--r-m);font-size:24px;font-weight:900;text-align:center;font-family:inherit}
.kiv-ed button{height:52px;min-width:56px;border:0;border-radius:var(--r-m);font-size:var(--fs-md);font-weight:900;font-family:inherit;background:var(--gray-200);color:var(--ink)}.kiv-ed button.ok{background:var(--brand-700);color:#fff}
.kiv-act{position:sticky;bottom:0;z-index:2;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--surface);box-shadow:0 -6px 12px -6px rgba(15,23,42,.18)}.kiv-go{width:100%;min-height:56px;border:0;border-radius:var(--r-l);background:var(--brand-700);color:#fff;font-size:18px;font-weight:900;font-family:inherit}
.kiv-done{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 6px 0 14px;border-radius:var(--r-l);background:var(--st-ok-bg);color:var(--st-ok-ink);font-size:var(--fs-md);font-weight:900}.kiv-done span{flex:1}
.kiv-done button,.kiv-sub button{min-height:var(--tap);padding:0 14px;border:1px solid var(--gray-300);border-radius:var(--r-m);background:var(--surface);font-size:15px;font-weight:800;color:var(--gray-700);font-family:inherit}
.kiv-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 14px 12px;font-size:14px;color:var(--gray-700);font-weight:700}.kiv-sub small{flex:1 1 100%;display:flex;flex-wrap:nowrap;align-items:center;gap:8px;font-size:14px;color:var(--gray-700)}.kiv-sx{flex:1 1 auto;min-width:0}.kiv-dev{flex:none;margin-left:auto}.kiv-dev[open]{flex:1 1 100%}.kiv-sub small:has(.kiv-dev[open]){flex-wrap:wrap}.kiv-sub button.kiv-clr{border-color:var(--st-bad-line);color:var(--st-bad-ink)}
.kiv-why{margin-top:2px;font-size:14px;font-weight:800;line-height:1.3}.kiv-why span{display:inline-block;margin:2px 4px 0 0;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.22)}.kiv-wc{align-self:center;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.22);font-size:14px;font-weight:800;line-height:1.3}.kiv[data-v="minor"] .kiv-why span,.kiv[data-v="minor"] .kiv-wc{background:var(--surface)}
.kiv-zm{margin-top:-4px;font-size:14px;font-weight:700;color:var(--gray-700)}
.kiv-zw{height:160px;max-height:none;background:#0f172a no-repeat 50% 50%/contain;cursor:zoom-out;transition:background-size .25s,background-position .25s}
.kiv-note{padding:0 2px 6px;font-size:15px;font-weight:800;color:var(--st-warn-ink)}
.kiv-dev summary{display:inline-flex;align-items:center;min-height:var(--tap);cursor:pointer;color:var(--gray-700)}
.kiv-msg{padding:10px 14px;font-size:var(--fs-md);font-weight:800;color:var(--st-warn-ink);background:var(--st-warn-bg)}
.k-num input.kiv-diff{border:2px solid var(--st-bad-solid);background:var(--st-bad-bg);color:var(--st-bad-ink)}
/* hotfix672: 요청 카드 상태 — 보낼 것(빨강 · 주황 테두리 + 남청 [출고했어요]) · 보냄 · 확인 중(정보 파랑) · 끝(완료 초록) · [이미 보낸 출고] 창 */
.k-card.sent{border-color:var(--st-info-line);background:var(--surface)}
.k-state{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:4px 12px;border-radius:999px;font-size:var(--fs-md);font-weight:900;border:1px solid transparent}
.k-state-d{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.k-state.sent{background:var(--st-info-bg);color:var(--st-info-ink);border-color:var(--st-info-line)}
.k-state.end{background:var(--st-ok-bg);color:var(--st-ok-ink);border-color:var(--st-ok-line)}
.k-al-box{background:var(--st-info-bg);border:1px solid var(--st-info-line);border-radius:var(--r-m);padding:12px 14px;margin:10px 0;font-size:var(--fs-md);line-height:1.5;color:var(--ink)}
.k-al-box.sm{padding:10px 12px;margin:8px 0}
.k-al-h{display:block;font-size:var(--fs-md);font-weight:900;color:var(--st-info-ink);margin-bottom:4px}
.k-al-n{margin-top:6px;font-size:var(--fs-md);color:var(--gray-600)}
.k-al-r{padding:8px 0;font-size:var(--fs-lg);font-weight:700}.k-al-r+.k-al-r{border-top:1px solid var(--st-info-line)}.k-al-r span{font-size:var(--fs-md);font-weight:800;color:var(--st-info-ink)}
.k-sr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:5px 0;font-size:var(--fs-md);color:var(--ink)}.k-sr+.k-sr{border-top:1px dashed var(--st-info-line)}
.k-sr-w{font-weight:800;color:var(--st-info-ink)}.k-sr.end .k-sr-w{color:var(--st-ok-ink)}
.k-al{text-align:center;margin-bottom:4px}.k-al h3{margin:6px 0 2px}
.k-al-i{width:52px;height:52px;margin:2px auto 0;border-radius:50%;background:var(--st-info-bg);color:var(--st-info-ink);border:2px solid var(--st-info-line);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
.k-al-t{margin:10px 2px 4px;font-size:var(--fs-md);line-height:1.6;color:var(--gray-700);text-align:center;word-break:keep-all}
.k-go.k-more{min-height:52px;margin-top:10px;font-size:var(--fs-lg)}
.k-more-t{margin-top:6px;text-align:center;font-size:var(--fs-md);color:var(--gray-600);word-break:keep-all}
.k-rec-t{margin-top:18px}
.k-recg{margin:18px 0 6px;border:1px solid var(--st-info-line);border-radius:var(--r-l);background:var(--gray-50);padding:0 12px}
.k-rec-s{display:flex;align-items:center;gap:10px;min-height:52px;list-style:none;cursor:pointer;font-size:var(--fs-md);font-weight:800;color:var(--gray-700)}.k-rec-s::-webkit-details-marker{display:none}
.k-rec-sl{flex:1}.k-rec-sl b{font-weight:900;color:var(--ink)}.k-state.sm{min-height:28px;padding:2px 10px}
.k-rec-ch{font-size:18px;color:var(--gray-600);transition:transform .15s}.k-recg[open] .k-rec-ch{transform:rotate(180deg)}.k-recg[open]{padding-bottom:8px}
body.k-waking #list{opacity:.45;pointer-events:none;transition:opacity .12s}
body.k-waking #list::before{content:'새로 불러오는 중…';display:block;text-align:center;font-size:var(--fs-md);font-weight:800;color:var(--st-info-ink);padding:8px 0}
.k-rec{background:var(--surface);border:1.5px solid var(--st-info-line);border-radius:var(--r-l);padding:12px 14px;margin:10px 0}.k-rec.end{border-color:var(--st-ok-line);background:var(--gray-50)}
.k-rec-it{margin:8px 0 4px;font-size:var(--fs-lg);font-weight:900;color:var(--ink)}.k-rec-m{margin-top:4px;font-size:var(--fs-md);color:var(--gray-600)}
.k-dp{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}.k-dp button{border:2px solid #d1fae5;background:#fff;border-radius:14px;padding:12px 16px;font-size:17px;font-weight:800;color:#065f46;font-family:inherit;min-height:52px}.k-dp button.on{background:#059669;border-color:#059669;color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.3)}
/* hotfix650(디자인 중-11): 눌리는 영역만 44px — 보이는 모양은 그대로(::after 로 둘레만 넓힘) · 회사 바꾸기 · 앱 설치 · 설정 단추 */
.cob,.hd .inb,.set .rw button{position:relative}
.cob::after,.hd .inb::after,.set .rw button::after{content:'';position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
/* hotfix653(색기준 통일): 머리 띠 = 대표색 남청(평면) · "편직팀" 글자를 앱 이름 칩으로(한 곳만) · 서랍 머리 · 주 단추([출고했어요] · 창 [보내기]) · 아래 탭 · 서랍 고른 표시 · 거름 띠 = 남청
   재고 초록(--stock) · 편직 중 호박(--knit) · 카드 안 숫자 색 · 노랑/회색/파랑 단추는 그대로 */
#app .hd{background:var(--brand-800);box-shadow:0 2px 10px rgba(30,58,138,.22)}
#app .hd .t{display:inline-block;font-size:19px;letter-spacing:.5px;padding:1px 10px;border-radius:8px;background:rgba(255,255,255,.18)}
#app .hd .inb{color:var(--brand-800)}.mnb em{border-color:var(--brand-800)}
.dh{background:var(--brand-800)}.di.on{background:var(--brand-100);color:var(--brand-800)}.di.on .dc{background:var(--brand-700)}
.fbar{background:var(--brand-100);border-bottom-color:var(--brand-line);color:var(--brand-800)}.fbar .fc{border-color:var(--brand-line)}.fbar button{background:var(--brand-700)}
.k-go:not(.gray):not(.amber):not(.blue){background:var(--brand-700)}
.k-go.blue{background:#fff;color:var(--brand-800);border:2px solid var(--brand-700)}   /* hotfix653: 부분 출고(남은 N절) = 흰 바탕 남청 테두리 — [출고했어요](남청 채움)와 구분 */
.sh .ok{background:var(--brand-700)}
/* hotfix654(653 디자인 검수): 할 일 [송장 사진 보내기] 주황 그라데이션 → 평면 호박(같은 뜻 · 흰 글자 대비 5.0) · 재고 카드 [출고](붉은 갈색 · [편직 중으로] 호박과 섞임) → 남청 채움(주 동작) */
.k-go.amber{background:var(--st-prog-solid)}

.hwk-sh .it{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 12px;border-radius:12px;font:inherit;font-size:15.5px;font-weight:600;color:#0f172a;text-align:left;cursor:pointer}

  { const yb = e.target.closest && e.target.closest('[data-yin]'); if (yb) { const y = (S.yin || []).find(x => x.k === yb.dataset.yin); if (y) kYinSheet(y); return; } }

  else if (t.dataset.kph) kPhotoSheet(x);

/* hotfix606(대표 10/4): 휴대폰 ◁(뒤로) 다시 설계 — 세 앱(공정 체크 · 현장 QC · 편직팀) 같은 규칙. 600 은 탭 · 거르기 · 정렬이 바뀔 때마다 한 칸씩 쌓아 ◁ 가 엉뚱한 중간 화면(빈 탭)으로 갔고, 매번 알림줄이 아래 메뉴를 가렸음
 *   ① 열린 창 · 메뉴가 있으면 그것만 닫음 — 입력 창에 글자를 넣던 중이었을 때만 알림줄 [다시 열기](적던 그대로)
 *   ② 창이 없고 첫 화면(첫 탭 · 찾기 없음)이 아니면 → 한 번에 첫 화면으로 (알림줄 없음)
 *   ③ 첫 화면이면 "나가시겠습니까?" — [나가기] 또는 ◁ 한 번 더 = 나감 · [계속 쓰기] = 그대로
 *   원단회사 · 업체 고르기는 ◁ 로 되돌리지 않음(고른 그대로)
 *   이력 지킴: 손가락이 화면에 닿을 때마다 이력을 3칸까지 채워 둠 → ◁ 를 연달아 눌러도 앱이 받음 */
(function () {
  if (window.HWBack) return;
  const K = 3;
  const B = { on: false, depth: 0, leaving: false, restoring: false, undo: null, ad: null, snackT: 0, log: [], typed: new Set() };
    const push = () => { try { history.pushState({ hwb: 600 }, ''); B.depth++; return true; } catch (_) { return false; } };
  const arm = () => { if (!B.on || B.leaving) return; let n = 0; while (B.depth < K && n++ < K) { if (!push()) break; } };
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(t => document.addEventListener(t, arm, true));
  document.addEventListener('input', e => { const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.type !== 'search' && !/찾기|검색/.test(t.placeholder || '')) B.typed.add(t); }, true);   /* 글자를 넣은 칸 — 창을 닫을 때 [다시 열기]를 줄지 봄 */
  document.addEventListener('pointerdown', e => { const s = el('hwb-snack'); if (s && s.classList.contains('on') && !s.contains(e.target)) hideSnack(); }, true);   /* 다른 곳을 누르면 알림줄은 바로 사라짐 */
  const css = `#hwb-snack{position:fixed;left:50%;bottom:calc(var(--hwb-nav,84px) + 12px);transform:translateX(-50%) translateY(16px);z-index:2147483000;background:#0f172a;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:min(440px,calc(100vw - 24px));box-sizing:border-box;font-family:inherit}
#hwb-snack.on{opacity:.97;transform:translateX(-50%);pointer-events:auto}
#hwb-snack span{flex:1 1 auto;line-height:1.35;word-break:keep-all}
#hwb-snack button{flex:0 0 auto;border:0;border-radius:10px;background:#fbbf24;color:#0f172a;font-size:15px;font-weight:900;padding:10px 14px;font-family:inherit}
#hwb-exit{position:fixed;inset:0;z-index:2147483001;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;font-family:inherit}
#hwb-exit.on{display:flex}
#hwb-exit .b{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(15,23,42,.25)}
#hwb-exit b{display:block;font-size:19px;color:#0f172a;margin-bottom:6px}
#hwb-exit p{margin:0 0 16px;color:#64748b;font-size:14.5px;line-height:1.55}
#hwb-exit .r{display:flex;gap:10px}
#hwb-exit .r button{flex:1;height:54px;border-radius:14px;font-size:17px;font-weight:900;font-family:inherit;border:1px solid #cbd5e1;background:#fff;color:#334155}
#hwb-exit .r button.go{border:0;background:#0f766e;color:#fff}
#hwb-bye{position:fixed;inset:0;z-index:2147483002;background:linear-gradient(160deg,#0f3b47,#134e5e 55%,#1e3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-family:inherit}
#hwb-bye div{font-size:15.5px;opacity:.88;line-height:1.6}#hwb-bye b{font-size:26px}
#hwb-bye button{margin-top:16px;border:0;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:800;background:#fff;color:#0f3b47;font-family:inherit}`;
  const el = id => document.getElementById(id);
  function ensure() {
    if (!el('hwb-css')) { const s = document.createElement('style'); s.id = 'hwb-css'; s.textContent = css; document.head.appendChild(s); }
    if (!el('hwb-snack')) { const d = document.createElement('div'); d.id = 'hwb-snack'; d.setAttribute('role', 'status'); d.innerHTML = '<span></span><button type="button" data-hwb-undo>다시 열기</button>'; document.body.appendChild(d);
      d.querySelector('button').addEventListener('click', () => { const f = B.undo; hideSnack(); if (f) { B.restoring = true; try { f(); } catch (e) { console.warn('[hwb undo]', e); } finally { B.restoring = false; } B.log.push('undo'); } }); }
    if (!el('hwb-exit')) { const d = document.createElement('div'); d.id = 'hwb-exit'; d.innerHTML = '<div class="b" role="dialog"><b></b><p>넣은 기록은 모두 저장돼 있습니다.<br>◁(뒤로)를 한 번 더 눌러도 나갑니다.</p><div class="r"><button type="button" data-no>계속 쓰기</button><button type="button" class="go" data-go>나가기</button></div></div>'; document.body.appendChild(d);
      d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-no]')) { closeExit(); return; } if (e.target.closest('[data-go]')) bye(); }); }
  }
  function navH() { try { const n = B.ad && B.ad.navEl && B.ad.navEl(); const r = n && n.getBoundingClientRect(); const vis = r && r.height > 0 && getComputedStyle(n).display !== 'none' && getComputedStyle(n).visibility !== 'hidden'; const h = vis ? Math.max(0, window.innerHeight - r.top) : 0; document.documentElement.style.setProperty('--hwb-nav', Math.round(h || 12) + 'px'); } catch (_) {} }   /* 606: 아래 메뉴는 position:fixed 라 offsetParent 가 비어 높이를 0 으로 봤음 → 알림줄이 메뉴를 가렸음. 이제 메뉴 윗선 위에 뜸 */
  function snack(msg, fn) { ensure(); navH(); const s = el('hwb-snack'); s.querySelector('span').textContent = msg; B.undo = fn || null; s.querySelector('button').style.display = fn ? '' : 'none'; s.classList.add('on'); clearTimeout(B.snackT); B.snackT = setTimeout(hideSnack, 5000); }
  function hideSnack() { clearTimeout(B.snackT); B.undo = null; const s = el('hwb-snack'); if (s) s.classList.remove('on'); }
  function exitOpen() { const e = el('hwb-exit'); return !!(e && e.classList.contains('on')); }
  function openExit() { ensure(); hideSnack(); const e = el('hwb-exit'); e.querySelector('b').textContent = ((B.ad && B.ad.title) || '앱') + ' — 나가시겠습니까?'; e.classList.add('on'); B.log.push('exit-ask'); }
  function closeExit() { const e = el('hwb-exit'); if (e) e.classList.remove('on'); }
  function bye() {
    closeExit(); hideSnack(); B.leaving = true; B.log.push('bye');
    const n = B.depth; B.depth = 0; if (n > 0) { try { history.go(-n); } catch (_) {} }
    try { window.close(); } catch (_) {}
    setTimeout(() => { if (!B.leaving) return; let d = el('hwb-bye'); if (!d) { d = document.createElement('div'); d.id = 'hwb-bye'; document.body.appendChild(d); }
      d.innerHTML = '<b>나갔습니다</b><div>넣은 기록은 모두 저장돼 있습니다.<br>휴대폰 ◁(뒤로)를 한 번 더 누르면 앱이 닫힙니다.</div><button type="button">다시 쓰기</button>';
      d.querySelector('button').onclick = () => { d.remove(); B.leaving = false; arm(); }; }, 260);
  }
    function back() {
    if (!B.ad) return 'none';
    if (exitOpen()) { bye(); return 'bye'; }
    let Ls = []; try { Ls = B.ad.layers() || []; } catch (_) {}
    for (const L of Ls) {
      let o = false; try { o = !!L.open(); } catch (_) {} if (!o) continue;
      let dirty = false; try { const box = L.el && L.el(); if (box) for (const t of B.typed) { if (t.isConnected && box.contains(t)) { dirty = true; break; } } } catch (_) {}
      let st; try { st = L.close(); } catch (e) { console.warn('[hwb close]', e); }
      B.typed.clear();
      if (dirty && L.reopen && st !== false) snack((L.label || '창') + ' 닫음 · 적던 값 보관', () => L.reopen(st)); else hideSnack();   /* 606: 글자를 넣던 창만 [다시 열기] — 메뉴 · 목록 · 보기 창은 그냥 닫음 */
      B.log.push('layer:' + (L.name || '')); return 'layer:' + (L.name || '');
    }
    let home = true; try { home = !B.ad.isHome || !!B.ad.isHome(); } catch (_) {}
    if (!home) { hideSnack(); B.restoring = true; try { B.ad.goHome(); } catch (e) { console.warn('[hwb home]', e); } finally { B.restoring = false; } B.log.push('home'); return 'home'; }   /* 606: 다른 탭 · 찾기 · 고른 카드 → 한 번에 첫 화면 */
    openExit(); return 'exit';
  }

    window.HWBack = {
    init(ad) { B.ad = ad; ensure(); if (!B.on) { B.on = true; push(); } },
    note() {},   /* 606: 화면마다 적어 두던 것 없앰(옛 호출 자리 그대로 두어도 됨) */
    reset() { hideSnack(); B.typed.clear(); },
    off() { B.on = false; hideSnack(); closeExit(); },
    back, arm, get on() { return B.on; }, get restoring() { return B.restoring; }, _B: B
  };
})();
/* hotfix600: 편직팀 앱 ◁ — 창(출고 · 사진 · 원단회사 · 메뉴) 먼저(적던 값 보관 · [되돌리기]) · 그다음 앞 탭(할 일 · 재고 · 이동 · 보낸 내역 · 설정) · 첫 화면이면 나가기 묻기 */
function hwbInit() {
  if (!window.HWBack || HWBack.on) return;
  HWBack.init({ title: '편직팀', navEl: () => $('nav'),
    isHome: () => S.tab === 'todo' && !S.kind,   /* 606: 첫 화면 = 할 일(종류 거르기 없음) · 고른 보낼 곳은 그대로 */
    goHome: () => { S.tab = 'todo'; S.kind = ''; render(); window.scrollTo(0, 0); },
    layers: () => [
      { name: 'kcam', label: '촬영', open: () => !!document.getElementById('kcam'), close: () => { const c = document.getElementById('kcam'); if (c && c.__close) c.__close(); return 1; } },   /* hotfix631: 송장 촬영 화면 ◁ → 촬영만 닫고 입력하던 창(값 그대로)으로 */
      { name: 'hwk', label: '창', open: () => !!(window.HWChat && HWChat.isOpen()), close: () => { HWChat.closeTop(); return 1; } },   /* hotfix620: 대화 메뉴 · 사진 보기 · 묻는 창 */
            { name: 'hwkp', label: '첨부', open: () => !!(S.kcKit && S.kcKit.el.isConnected && S.kcKit.panelOpen()), close: () => { S.kcKit.closePanel(); return 1; } },
      { name: 'hwks', label: '선택', open: () => !!(S.kcKit && S.kcKit.el.isConnected && S.kcKit.selOn()), close: () => { S.kcKit.setSel(null); return 1; } },
      { name: 'sheet', label: '입력 창', el: () => $('sheet'), open: () => $('sheet').classList.contains('on'),
        close: () => { const sh = $('sheet'); const st = { nodes: Array.from(sh.childNodes), ds: Object.assign({}, sh.dataset), y: (sh.querySelector('.sh') || {}).scrollTop || 0 }; sh.classList.remove('on'); sh.replaceChildren(); lockScroll(false); render(); return st; },
        reopen: st => { const sh = $('sheet'); if (sh.classList.contains('on')) return; sh.replaceChildren(...st.nodes); Object.keys(sh.dataset).forEach(k => delete sh.dataset[k]); Object.assign(sh.dataset, st.ds); sh.classList.add('on'); lockScroll(true); const b = sh.querySelector('.sh'); if (b) b.scrollTop = st.y; } },
      { name: 'drawer', label: '메뉴', open: () => $('drw').classList.contains('on'), close: () => { openDrw(false); return 1; }, reopen: () => openDrw(true) },
      { name: 'cohome', label: '원단회사 고르기', open: () => { const e = document.getElementById('cohome'); return !!(e && e.classList.contains('on')); }, close: () => { document.getElementById('cohome').classList.remove('on'); return 1; }, reopen: () => coHome(true) }
    ] });
}
window.__hwk = { S, render, kView, kPhotoBg };

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e3a8a">
<title>편직공장 ERP 미리보기 f15 (erp15)</title>
<style>
/* 편직공장 ERP f3 (erp3) — FABIWOS 가족 화면 (2026-10-11 대표: "FABIWOS 디자인을 따라 쉽게 다루게")
   PC = index.html 653 틀: 흰 머리줄(로고 · 화면 이름 · 기능 단추 · 이름/등급) · 왼쪽 메뉴(오늘 · 즐겨찾기 · 색 묶음 카테고리 접기 · 고른 표시) · 화면 제목 줄 · 업체코드식 [+ 추가] 펼침 입력 · 표
   휴대폰 = k.html 653 틀: 남청 머리 띠 · 앱 이름 칩 · 아래 탭 · 큰 카드 · 큰 단추
   색 · 글자 · 칸 · 모서리 변수는 네 앱과 같은 이름 · 같은 값(hotfix653 색기준 통일) — 휴대폰 값이 기본, PC 값은 body.pc
   화면 코드에 색 값을 직접 쓰지 않는다. 기계 종류 색만 자료(mtype.color)에서 온다(공장노트 6-3). sticky 는 기계 등록 머리띠 · PC 표 머리 두 곳만 */
:root{--brand-800:#1e3a8a;--brand-700:#1d4ed8;--brand-600:#2563eb;--brand-100:#eff6ff;--brand-line:#bfdbfe;--st-prog-bg:#fffbeb;--st-prog-ink:#92400e;--st-prog-line:#fcd34d;--st-prog-solid:#b45309;--st-ok-bg:#ecfdf5;--st-ok-ink:#065f46;--st-ok-line:#a7f3d0;--st-ok-solid:#047857;--st-warn-bg:#fff7ed;--st-warn-ink:#9a3412;--st-warn-line:#fed7aa;--st-warn-solid:#c2410c;--st-bad-bg:#fef2f2;--st-bad-ink:#b91c1c;--st-bad-line:#fecaca;--st-bad-solid:#b91c1c;--st-info-bg:#eaf1ff;--st-info-ink:#1d4ed8;--st-info-line:#bfdbfe;--st-info-solid:#1d4ed8;--st-adm-bg:#f1f5f9;--st-adm-ink:#334155;--st-adm-line:#cbd5e1;--st-adm-solid:#334155;--pr-knit:#047857;--pr-dye:#6d28d9;--pr-qc:#1d4ed8;--ink:#141b2d;--gray-700:#334155;--gray-600:#475569;--gray-500:#5b6678;--gray-300:#cbd5e1;--gray-200:#e2e8f0;--gray-100:#f1f5f9;--gray-50:#f8fafc;--surface:#fff;--fs-xs:12px;--fs-sm:13px;--fs-body:15px;--fs-md:17px;--fs-lg:19px;--fs-xl:22px;--fs-2xl:32px;--ctl-h:48px;--btn-s:24px;--btn-m:28px;--tap:48px;--r-s:8px;--r-m:12px;--r-l:16px;--r-xl:20px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--brand-900:#172554;--num:tabular-nums;--st-done-bg:#f1f5f9;--st-done-ink:#475569;--st-done-line:#cbd5e1;--st-done-solid:#64748b}
/* index.html 화면 토큰(hotfix150 · 443) · k.html 기본 글자색 */
:root{--font-gothic:'Pretendard Variable',Pretendard,'Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --ui-canvas:#f7f5f0;--ui-surface:#ffffff;--ui-line:#e8e4da;--ui-line-soft:#f0ede5;--ui-text:#1c2230;--ui-text-sub:#4b5563;--ui-text-mute:#646b78;
  --gold:#b8934a;--gold-line:#c9a45c;--gold-ink:#85672a;--gold-bg:#faf6ec;
  --ui-shadow-sm:0 1px 2px rgba(23,37,84,0.05),0 1px 3px rgba(23,37,84,0.06);--ui-shadow:0 6px 18px rgba(23,37,84,0.08),0 1px 3px rgba(23,37,84,0.05);--ui-shadow-lg:0 16px 44px rgba(23,37,84,0.18);--ui-focus:0 0 0 3px rgba(37,99,235,0.16);
  --erp-line:#e8e4da;--erp-blue-deep:#1e40af;--cat-sale:#3b4f7a;--cat-q:#3b4f7a;--cat-stock:#3b4f7a;--fav:#85672a;
  --sub:#475569;--dim:#94a3b8;--line:#e6e2d8;--red:#dc2626;--amber:#b45309;
  /* 이 앱만 쓰는 것 — 자동값(파랑) · 손으로 고친 값(주황) (공장노트 5-3) */
  --auto:#0e7490;--auto-bg:#ecfeff;--man:#9a3412;--man-bg:#fff7ed}
body.pc{--fs-xs:11px;--fs-sm:12px;--fs-body:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:28px;--ctl-h:36px;--btn-s:24px;--btn-m:28px;--tap:36px;--btn-pc:36px;--r-s:6px;--r-m:8px;--r-l:12px;--r-xl:16px;--row-h:36px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ui-canvas);color:var(--ink);font:16px/1.5 var(--font-gothic);letter-spacing:-0.01em;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{min-height:var(--tap);padding:0 14px;border-radius:var(--r-m);border:1px solid var(--gray-300);background:var(--surface);color:var(--gray-700);font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--brand-line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
.btn-p{background:var(--brand-700);border-color:var(--brand-700);color:#fff;font-weight:800}
.btn-p:hover{background:var(--brand-800);border-color:var(--brand-800)}
.btn-l{min-height:52px;font-size:17px}
.btn-xl{min-height:60px;font-size:20px;width:100%;border-radius:var(--r-l);font-weight:900}
.btn-t{border-color:transparent;background:transparent;color:var(--brand-700);text-decoration:underline;text-underline-offset:3px}
.btn-t:hover{border-color:transparent}
input,select,textarea{min-height:var(--tap);width:100%;padding:8px 12px;border:1px solid var(--gray-300);border-radius:var(--r-m);background:var(--ui-surface);font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand-600);box-shadow:var(--ui-focus);outline:0}
textarea{min-height:88px;resize:vertical}
input[readonly]{background:var(--gray-50)}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:20px;font-weight:900;letter-spacing:-.3px}
h3{font-size:16px}
.sub{color:var(--gray-600);font-size:14px}
.na{color:var(--gray-500);font-size:13px}
.msg{color:var(--st-bad-ink);font-size:15px;font-weight:700;min-height:0}
.msg:empty{display:none}
.msg.ok{color:var(--st-ok-ink)}
.code{font-family:inherit;font-variant-numeric:tabular-nums;font-size:13px;color:var(--gray-600);overflow-wrap:anywhere}
.mono{font-family:inherit;font-variant-numeric:tabular-nums}   /* f7: 번호 칸 모노폰트 → Pretendard + 고정폭 숫자 */
.sp{flex:1 1 auto}
/* 꼬리표 — FABIWOS 표 안 알약 */
.pill{display:inline-block;padding:1px 9px;border-radius:var(--r-s);font-size:13px;font-weight:800;line-height:1.5;white-space:nowrap;background:var(--gray-200);color:var(--gray-700)}
.pill+.pill{margin-left:4px}
.pill.bl{background:var(--st-info-bg);color:var(--st-info-ink)}
.pill.gr{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.pill.am{background:var(--st-prog-bg);color:var(--st-prog-ink)}
.pill.pu{background:var(--gray-100);color:var(--pr-dye)}
.pill.or{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.pill.rd{background:var(--st-bad-bg);color:var(--st-bad-ink)}
.badge{display:inline-block;font-size:13px;font-weight:800;border-radius:var(--r-s);padding:0 8px;background:var(--auto-bg);color:var(--auto);border:1px solid var(--st-info-line);white-space:nowrap;line-height:1.5}
.badge.man{background:var(--man-bg);color:var(--man);border-color:var(--st-warn-line)}
.badge.off{background:var(--gray-100);color:var(--gray-600);border-color:var(--gray-300)}

/* 로그인 — k.html 로그인처럼 남청 바탕 + 흰 카드 */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(120% 70% at 20% 0%,var(--brand-600) 0%,var(--brand-700) 45%,var(--brand-800) 100%)}
.lg{width:100%;max-width:380px;background:var(--surface);border-radius:var(--r-xl);padding:26px 22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ui-shadow-lg)}
.lg h1{font-size:24px;font-weight:900;color:var(--brand-800);letter-spacing:-.3px}
.lg .fac{display:flex;align-items:center;gap:6px}
.lg .fac span{font-weight:800;color:var(--gray-600)}
.lg input{min-height:52px;font-size:18px}
.fl-l{font-size:14px;font-weight:700;color:var(--gray-600)}

/* ===== 틀: 머리 띠 · (왼쪽 메뉴) · 본문 · 고정 단추 띠 · 아래 탭 — 본문만 스크롤 ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{flex:0 0 auto;position:relative;z-index:6;display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 14px 8px 12px;background:var(--brand-800);color:#fff;box-shadow:var(--ui-shadow)}
.mnb{flex:none;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:var(--r-m);background:rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.mnb i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ui-surface)}
.hd-m{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.apc{display:inline-block;font-size:19px;font-weight:900;letter-spacing:.5px;line-height:1.3;padding:1px 0;white-space:nowrap}
.hd-s{max-width:100%;font-size:13.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s #rl::before{content:' · '}
#top .tt{display:none}
#net{flex:none;font-size:13px;font-weight:800;background:var(--st-warn-bg);color:var(--st-warn-ink);border-radius:var(--r-s);padding:2px 8px}
#demo-bar{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:32px}
#err-bar{flex:0 0 auto;background:var(--st-bad-bg);color:var(--st-bad-ink);font-size:14px;padding:6px 12px}
#err-bar:empty{display:none}
#body{flex:1 1 auto;display:flex;min-height:0}
#main{flex:1 1 auto;min-width:0;overflow:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
/* 아래 탭 — k.html .nav */
#bot{flex:0 0 auto;display:flex;gap:2px;background:var(--ui-surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:var(--ui-shadow-sm)}
#bot button{flex:1 1 0;min-width:0;min-height:54px;border:0;background:none;border-radius:var(--r-m);padding:5px 2px;font-size:13px;font-weight:800;color:var(--gray-500);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
#bot button svg{width:24px;height:24px}
#bot button.on{color:var(--brand-700);background:var(--brand-100)}
/* 휴대폰 메뉴 — k.html 서랍 */
#side{position:fixed;z-index:55;left:0;top:0;bottom:0;width:min(84vw,340px);background:var(--ui-surface);overflow:auto;overscroll-behavior:contain;transform:translateX(-105%);transition:transform .2s ease-out;padding:0 0 calc(20px + env(safe-area-inset-bottom));box-shadow:var(--ui-shadow-lg)}
#side.open{transform:none}
.sd-who{background:var(--brand-800);color:#fff;padding:18px 18px 16px}
.sd-who b{display:block;font-size:21px;font-weight:900}
.sd-who .sub{color:#fff;opacity:.88;font-size:13.5px}
.sd-g{padding:2px 10px}
.sd-c{margin:12px 8px 4px;font-size:13px;font-weight:800;color:var(--gray-500);letter-spacing:.5px}
.sd-i{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;border:0;background:none;border-radius:var(--r-m);padding:0 12px;font-size:16.5px;font-weight:700;color:var(--ink);text-align:left}
.sd-i:hover{border:0;background:var(--gray-100)}
.sd-i.on{background:var(--brand-100);color:var(--brand-800)}
.sd-i small{flex:none;background:var(--gray-100);color:var(--gray-500);border-radius:var(--r-s);padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.sd-i.nx{color:var(--gray-500);font-weight:600}
.sd-f{margin:14px 10px 0;padding:12px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sd-f .na{padding-left:4px}
@media (min-width:900px){
  #side{position:static;transform:none;flex:0 0 250px;width:250px;transition:none;box-shadow:none;border-right:1px solid var(--line)}
  #menuBtn,#bot{display:none!important}
  #main{padding:20px 28px}
}
#dim{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:none}
#dim.on{display:block}
/* 창 — 휴대폰은 아래에서 올라오는 판 · 넓으면 가운데 */
#sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:none;box-shadow:var(--ui-shadow-lg)}
#sheet.on{display:block}
#sheet h2{font-size:20px;padding-right:4px}
@media (min-width:700px){#sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);border-radius:var(--r-m);max-height:88vh;padding:20px 22px;box-shadow:var(--ui-shadow-lg)}}
#ask{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}
#ask.on{display:flex}
.ask-in{background:var(--surface);border-radius:var(--r-l);padding:20px 18px 16px;width:min(440px,100%);display:flex;flex-direction:column;gap:16px;box-shadow:var(--ui-shadow-lg)}
.ask-t{font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.ask-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ask-b button{min-width:100px}
#toast{position:fixed;z-index:90;pointer-events:none;left:50%;top:auto;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:var(--r-m);padding:10px 16px;font-size:15px;font-weight:700;max-width:92vw;display:none;box-shadow:var(--ui-shadow-lg)}
#toast.on{display:block}
body.pc #toast{bottom:24px}
body.fxb #toast{top:72px;bottom:auto}   /* 고정 단추 띠([저장] · [다음])가 있는 화면은 위쪽 — 단추를 덮지 않게 */
/* 고정 단추 띠 — 본문과 아래 탭 사이(스크롤 밖 · sticky 아님): 중량 [저장] · 기계 등록 [이전][다음] 이 늘 같은 자리 */
#fixbar{flex:0 0 auto;padding:8px 14px;background:var(--ui-canvas);border-top:1px solid var(--line)}
#fixbar:empty{display:none}
#fixbar>div{max-width:640px;margin:0 auto}
#fixbar .kpw{max-width:480px}
#done{position:fixed;z-index:85;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,58,138,.92);color:#fff;text-align:center;padding:16px}
#done.on{display:flex}
#done b{display:block;font-size:46px;letter-spacing:.02em;line-height:1.2;font-weight:900}
#done span{display:block;font-size:30px;margin-top:6px;font-weight:800}

/* ===== 공통 덩어리 (휴대폰) ===== */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1 1 180px;min-width:0}
.bar h2{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.empty{background:var(--surface);border:1px dashed var(--gray-300);border-radius:var(--r-l);padding:20px 16px;color:var(--gray-600);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface)}
.seg button.on{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.ck{display:inline-flex;align-items:center;gap:7px}
.ck::before{content:'';flex:none;width:15px;height:15px;border:1.5px solid var(--gray-500);border-radius:4px;background:var(--ui-surface)}
.ck.on::before{background:var(--brand-700);border-color:var(--brand-700);box-shadow:inset 0 0 0 2.5px #fff}
.sec-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:800;color:var(--gray-600);margin:16px 2px 8px}
.sec-t span{font-size:13px;font-weight:600;color:var(--gray-500)}
.nx1{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:4px;max-width:720px}
.nx1 b{font-size:16px}
.nx1 .sub{font-size:14px}

/* 표 — 넓으면 표, 휴대폰은 한 줄씩 카드 */
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:var(--gray-50);color:var(--gray-600);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ui-line);white-space:nowrap}
.tb td{padding:6px 10px;border-bottom:1px solid var(--ui-line-soft);vertical-align:middle;white-space:nowrap}
.tb tr.off td{color:var(--gray-500)}
.tb .acts{display:flex;gap:6px;flex-wrap:nowrap}
.tb .acts button{min-height:var(--tap);padding:0 12px;font-size:14px}
.tb td.wr{white-space:normal;min-width:120px;overflow-wrap:anywhere}
.acts button[data-act="off"],.acts button[data-act="end"]{border-color:var(--st-bad-line);color:var(--st-bad-ink)}
.acts button[data-act="on"]{border-color:var(--st-ok-line);color:var(--st-ok-ink)}
@media (max-width:699px){
  .tbw{background:transparent;border:0;border-radius:0;overflow:visible}
  .tb.cardy thead{display:none}
  .tb.cardy,.tb.cardy tbody,.tb.cardy tr,.tb.cardy td{display:block;width:100%}
  .tb.cardy tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:10px;padding:10px 0 8px;box-shadow:var(--ui-shadow-sm)}
  .tb.cardy tr.off{background:var(--gray-50)}
  .tb.cardy td{display:flex;gap:10px;white-space:normal;border:0;padding:3px 14px;overflow-wrap:anywhere;font-size:15px}
  .tb.cardy td::before{content:attr(data-l);flex:0 0 96px;color:var(--gray-500);font-size:13px;font-weight:700;padding-top:2px}
  .tb.cardy td .v{flex:1 1 auto;min-width:0}
  .tb.cardy td.act{padding-top:8px}
  .tb.cardy td.act::before{content:none}
  .tb.cardy td::before{text-align:left}   /* f11 H6: 숫자 칸(.num)도 이름은 왼쪽 — 가마 코드 휴대폰 카드에서 기계인치 · 피더 · 게이지 이름이 밀리던 것 */
  .tb.cardy .acts{flex-wrap:wrap}
  .tb.cardy .acts button{flex:1 1 auto}
}

/* 양식 */
.form{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.fl{display:flex;flex-direction:column;gap:5px}
.fl-l em{font-style:normal;color:var(--st-bad-ink);font-size:13px;margin-left:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.f3{grid-template-columns:1fr 1fr}}
.ro{min-height:var(--tap);display:flex;align-items:center;padding:0 2px}
.photo-ph{border:1px dashed var(--gray-300);border-radius:var(--r-s);padding:14px;color:var(--gray-600);font-size:14px;background:var(--gray-50)}
.sh-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.sh-b button{min-width:92px}
/* 게이지 — 자동값은 파란 테두리, 손으로 고친 값은 주황 테두리 (공장노트 5-3) */
.gin.g-auto{border:2px solid var(--auto);background:var(--auto-bg)}
.gin.g-man{border:2px solid var(--man);background:var(--man-bg)}
.gs{font-size:16px;color:var(--auto);font-weight:700;overflow-wrap:anywhere}
.au{border:2px solid var(--auto)!important;background:var(--auto-bg)!important}
.mn{border:2px solid var(--man)!important;background:var(--man-bg)!important}

/* ===== 휴대폰 첫 화면: 오늘 요약 · [생산 적기] · 호기 판 ===== */
.bd-sum{background:linear-gradient(135deg,var(--brand-100),#fff);border:1px solid var(--brand-line);border-radius:var(--r-xl);padding:12px 14px}
.bd-d{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bd-d b{font-size:18px;font-weight:900;color:var(--brand-800)}
.bd-d span{font-size:14px;font-weight:700;color:var(--gray-600)}
.kd-t{width:100%;margin-top:8px;border-collapse:separate;border-spacing:0;background:var(--ui-surface);border:1px solid var(--gray-200);border-radius:var(--r-m);overflow:hidden;table-layout:fixed}
.kd-t th{padding:6px 2px 0;font-size:13px;font-weight:700;color:var(--gray-500);text-align:center}
.kd-t td{padding:0 2px 7px;text-align:center;white-space:nowrap;font-size:14px;color:var(--gray-600)}
.kd-t td b{font-size:24px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.kd-t td+td,.kd-t th+th{border-left:1px solid var(--gray-100)}
.k-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:68px;margin:12px 0 4px;border:0;border-radius:var(--r-l);padding:12px 8px;background:var(--brand-700);color:#fff;font-size:21px;font-weight:900;box-shadow:var(--ui-shadow)}
.k-go small{font-size:13.5px;font-weight:700;opacity:.9}
.k-go:hover{background:var(--brand-800)}
.hgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hg{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--r-l);padding:10px 12px 10px 16px;min-height:122px;display:flex;flex-direction:column;gap:2px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:var(--ui-shadow-sm)}
.hg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.hg:active,.hg:hover{background:var(--brand-100)}
.hg-no{font-size:23px;font-weight:900;line-height:1.2}
.hg-sp{font-size:13px;color:var(--gray-600)}
.hg-it{font-size:15px;font-weight:800;overflow-wrap:anywhere;line-height:1.35}
.hg-cu{font-size:13px;color:var(--gray-600)}
.hg-to{margin-top:auto;font-size:14px;color:var(--gray-600)}
.hg-to b{font-size:18px;font-weight:900;color:var(--brand-800)}
.hg.stop{background:var(--gray-100)}
.hg.noit .hg-it{color:var(--gray-500);font-weight:700}
.hg.noit::before{background:color-mix(in srgb,var(--tc) 40%,#ffffff)}
/* [생산 적기] 호기 고르기 창 */
.pk-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pk-h h2{flex:1 1 auto}
.pk-last{width:100%;min-height:56px;margin-bottom:10px;border:2px solid var(--brand-700);background:var(--brand-100);color:var(--brand-800);font-size:17px;font-weight:900;border-radius:var(--r-m)}
.pk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pk-g button{position:relative;overflow:hidden;min-height:70px;padding:6px 6px 6px 12px;border-radius:var(--r-m);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:0}
.pk-g button::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc)}
.pk-g b{font-size:22px;font-weight:900;color:var(--ink)}
.pk-g small{font-size:13px;font-weight:600;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* 중량 키패드 */
.kp{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.kp .msg{min-height:22px;line-height:22px}
.kp .msg:empty{display:block}
.kp-h{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--gray-200);border-radius:var(--r-l);padding:8px 12px 8px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--ui-shadow-sm)}
.kp-h::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.kp-t{font-size:16px;overflow-wrap:anywhere}
.kp-t b{font-size:21px;font-weight:900}
.kp-n{font-size:15px;color:var(--gray-600)}
.kp-n b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--brand-800)}
.kp-hb{display:flex;gap:6px;flex-wrap:wrap}
.kp-v{background:var(--surface);border:2px solid var(--brand-700);border-radius:var(--r-l);padding:2px 16px;text-align:right;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}
.kp-v small{font-size:20px;margin-left:6px;color:var(--gray-600)}
.kp-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-k button{min-height:52px;font-size:26px;font-weight:800;border-radius:var(--r-m);border-color:var(--gray-200);color:var(--ink);box-shadow:var(--ui-shadow-sm)}
.kp-k button:active{background:var(--brand-100)}
.kp-k button[data-k="지움"]{font-size:18px;color:var(--gray-600)}
.kp-rec{font-size:14px;color:var(--gray-600);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 12px}
.kp-rec summary{min-height:44px;display:flex;align-items:center;font-weight:800;color:var(--gray-700);cursor:pointer}
.kp-rec[open]{padding-bottom:8px}
.hg-flt{margin-bottom:8px}
.hg-more{width:100%;margin-top:10px;border-style:dashed;color:var(--gray-600)}
body.pc .hg-flt button,body.pc .hg-more{min-height:var(--btn-pc);height:var(--btn-pc);font-size:13px;padding:0 12px}
.kp-rec div{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.kp-rec div b{font-variant-numeric:tabular-nums;color:var(--ink)}

/* 일지 */
.dl-g{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);margin-bottom:12px;overflow:hidden;box-shadow:var(--ui-shadow-sm)}
.dl-g::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.dl-gh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px 8px 18px;background:var(--brand-100)}
.dl-gh b{font-size:18px;font-weight:900}
.dl-gh .sp{flex:1 1 auto}
.dl{width:100%;border-collapse:collapse;font-size:15px}
.dl th{font-size:13px;color:var(--gray-500);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:700}
.dl th:first-child,.dl td:first-child{padding-left:18px}
.dl td{padding:0 10px;height:48px;border-bottom:1px solid var(--line);cursor:pointer}
.dl tr:hover td{background:var(--gray-50)}
.dl td.no{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.dl td.kg{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl td.nt{color:var(--gray-600);font-size:14px;overflow-wrap:anywhere}
.st-ok{color:var(--st-ok-ink);font-weight:700}
.st-cut{color:var(--st-warn-ink);font-weight:700}
.st-wait{display:inline-block;background:var(--st-prog-bg);color:var(--st-prog-ink);border:1px solid var(--st-prog-line);border-radius:var(--r-s);padding:0 8px;font-size:13px;font-weight:800;white-space:nowrap}
@media (max-width:699px){.dl .it{display:none}}
.ra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ra button{min-height:54px;font-size:17px;font-weight:800;border-radius:var(--r-m)}
.hist{font-size:14px;color:var(--gray-600);margin-top:10px}
.hist div{padding:3px 0;border-bottom:1px dashed var(--line)}

/* 기계 등록 — 휴대폰 한 화면 한 질문 */
.wz{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wz-top{display:flex;align-items:center;gap:8px}
.wz-top .pg{margin-left:auto;font-weight:800;color:var(--gray-600)}
.wz-fold{display:flex;flex-direction:column;gap:6px}
.wz-fold button{text-align:left;padding:8px 12px;border-left:6px solid var(--tc);font-size:14px;line-height:1.45;white-space:normal;border-radius:var(--r-m)}
.wz-head{position:sticky;top:0;z-index:3;background:var(--tc);color:#fff;border-radius:var(--r-m);padding:10px 14px;font-weight:900;font-size:17px}
.wz-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ui-shadow-sm)}
.wz-q h2{font-size:20px}
.wz-q input{font-size:22px;min-height:56px;font-weight:700}
.wz-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wz-types button{min-height:60px;background:var(--tc);border-color:var(--tc);color:#fff;font-size:19px;font-weight:900;border-radius:var(--r-m)}
.wz-types button.add{background:var(--surface);color:var(--brand-700);border:1px dashed var(--brand-line);font-size:16px}
.wz-quick{display:flex;flex-wrap:wrap;gap:8px}
.wz-quick button{min-width:72px;min-height:50px;font-size:18px;font-weight:800;border-radius:var(--r-m)}
.wz-nav{display:flex;gap:8px}
.wz-nav button{flex:1 1 0;min-height:56px;font-size:18px;border-radius:var(--r-l)}
.wz-more{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wz-more button{min-height:60px;font-size:17px;font-weight:800;border-radius:var(--r-m)}
.wz-more button.end{grid-column:1/-1;background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.wz-prop{font-size:18px;font-weight:800;line-height:1.7}
.wz-res li{margin:3px 0;overflow-wrap:anywhere}

/* 기계 코드 목록 — 종류마다 세로 띠 (공장노트 6-3) */
.tgrp{border-left:6px solid var(--tc);background:var(--surface);border-radius:var(--r-l);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px;padding:10px 14px;box-shadow:var(--ui-shadow-sm)}
.tgrp>h3{color:var(--tc);font-size:17px;font-weight:900;margin-bottom:6px}
.spec{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.spec:first-of-type{border-top:0}
.spec.off{opacity:.75}
.sp-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px}
.sp-chips button{min-width:64px;font-weight:800}
.sp-chips button.off{color:var(--gray-500);border-style:dashed}
.sp-g{font-size:14px;color:var(--gray-600)}
.sp-act{display:flex;flex-wrap:wrap;gap:6px}

/* 쉬운 등록 — 휴대폰 한 화면 한 질문 (기계 등록과 같은 모양) */
.qw{display:flex;flex-direction:column;gap:12px}
.qw-top{display:flex;align-items:center;gap:8px}
.qw-top b{font-size:17px}
.qw-top .pg{margin-left:auto;font-weight:800;color:var(--gray-600)}
.qw-fold{display:flex;flex-direction:column;gap:6px}
.qw-fold button{display:flex;gap:8px;align-items:center;text-align:left;white-space:normal;line-height:1.4;padding:6px 12px;border-left:5px solid var(--brand-700);font-size:15px;border-radius:var(--r-m)}
.qw-fold button span{flex:0 0 auto;color:var(--gray-600);font-size:13px}
.qw-q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px}
.qw-q h2{font-size:20px}
.qw-q .form{margin:0}
.qw-q input:not([type=date]){font-size:19px;min-height:52px;font-weight:700}
.qw-hint{color:var(--auto);font-size:15px;font-weight:700;overflow-wrap:anywhere}
.qw-hint:empty{display:none}
.qw-nav{display:flex;gap:8px}
.qw-nav button{flex:1 1 0;min-height:56px;font-size:18px;border-radius:var(--r-l)}
.qw-alt{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.qw-done{background:var(--st-ok-bg);border:1px solid var(--st-ok-line);border-radius:var(--r-l);padding:18px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.qw-done b{font-size:20px;color:var(--st-ok-ink)}
.qw-done .nm{font-size:18px;font-weight:800;overflow-wrap:anywhere}

/* ===== PC 관리자 틀 (body.pc) — index.html 653 과 같은 모양 · 글자 13px 이상 · 표 줄 32px ===== */
.pc-only{display:none!important}
body.pc .pc-only{display:inline-flex!important}
body.pc #top{min-height:56px;padding:0 16px 0 0;gap:12px;background:var(--ui-surface);color:var(--ui-text);box-shadow:none;border-bottom:1px solid var(--ui-line)}
body.pc .mnb{background:var(--gray-100);border:1px solid var(--erp-line);margin-left:10px}
body.pc .mnb i{background:var(--gray-700)}
body.pc #top .brand{order:0;flex-direction:column;justify-content:center;flex:0 0 232px;align-self:stretch;padding:0 18px;border-right:1px solid var(--erp-line);cursor:pointer}
body.pc #top .brand b{font-size:19px;font-weight:900;color:var(--erp-blue-deep);letter-spacing:-.3px;line-height:1.2}
body.pc #top .brand small{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:0}
body.pc #top .tt{order:1;display:block;flex:1 1 auto;min-width:0;padding-left:6px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.pc #net{order:2}
body.pc .hb{order:3;align-items:center;gap:6px}
body.pc .hd-m{order:4;flex:0 0 auto;align-items:flex-end;gap:0;max-width:220px}
body.pc .apc{display:none}
body.pc .hd-s{opacity:1;font-size:13px;color:var(--gray-600);font-weight:700}
body.pc #fn{color:var(--ink);font-weight:800}
body.pc #viewBtn{order:5}
body.pc #top button{align-items:center;justify-content:center;min-height:var(--btn-pc);height:var(--btn-pc);padding:0 14px;font-size:13px;font-weight:800;border-radius:var(--r-s)}
body.pc #top .mnb{width:36px;height:36px;min-height:36px;padding:0}
.hb button{background:var(--brand-700);border:1px solid var(--brand-700);color:#fff}
.hb button:hover{background:var(--brand-800)}
.hb button.lt{background:var(--st-info-bg);border-color:var(--st-info-line);color:var(--st-info-ink)}
.hb button.gy,#viewBtn{background:var(--st-adm-bg);border-color:var(--st-adm-line);color:var(--st-adm-ink)}
.hb button.on{background:var(--brand-800);border-color:var(--brand-800);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand-700)}
.hb button.lt.on,.hb button.gy.on{background:var(--st-info-bg);color:var(--st-info-ink);border:2px solid currentColor;box-shadow:none;padding:0 13px}
body.pc #bot{display:none!important}
@media (max-width:899px){body.pc #top .brand,body.pc .hb{display:none!important}}
@media (min-width:900px){body.pc #menuBtn{display:none!important}}
/* PC 왼쪽 메뉴 — index.html .hwside (흰 바탕 · 카테고리 색 묶음 · 고른 화면 색 · 즐겨찾기) */
body.pc #side{background:var(--ui-surface);border-right:1px solid var(--erp-line);padding:8px 8px 16px;box-shadow:none}
@media (min-width:900px){body.pc #side{flex:0 0 232px;width:232px}}
body.pc .sd-who{display:none}
.sd-home{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;height:36px;margin:0 0 4px;padding:0 10px;border:0;border-radius:var(--r-s);background:var(--brand-100);color:var(--brand-800);font-size:14px;font-weight:800;text-align:left}
.sd-home svg{width:18px;height:18px;flex:none}
.sd-home:hover{border:0;background:#dbeafe}
.sd-home.on{background:var(--brand-700);color:#fff}
body.pc .sd-g{--gc:var(--gray-600);padding:0;margin-top:8px}
.sd-fh{min-height:30px;display:flex;align-items:center;padding:0 10px;border-radius:var(--r-s);font-size:13px;font-weight:800;color:var(--gc);background:color-mix(in srgb,var(--gc) 9%,#fff);box-shadow:inset 3px 0 0 var(--gc);margin-bottom:3px}
.sd-fe{font-size:13px;color:var(--gray-500);padding:4px 10px 6px 18px;line-height:1.5}
.sd-fi{display:flex;align-items:center;width:100%;height:32px;min-height:32px;padding:0 8px 0 18px;border:0;border-radius:var(--r-s);background:none;font-size:13px;font-weight:600;color:var(--gray-700);text-align:left}
.sd-fi:hover{border:0;background:var(--gray-100);color:var(--erp-blue-deep)}
.sd-fi.on{background:color-mix(in srgb,var(--gc) 10%,#fff);color:var(--gc);font-weight:800}
body.pc .sd-c{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;height:32px;margin:0 0 3px;padding:0 10px;border:0;border-radius:var(--r-s);background:color-mix(in srgb,var(--gc) 9%,#fff);box-shadow:inset 3px 0 0 var(--gc);color:var(--gc);font-size:13px;font-weight:800;letter-spacing:-.1px;text-align:left}
body.pc .sd-c::after{content:'';flex:0 0 auto;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-right:2px;opacity:.7}
body.pc .sd-c[aria-expanded="true"]::after{transform:rotate(45deg)}
body.pc .sd-c:hover{background:color-mix(in srgb,var(--gc) 16%,#fff)}
body.pc .sd-i{height:32px;min-height:32px;padding:0 6px 0 18px;border-radius:var(--r-s);font-size:13px;font-weight:600;color:var(--gray-700)}
body.pc .sd-i:hover{background:var(--gray-100);color:var(--erp-blue-deep)}
body.pc .sd-i.on{background:color-mix(in srgb,var(--gc) 10%,#fff);color:var(--gc);font-weight:800}
body.pc .sd-i.nx{color:var(--dim);font-weight:500}
body.pc .sd-i small{background:none;padding:0;font-size:13px;font-weight:600;color:var(--dim)}
.sd-st{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-s);color:var(--gray-300);visibility:hidden}
.sd-st svg{width:14px;height:14px}
.sd-i:hover .sd-st,.sd-st.on{visibility:visible}
.sd-st.on{color:#eab308}
.sd-st.on svg{fill:currentColor}
.sd-st:hover{background:#fef9c3;color:#a16207}
body.pc .sd-f{margin:14px 0 0;padding:10px 4px 0}
body.pc .sd-f button{min-height:var(--btn-pc);height:var(--btn-pc);font-size:13px;border-radius:var(--r-s)}
body.pc .sd-f .na{font-size:13px}
body.pc #main{padding:0}
body.pc #main.np{padding:16px 20px}
body.pc #fixbar{background:var(--ui-surface);border-top-color:var(--ui-line)}
body.pc #sheet button{min-height:36px;font-size:14px}
body.pc #sheet input,body.pc #sheet select{min-height:38px;font-size:14px;border-radius:var(--r-s)}
body.pc #sheet textarea{font-size:14px;border-radius:var(--r-s)}
body.pc .fl-l{font-size:13px}
body.pc .sub{font-size:13px}
/* PC 화면 한 장: 제목 줄(흰 띠) + 몸통 */
.pcv{display:flex;flex-direction:column;height:100%;min-height:0;font-size:13px}
.pcv button{min-height:var(--btn-pc,36px);height:var(--btn-pc,36px);padding:0 14px;font-size:13px;border-radius:var(--r-s)}
.pcv input,.pcv select{min-height:var(--btn-pc,36px);padding:3px 10px;font-size:13px;border-radius:var(--r-s);border-color:var(--ui-line)}

.qa-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.qa-b{display:flex;gap:6px;margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.selsum{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);margin:var(--sp-2) 0;background:var(--ui-surface);border:1px solid var(--brand-line);border-radius:var(--r-m);box-shadow:var(--ui-shadow-sm)}

.sh-b.ib6-f .inv-b{margin:0}

/* 송장 (화면 · 인쇄 같은 구성 · 흑백 인쇄해도 읽힘) */
.inv{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--ui-shadow-sm);font-size:14px;color:var(--ink)}

.inv-t{display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.inv-t b{font-size:20px;font-weight:800;color:var(--brand-900)}
.inv-t span{font-size:13px;color:var(--ui-text-sub)}
.inv-p{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin:var(--sp-3) 0}
.inv-p>div{border:1px solid var(--ui-line);border-radius:var(--r-s);padding:var(--sp-2) var(--sp-3);display:flex;flex-direction:column;min-width:0}

.inv-tb{width:100%;border-collapse:collapse;font-size:14px}

.inv-ft{display:flex;justify-content:space-between;gap:var(--sp-3);margin-top:var(--sp-3);font-size:13px;color:var(--ui-text-sub)}

.rt-r{display:flex;flex-direction:column;gap:var(--sp-1)}
.rt-r .seg{align-self:flex-end}
.pc-list{display:flex;flex-direction:column;margin:var(--sp-3) 0;max-height:52vh;overflow:auto;border:1px solid var(--ui-line);border-radius:var(--r-m)}
.pl-r{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto auto;gap:var(--sp-2);align-items:center;min-height:44px;padding:0 var(--sp-3);border-bottom:1px solid var(--ui-line-soft);font-size:14px}

.hgsel button b{font-size:20px}

.hgsel button.on{border:2px solid var(--brand-700);background:var(--brand-100)}
.big-num{font-size:32px!important;font-weight:800;min-height:56px!important;font-variant-numeric:var(--num);text-align:right}
/* 일일 마감 한 장 */
.close-sheet{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--r-l);padding:var(--sp-4);box-shadow:var(--ui-shadow-sm);display:flex;flex-direction:column;gap:var(--sp-3);max-width:640px}
.cs-h{display:flex;align-items:center;gap:var(--sp-2);padding-bottom:var(--sp-2);border-bottom:1px solid var(--gold-line)}
.cs-h b{font-size:var(--fs-lg);font-weight:800;flex:1 1 auto}
.cs-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:var(--sp-2);text-align:left}
.cs-big>div{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.cs-big span{font-size:13px;color:var(--ui-text-sub);font-weight:600}
.cs-big b{font-size:var(--fs-2xl);font-weight:800;text-align:left;line-height:1.2}
.cs-big small{font-size:13px;color:var(--ui-text-sub)}
.cs-band{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-m);background:var(--st-prog-bg);color:var(--st-prog-ink);font-size:13px;font-weight:700}
.cs-warn{padding:var(--sp-2) var(--sp-3);border-radius:var(--r-m);background:var(--st-warn-bg);color:var(--st-warn-ink);border:1px solid var(--st-warn-line);font-size:13px;font-weight:700}
.cs-t{width:100%;border-collapse:collapse;font-size:14px}
.cs-t th{text-align:left;font-weight:600;color:var(--ui-text-sub);padding:6px 0}
.cs-t td{padding:6px 0 6px var(--sp-3);border-bottom:1px solid var(--ui-line-soft)}
.cs-b{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.cs-b .btn-p{flex:1 1 auto}
.set-f{max-width:520px}
#print{display:none}
.skel-w{display:flex;flex-direction:column;gap:12px;padding:var(--sp-4) 0;opacity:0;animation:skIn 0s .3s forwards}
.skel{display:block;height:14px;border-radius:7px;background:var(--gray-200);animation:skP 1.2s ease-in-out infinite}
.skel:nth-child(2n){width:82%}.skel:nth-child(3n){width:64%}
@keyframes skIn{to{opacity:1}}
@keyframes skP{50%{opacity:.55}}
/* 상세 옆 창 (PC 폭 700 이상 · 송장 · 절 목록 · 파레트) — 오른쪽에서 열림 · 휴대폰은 아래에서 올라오는 판 그대로 */
.drw-h{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.drw-h h2{flex:1 1 auto}
.drw-x{width:var(--tap);min-width:44px;padding:0;font-size:22px;line-height:1}
@media (min-width:700px){
  #sheet.drw{left:auto;right:0;top:0;bottom:0;transform:none;width:min(480px,92vw);max-height:none;height:100%;border-radius:0;padding:0 20px 20px;box-shadow:var(--ui-shadow-lg);animation:drwIn .22s ease-out}
  #sheet.drw .drw-h{position:sticky;top:0;z-index:2;background:var(--ui-surface);min-height:64px;margin:0 -20px var(--sp-3);padding:0 20px;border-bottom:1px solid var(--gold-line)}
  #sheet.drw .sh-b{position:sticky;bottom:-20px;background:var(--ui-surface);padding:var(--sp-3) 0;border-top:1px solid var(--ui-line)}
}
@keyframes drwIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#sheet.drw{animation:none}}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;padding:16mm;font-size:10pt}
  #print .inv{border:0;box-shadow:none;padding:0}
  #print .inv-h{border-bottom:.6mm solid #85672a}
}
@media (min-width:700px){
  .chks{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

  .shv{max-width:1120px}
}

  .tb.cardy.x4 td:not(.num) .v{text-align:left}

  .per-pick{width:100%}
  .per-pick input{flex:1 1 0;min-width:0}

.adj-r{display:grid;grid-template-columns:1fr 120px;gap:var(--sp-2);align-items:center;padding:var(--sp-2) var(--sp-3);border:1px solid var(--ui-line);border-radius:var(--r-m);background:var(--ui-surface)}

.sc-rec button,.sc-chips button{height:auto;min-height:56px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:var(--sp-2) var(--sp-3);text-align:left}
.sc-rec b,.sc-chips b{font-size:17px;color:var(--ink)}
.sc-rec span,.sc-chips small{font-size:13px;font-weight:600;color:var(--ui-text-sub)}

.sc-note{display:flex;flex-direction:column;gap:var(--sp-2);font-size:14px;color:var(--ui-text-sub);line-height:1.5}
.sc-note>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-nb{display:flex;gap:var(--sp-2)}
.sc-nb button{flex:1 1 0;min-width:0}

.sc-diff{text-align:center;font-size:17px;color:var(--ink)}
.sc-diff b{font-size:22px}
#sc-ok small{font-size:13px;font-weight:700;opacity:.8;margin-left:var(--sp-2)}
/* S1 — 무게 판 색(멀리서 봐도: 회색 빔 · 노랑 흔들림 · 초록 저장 가능 · 회청 저장함 · 빨강 끊김) · 그림 4칸 · 연결 띠 · 손 입력 */
.sc-m{transition:background-color .15s,border-color .15s}
.sc-m[data-st="ok"]{background:var(--st-ok-bg);border-color:var(--st-ok-line)}
.sc-m[data-st="wait"]{background:var(--st-prog-bg);border-color:var(--st-prog-line)}
.sc-m[data-st="done"]{background:var(--st-done-bg);border-color:var(--st-done-line)}
.sc-m[data-st="off"]{background:var(--st-bad-bg);border-color:var(--st-bad-line)}
.sc-m[data-st="off"] .sc-v span{color:var(--st-bad-ink)}
.sc-st.off{color:var(--st-bad-ink);background:var(--st-bad-bg);border-color:var(--st-bad-line)}
.sc-st.off::before{background:var(--st-bad-solid)}
.sc-step{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2);width:100%;max-width:520px;margin:0;padding:0;list-style:none}
.sc-step li{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--sp-1) 0;border-radius:var(--r-m);color:var(--gray-500);font-size:13px;font-weight:700;opacity:.55}
.sc-step svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sc-step li.cur{opacity:1;color:var(--ink);background:var(--ui-surface);box-shadow:0 0 0 2px var(--brand-700)}
.sc-m[data-st="ok"] .sc-step li.cur{box-shadow:0 0 0 3px var(--st-ok-solid);color:var(--st-ok-ink)}
.sc-lk{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.sc-lk button{flex:1 1 auto;min-width:0}
.sc-lk [data-act="schand"]{font-weight:800}
.sc-ln.on{border-color:var(--st-ok-line);background:var(--st-ok-bg);color:var(--st-ok-ink)}
.sc-ln.off{border-color:var(--st-bad-line);background:var(--st-bad-bg);color:var(--st-bad-ink)}
.sc-hin{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-3) 0}
.sc-hin input{flex:1 1 auto;min-width:0;height:72px;font-size:44px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.sc-hin span{font-size:var(--fs-xl);font-weight:700;color:var(--ui-text-sub)}
@media (min-width:1100px){ .scv{max-width:900px} .sc-v span{font-size:132px} }   /* 공장 PC — 2~3m 떨어져서도 읽히게 */
/* f9 — 선 빠짐 띠 안 단추 · 화면 아래 오늘 합계 · 아래 여백(고정 단추 띠에 안 가리게) · 낮은 PC(1366×768) 조금 줄임 — 132px 는 생산 등록 · 검단 뒤 다시 재기 둘 다 */
.scv{padding-bottom:var(--sp-5)}
.sc-lnb{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
.sc-lnb button{flex:1 1 140px;min-width:0;min-height:48px}
.sc-ln.off .sc-l2{color:var(--st-bad-ink)}
.sc-sum{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:4px;font-size:15px;color:var(--ui-text-sub)}

@media (min-width:1100px) and (max-height:820px){ .sc-v span{font-size:112px} .sc-m{padding:var(--sp-3) var(--sp-4)} }
.btn-p[aria-disabled="true"]{opacity:.45}
.pk-g button.on{border:2px solid var(--brand-700);background:var(--brand-100)}
.sc-lbl-p{width:100mm;border:.3mm solid #000;padding:4mm;display:flex;flex-direction:column;gap:1.5mm;font-size:10pt}
.sc-lbl-p .lp-h{display:flex;justify-content:space-between;gap:2mm;font-size:9pt}
.sc-lbl-p .lp-no{font-size:30pt;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sc-lbl-p .lp-it{font-size:12pt;font-weight:700;display:flex;justify-content:space-between;gap:2mm}
.sc-lbl-p .lp-it span{font-weight:400}
.sc-lbl-p .lp-kg b{font-size:20pt}
.sc-lbl-p .lp-qr{border:.3mm dashed #666;padding:2mm;font-size:8pt;color:#444;text-align:center}
.lk-cs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--sp-3);margin:var(--sp-3) 0}
.lk-c{display:flex;flex-direction:column;gap:var(--sp-1);padding:var(--sp-3) var(--sp-4);background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--r-l);box-shadow:var(--ui-shadow-sm);font-size:14px;color:var(--ui-text-sub)}
.lk-c>div:first-child{display:flex;align-items:center;gap:var(--sp-2)}
.lk-c>div:first-child b{font-size:17px;color:var(--ink)}
.lk-c.off{background:var(--gray-50)}
.lk-c.lk-w b{color:var(--ink);font-size:15px}
.lk-cb{margin-top:var(--sp-2);padding-top:var(--sp-1);border-top:1px solid var(--ui-line-soft);display:flex;justify-content:flex-end}
.lk-cb .lk-off{color:var(--st-bad-ink);font-weight:600;font-size:14px;padding:0 var(--sp-2)}
.lk-orig{border:1px solid var(--ui-line);border-radius:var(--r-m);background:var(--gray-50);padding:var(--sp-3);margin:var(--sp-2) 0}
.lk-oh{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.lk-orig dl{display:grid;grid-template-columns:96px 1fr;gap:var(--sp-1) var(--sp-3);margin:0;font-size:14px}
.lk-orig dt{color:var(--ui-text-sub)}
.lk-orig dd{margin:0;color:var(--ink)}
.lk-done{padding:var(--sp-3);border-radius:var(--r-m);background:var(--st-ok-bg);color:var(--st-ok-ink);font-weight:700}
.lk-m{display:flex;flex-direction:column;gap:var(--sp-3);margin:var(--sp-2) 0}
.lk-r{display:grid;grid-template-columns:1fr auto 1fr;gap:var(--sp-2);align-items:center;padding:var(--sp-3);border:1px solid var(--ui-line);border-radius:var(--r-m);background:var(--ui-surface)}
.lk-r>span:first-child{display:flex;flex-direction:column;gap:2px;min-width:0}
.lk-r small{font-size:13px;color:var(--ui-text-sub)}
.lk-r b{font-size:15px;color:var(--ink)}
.lk-r .pill{align-self:flex-start}
.lk-a{font-size:18px;color:var(--ui-text-mute)}
.sec-t.lk-t{font-size:17px;color:var(--ink)}   /* erp8: 짝 맞추기 소제목 · 안내 15px 이상 진한 색 */
.sec-t.lk-t span{flex:1 1 100%;font-size:15px;font-weight:500;color:var(--ui-text);margin-top:2px}
.sub.lk-s{font-size:15px;color:var(--ui-text)}
@media (max-width:699px){
  .sc-demo span{display:none}   /* 휴대폰: "저울 연결은 시연입니다" 한 줄만 — 무게 · [저울에 올림]이 한 화면에 */
  .sc-demo{min-height:28px;padding:3px var(--sp-3);justify-content:center}   /* erp8: 연결 박스 한 줄 ≈28px */
  .sc-demo b{font-size:13px}
  .scv{gap:var(--sp-2)}
  .sc-h{padding:var(--sp-2) var(--sp-3)}
  .sc-ht b{font-size:18px}
  .sc-m{padding:var(--sp-3) var(--sp-3);gap:var(--sp-1)}
  .sc-sim{margin-top:var(--sp-1)}
  .sc-next b{font-size:24px}
  .sc-step svg{width:24px;height:24px}
  .sc-sim{flex-wrap:nowrap;width:100%}
  .sc-sim button{min-width:0;flex:1 1 auto;padding:0 var(--sp-2);white-space:nowrap}
  .sc-demo.sc-ln.off span.sc-l2{display:block}   /* f9: 선 빠짐은 휴대폰도 두 줄 + [손으로 입력] 주 단추가 첫 화면에 */
  .sc-demo.sc-ln.off{padding:var(--sp-2) var(--sp-3)}
  .sc-step{gap:var(--sp-1)}
  .sc-step li{flex-direction:row;justify-content:center;gap:3px;padding:2px 0}   /* f9: 그림 4칸 한 줄로 작게 */
  .sc-step svg{width:18px;height:18px}
  .scv.sc-new>.sc-opt{order:1}   /* f9: 휴대폰 생산 등록 — 무게 바로 아래 [자동 등록] · 손 입력 줄은 그 아래 */
  .scv.sc-new>.sc-lk,.scv.sc-new>.sc-lbl,.scv.sc-new>.sec-t,.scv.sc-new>.sc-rec,.scv.sc-new>.sc-note{order:2}
  .sc-auto{min-height:44px;padding:var(--sp-1) var(--sp-3)}
  .sc-auto small{display:none}
  .scv{gap:6px}
  .sc-m{padding:var(--sp-2) var(--sp-3)}
  .sc-sim button,.sc-h>button{height:44px;min-height:44px}
  .bar:has(+ .scv){display:none}   /* f9: 휴대폰 저울 화면은 제목 줄 대신 위 띠(시연 · 연결됨 · 선 빠짐)가 화면 이름 — [자동 등록]까지 첫 화면에 */
  .sc-sum{display:none}   /* 휴대폰은 "다음 절" 줄에 오늘 이 호기 합계가 있어 고정 띠는 [확인 · 저장]만 */
  .lk-r{grid-template-columns:1fr}
  .lk-a{display:none}
  .lk-orig dl{grid-template-columns:84px 1fr}
}
.start3{background:var(--ui-surface);border:1px solid var(--ui-line);border-top:2px solid var(--gold-line);border-radius:var(--r-l);box-shadow:var(--ui-shadow-sm);padding:var(--sp-4);margin:var(--sp-3) 0}

/* ===== f10 기준정보 6곳 (docs/기획/20261013_ERP_기준정보_디자인.md · 변수만 · 새 변수 없음) ===== */
/* 0-3 ERP 모든 표 머리줄 가운데 · 세로 가운데 (내용 정렬은 그대로) */
thead th{text-align:center!important;vertical-align:middle}
.tb.pt th .th-s{justify-content:center}
.tb.pt td.ctr,.tb td.ctr{text-align:center}
.tb.pt td.bc{text-align:center}
.tb.pt td.bc .v{justify-content:center}
.tb td.rof,.tb.pt td.rof{background:var(--ui-canvas);color:var(--ui-text-sub)}
.gm-same{color:var(--ui-text-mute)}
/* 0-1 [+ 더하기] 칩 하나 */
.chip-add{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:var(--tap);padding:0 var(--sp-3);border:1px dashed var(--gray-500);border-radius:var(--r-m);background:var(--ui-surface);color:var(--brand-700);font-size:var(--fs-body);font-weight:700;white-space:nowrap}
.chip-add:hover{border-color:var(--brand-700)}
.chip-add.is-off,.btn-p.is-off{background:var(--gray-100);color:var(--ui-text-sub);border-color:var(--gray-300);cursor:not-allowed}   /* f10 디자인 점검: 흐리게(opacity) 대신 회색 바탕 · 대비 4.5 이상 */
.tb.pt td.lkc .v{white-space:normal;min-width:150px}
.tb.pt td.lkc .badge{white-space:normal}
.sp-act .chip-add{min-height:44px}
.btn-p.is-off{display:inline-flex;align-items:center;gap:var(--sp-2)}
.btn-p.is-off .lock{color:inherit}
.chip{display:inline-flex;align-items:center;gap:var(--sp-1);min-height:var(--tap);padding:0 var(--sp-3);border:1px solid var(--ui-line);border-radius:var(--r-m);background:var(--ui-surface);color:var(--ui-text);font-weight:700}
.chip.on{background:var(--brand-100);border-color:var(--brand-700);color:var(--brand-800)}
.chip.on::before{content:'';flex:none;width:5px;height:10px;margin:0 2px 3px 0;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chip .num{color:var(--ui-text-sub);font-weight:700}
.chip-in{display:inline-flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1);padding:var(--sp-1);border:1px dashed var(--brand-700);border-radius:var(--r-m);background:var(--ui-surface)}
.chip-in input{width:160px;min-width:0;height:var(--tap);min-height:var(--tap)}
.chip-in select{width:auto;height:var(--tap);min-height:var(--tap)}
.chip-in .ca-msg{flex:1 1 100%;font-size:13px;font-weight:700;color:var(--st-bad-ink)}
.chip-in .ca-msg:empty{display:none}
.yk-chips,.gr-chips{margin:0 0 var(--sp-3)}
/* 0-2 출처 배지 · 잠김 · 읽기 전용 칸 · 안내띠 */
.src{display:inline-flex;align-items:center;height:20px;padding:0 var(--sp-2);border-radius:var(--r-s);font-size:13px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.src.link{background:var(--auto-bg);color:var(--auto);border-color:var(--st-info-line)}
.src.man{background:var(--man-bg);color:var(--man);border-color:var(--st-warn-line)}
.lock{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--ui-text-sub);white-space:nowrap}
.lock .lk-i{color:var(--ui-text-mute);flex:none}
.note-band{display:flex;align-items:center;gap:var(--sp-3);min-height:36px;padding:var(--sp-1) var(--sp-3);margin:0 0 var(--sp-3);background:var(--gold-bg);border-bottom:1px solid var(--gold-line);font-size:13px;font-weight:600;color:var(--gold-ink)}

.src-tabs{margin:0 0 var(--sp-3);gap:0;border-bottom:1px solid var(--ui-line)}

.src-tabs .num{font-weight:700;color:inherit}
.ro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-2) var(--sp-3);margin:0 0 var(--sp-3)}
.ro-field{display:flex;flex-direction:column;gap:2px;padding:var(--sp-2) var(--sp-3);background:var(--ui-canvas);border-radius:var(--r-m);position:relative}

function numInput(el) {

}

/* ===== 출고하기 (A10) — 고객 → 절 고르기(파레트째 · 일부 · 번호 범위) → 받는 곳 → 송장 이미지 · 카톡 · 인쇄 ===== */

      : emptyBox('출고할 재고가 없습니다', '생산일지에 절을 적으면 여기서 고객을 고릅니다', '<button type="button" data-go="board">호기 판</button>');

    for (const id of [...W.sel]) if (!ps.some(x => x.id === id)) W.sel.delete(id);

      '<div class="selsum" aria-live="polite"><b><span class="num" data-v="selN">' + selP.length + '</span>조각 · <span class="num" data-v="selKg">' + kgC(FXC.sumC(selP)) + '</span> kg</b><button type="button" data-act="shall">' + (selP.length === ps.length && ps.length ? '모두 풀기' : '전부 고르기') + '</button></div>' +

        return '<div class="palg"><div class="palg-h"><b>' + esc(pal || '파레트 없음') + '</b><span><span class="num">' + xs.length + '</span>조각 · <span class="num">' + kgC(FXC.sumC(xs)) + '</span>kg</span><button type="button" data-act="shpal" data-v="' + esc(pal) + '">' + (on ? '풀기' : '전부') + '</button></div><div class="chks">' +
          xs.map(x => '<button type="button" class="chk-card' + (W.sel.has(x.id) ? ' on' : '') + '" data-act="shpick" data-v="' + esc(x.id) + '" aria-pressed="' + W.sel.has(x.id) + '"><b class="mono">' + esc(x.no) + '</b><span><span class="num">' + kgS(x.kg) + '</span>kg · ' + esc(x.date.slice(5)) + (x.insp ? '' : ' · 검사 전') + '</span><i class="cb" aria-hidden="true"></i></button>').join('') + '</div></div>'; }).join('');

      '<div class="inv-b"><button type="button" class="btn-p btn-l" data-act="shshare" data-id="' + esc(W.done) + '">카톡으로 보내기</button><button type="button" data-act="shpng" data-id="' + esc(W.done) + '">이미지 저장</button><button type="button" data-act="shprint" data-id="' + esc(W.done) + '">인쇄</button></div>' : emptyBox('송장을 찾지 못했습니다', '출고 조회에서 다시 보십시오', '');

SCR.shipnew.after = () => {
  const W = S.sh; if (!W) return;

  const lab = W.step === 2 ? '다음' : W.step === 3 ? '송장 만들기' : W.step === 4 ? '새 출고' : '';
  if (!lab) return;
  $('fixbar').innerHTML = '<div class="fx-w">' + (msg ? '<div class="fx-why">' + msg + '</div>' : '') + '<button type="button" id="sh-next" class="btn-p btn-xl" data-act="shnext"' + (msg ? ' aria-disabled="true"' : '') + '>' + lab + '</button></div>';

ACTS.shcust = t => { S.sh.cust = t.dataset.v; S.sh.step = 2; S.sh.sel = new Set(); S.sh.item = ''; S.sh.to = ''; try { localStorage.setItem('fx.lastShipCust', t.dataset.v); } catch (_) {} render(false); };
ACTS.shitem = t => { S.sh.item = t.dataset.v; S.sh.sel = new Set(); render(true); };
ACTS.shpick = t => { const s = S.sh.sel, v = t.dataset.v; s.has(v) ? s.delete(v) : s.add(v); render(true); };
ACTS.shpal = t => { const ps = FXC.stockPcs(fxD(), { cust: S.sh.cust, item: S.sh.item }).filter(x => (x.pal || '') === t.dataset.v), on = ps.every(x => S.sh.sel.has(x.id)); ps.forEach(x => on ? S.sh.sel.delete(x.id) : S.sh.sel.add(x.id)); render(true); };
ACTS.shall = () => { const ps = FXC.stockPcs(fxD(), { cust: S.sh.cust, item: S.sh.item }), on = ps.length && ps.every(x => S.sh.sel.has(x.id)); ps.forEach(x => on ? S.sh.sel.delete(x.id) : S.sh.sel.add(x.id)); render(true); };
/* 번호 범위 — "3-0410~3-0420" · "3-0410~0420" · 한 호기 안에서 일련 사이 */
function rngPick(txt, ps) {
  const m = String(txt || '').replace(/\s/g, '').match(/^(\d+)-(\d+)[A-Z]?~(?:(\d+)-)?(\d+)[A-Z]?$/i); if (!m) return null;
  const h = +m[1], a = +m[2], b = +m[4]; if (m[3] && +m[3] !== h) return null;
  return ps.filter(x => +x.r.hogiNo === h && +x.r.seq >= Math.min(a, b) && +x.r.seq <= Math.max(a, b));
}
ACTS.shrng = () => { const ps = FXC.stockPcs(fxD(), { cust: S.sh.cust, item: S.sh.item }), r = rngPick(($('sh-rng') || {}).value, ps); if (!r) return toast('범위를 "3-0410~3-0420" 처럼 넣어 주십시오'); r.forEach(x => S.sh.sel.add(x.id)); toast(r.length + '조각을 골랐습니다'); render(true); };
ACTS.shto = t => { S.sh.to = t.dataset.v; render(true); };
CHG.shto = t => { S.sh.to = t.value.trim(); document.querySelectorAll('.pick.sm').forEach(b => b.classList.remove('on')); const n = $('sh-next'); if (n) { n.removeAttribute('aria-disabled'); const w = $('fixbar').querySelector('.fx-why'); if (w && S.sh.to) w.remove(); } };
CHG.shcar = t => { S.sh.car = t.value.trim(); };
ACTS.shback = () => { S.sh.step = Math.max(1, S.sh.step - 1); render(false); };
ACTS.shnext = async t => {
  const W = S.sh; if (!W) return;
  if (W.step === 4) { S.sh = null; return render(false); }
  if (W.step === 2) { if (shipNoPrice(W.item)) return toast('단가 없음 — 단가를 먼저 넣으세요'); if (!W.sel.size) return toast('절을 1개 이상 고르십시오'); W.step = 3; return render(false); }
  if (W.step === 3) {
    if (!W.to) return toast('받는 곳을 고르십시오');
    if (t.disabled) return; t.disabled = true; t.textContent = '저장 중...';
    const r = await shipSave({ cust: W.cust, pids: W.sel, to: W.to, car: W.car });
    if (typeof r === 'string') { t.disabled = false; t.textContent = '송장 만들기'; return toast(r); }
    W.done = r.id; W.step = 4; toast(r.id + ' · ' + W.sel.size + '조각 출고 — 송장을 만들었습니다'); render(false);   // f7: 파랑 전체 덮기 대신 조용한 안내 (화면 위 "송장을 만들었습니다" 줄과 함께)
  }

/* 송장 — 화면 · 인쇄 · 이미지가 같은 구성 (금액 없음 · 현장도 보냄) */

/* ===================================================================================================

/* ----- 계산 (FXC 에 더함 — 화면 · 대시보드 · 검사 · 가상 자료가 같은 함수) ----- */
Object.assign(FXC, {
  lossOf: (D, it) => it && it.loss !== '' && it.loss != null && !isNaN(+it.loss) ? Math.max(0, Math.min(+it.loss, 90)) : Math.max(0, Math.min(+D.lossDef || 0, 90)),
  /* 투입 줄 (I10 · I11) — 절 하나 × 원사 하나 · 0.01kg 정수 = 반올림(절 kg × 비율% ÷ (100 − 로스%)) */
  useOf(D, f) {
    const out = [];
    for (const r of D.roll) {
      if (r.cxl || (f && f.from && r.date < f.from) || (f && f.to && r.date > f.to)) continue;
      const it = D.item[r.item]; if (!it || !Array.isArray(it.ymix) || !it.ymix.length) continue;
      const loss = FXC.lossOf(D, it), owner = yOwnerOf(it, r), loc = yLocOf(r), c0 = k100(r.kg);
      for (const m of it.ymix) if (m && m.yarn && +m.r > 0) out.push({ r, item: r.item, yarn: m.yarn, owner, loc, date: r.date, c: Math.round(c0 * +m.r / (100 - loss)) });

  },

  yarnOf(D, f) {

    for (const u of FXC.useOf(D, { from, to })) g(u.item).use += u.c;

  },
  /* 외주 의뢰 진행 — 그 의뢰로 들어온 살아 있는 절 */
  foProg(D, d) { let n = 0, c = 0; for (const r of D.roll) if (r.out === d.id && !r.cxl) { n++; c += k100(r.kg); } return { n, c, remain: Math.max(0, k100(d.kg) - c) }; },
  /* 외주 정산 (I21) — 미지급 = 매입(입고 kg × 외주 편직료) − 지급 · 외주처 남은 원사 = 그 자리 원사 남음 */
  apOf(D) {

    for (const a of D.ap) { if (a.cxl) continue; const o = g(a.vendor); if (a.kind === '매입') { o.kg += k100(a.kg); o.buy += Math.round(+a.amt || 0); } else if (a.kind === '지급') o.paid += Math.round(+a.amt || 0); }

  statBy(D, f, by) {

/* ===== 들어가기 · 자료 듣기 ===== */
function listenAll() {
  S.unsub.forEach(f => { try { f(); } catch (_) {} }); S.unsub = [];
  const base = ['mtype', 'mspec', 'hogi', 'gama', 'cust', 'item', 'seq'].concat(canEdit() ? ['yarn', 'creq'] : []).concat(canMoney() ? ['item_price'] : []).concat(S.role === '사장' ? ['staff', 'sec'] : []);
  for (const c of base) S.unsub.push(DS.listen(c, list => onCol(c, list)));
  // erp4: 새 칸 — 작업지시 · 파레트 · 송장 · 반품은 직원 모두 · 장부 · 마감 · 설정 · 외주 정산은 사장 · 사무만 (설계 4-3 · I27 현장 금액 감춤)
  for (const c of ['wo', 'pal', 'ship', 'ret', 'ystock'].concat(canMoney() ? ['ledger', 'close', 'cfg', 'ap', 'doc'] : [])) S.unsub.push(DS.listen(c, list => onCol(c, list)));
  if (S.demo) S.unsub.push(DS.listen('lbox', list => onCol('lbox', list)));   // erp7: 고객사 연결 우편함 — 시연에서만 (출고 보고는 현장 출고에도 쌓임 · 금액 칸 없음)
  // erp5: 현장은 의뢰서 중 원사 구매(FP)만 (원사 받음 · 규칙 초안 doc 읽기) · 사장은 직원 계정(mem) · 변경 기록(log 최근 62일)
  if (!canMoney()) S.unsub.push(DS.listen('doc', list => onCol('doc', list), ['kind', '==', 'FP']));
  if (S.role === '사장') { S.unsub.push(DS.listen('mem', list => onCol('mem', list))); S.unsub.push(DS.listen('log', list => onCol('log', list), ['ymd', '>=', ymdAdd(workInfo().date, -62)])); }
  // 절: 최근(이번 달 1일과 35일 전 중 이른 날부터) 실시간 + 안 나간 절(open == true)은 날짜와 관계없이 따로 (걱정 1)
  S.unsub.push(DS.listen('roll', list => onRoll('a', list), ['date', '>=', rollFrom()]));
  S.unsub.push(DS.listen('roll', list => onRoll('b', list), ['open', '==', true]));
}
function rollFrom() { const t = workInfo().date, m = t.slice(0, 8) + '01', d = ymdAdd(t, -35); return d < m ? d : m; }
function onRoll(k, list) { S.rl[k] = Object.fromEntries(list.map(([id, d]) => [id, Object.assign({ code: id }, d)])); onCol('roll', Object.entries(Object.assign({}, S.rl.b, S.rl.a))); }
function onCol(c, list) {
  S.loaded.add(c); fxDirty(); if (S.bulk) return;   // 가상 자료 넣는 중에는 화면 자료를 저장 함수가 직접 맞춤
  S.d[c] = Object.fromEntries(list.map(([id, d]) => [id, Object.assign({ code: id }, d)]));
  if (c === 'hogi') Object.values(S.d.hogi).forEach(h => { const m = /^기계\s*(\d+)$/.exec(String(h.name || '').trim()); if (m) h.name = (+m[1]) + '호기'; });   // f10: 옛 이름 "기계 N" 은 화면에서 "N호기"로 (저장 값은 [수정] 때 바뀜)
  if (c === 'hogi' || c === 'mspec') Object.values(S.d.hogi).forEach(h => { if (!h.typeCode) { const t = (S.d.mspec[h.specCode] || {}).typeCode; if (t) h.typeCode = t; } });   // f11 H4: 옛 호기에 종류(typeCode)가 없으면 사양에서 (화면만 · 저장 값 그대로)
  if (c !== 'log') S.hasDemo = Object.values(S.d[c]).some(x => x.demo) || ['cust', 'item', 'hogi', 'roll', 'ship', 'wo'].some(k => k !== c && Object.values(S.d[k]).some(x => x.demo));
  if (c !== 'log') S.mixDemo = !!S.hasDemo && ['cust', 'item', 'roll', 'ship', 'ledger', 'wo', 'doc'].some(k => Object.values(S.d[k]).some(x => !x.demo));   // erp5: 가상 · 진짜가 섞였을 때만 줄 꼬리표
  if (c === 'mtype' && !S.ready.mtype) { S.ready.mtype = 1; if (!list.length && canEdit()) commit(FX_CFG.types.map((t, k) => ({ c: 'mtype', id: t.code, d: Object.assign({ sortOrder: k + 1, active: true }, t) })), false); }
  if (c === 'seq' || c === 'roll') Object.keys(S.seqLocal).forEach(k => { if (+((S.d.seq[k] || {}).last) >= S.seqLocal[k]) delete S.seqLocal[k]; });
  scheduleRender();
}
function startApp() {
  S.entered = true; $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('fn').textContent = (S.facDoc.name || S.fac); $('demo-bar').classList.toggle('hide', !S.demo); netShow();
  if (S.preview) $('demo-bar').innerHTML = '<span class="pv-t">미리보기 ' + esc(FVER) + ' — 가상 자료 · 이 기기 안에만 저장됩니다 · <b>모든 PC 같은 시험 자료 (판 ' + SEED_VER + ')</b> · 시험 자료 판이 바뀌면 다시 맞춰집니다</span><button type="button" class="btn-t pv-b" data-act="pvreset">표준 자료로 다시 맞추기</button>';   // f13
  S.view = pickView(); applyView(); S.pcOpen = new Set(['기준정보', '생산일지']); renderTop();
  listenAll();
  const id = location.hash.slice(1); go(id && canSee(id) && id !== 'kp' && id !== 'wz' ? id : 'board');
}
async function logout() {
  if (!await ask(S.demo ? '시연을 끝낼까요? (시연 자료는 이 기기에 남습니다)' : '로그아웃할까요?', S.demo ? '끝내기' : '로그아웃', '취소')) return;
  if (S.demo) { location.href = location.pathname; return; }

async function enterWith(user) {
  if (S.entered || S.entering) return; S.entering = true;
  try {
    S.uid = user.uid;
    const mem = await DS.get('mem', S.uid);
    if (!mem || mem.active === false) { showLogin('이 공장(' + S.fac + ')의 직원으로 등록되어 있지 않습니다. 공장 사장님께 문의하십시오.'); return; }
    S.role = FX_CFG.roles.includes(mem.role) ? mem.role : '현장'; S.me = mem;
    S.facDoc = (await DS.root()) || { name: S.fac };
    startApp();
  } catch (e) {
    showLogin(/permission-denied/.test((e && e.code) || '') ? '이 공장 자료를 열 권한이 없습니다. (보안 규칙이 게시되기 전에는 열리지 않습니다)' : '들어가지 못했습니다 — ' + ((e && e.code) || (e && e.message) || ''));
  } finally { S.entering = false; }
}
function showLogin(msg) {
  $('app').classList.add('hide'); $('login').classList.remove('hide'); $('lg-btn').disabled = false;
  $('lg-msg').textContent = msg || ''; $('lg-ver').textContent = '판 ' + FVER;
}
const facFrom = s => { const t = String(s || '').trim().toUpperCase().replace(/^FAC-?/, ''); return /^\d{1,4}$/.test(t) ? makeFacCode(+t) : ''; };
async function boot() {
  const qs = new URLSearchParams(location.search);
  qs.set('demo', '1'); S.preview = true;
  if (qs.has('demo')) {
    S.demo = true; if (S.preview) pvCheck(); /* f13: 시험 자료 판이 다르면 이 기기 자료를 비우고 표준으로 */ DS = demoDS(); S.fac = makeFacCode(1); S.uid = 'demo'; S.role = FX_CFG.roles.includes(qs.get('role')) ? qs.get('role') : '사장'; S.me = { name: '시연' };
    S.facDoc = (await DS.root()) || { code: S.fac, name: '시연편직' }; if (!(await DS.root())) DS._setRoot(S.facDoc);
    startApp(); if (S.preview) setTimeout(pvAuto, 400);   // f12: 미리보기 처음 열면 가상 자료 + 시험 자료(T-)
    return;
  }
}
$('lg-form').addEventListener('submit', e => e.preventDefault());   /* 로그인 기능을 불러오기 전에 눌러도 화면이 새로 열리지 않게 */
$('lg-demo').addEventListener('click', () => { location.href = location.pathname + '?demo=1'; });

/* f12 대표 지시(최소 10호기까지 넣어 보기): 미리보기를 처음 열면 가상 자료(30일 · 22호기) + 시험 자료(T- 고객사 3곳 · 수정 요청 · 가마)가 이미 들어 있게 — 한 번만 (지운 뒤 다시 열어도 다시 넣지 않음 · 단추는 그대로) */
/* f13: 시험 자료 판(SEED_VER) — 기기마다 따로 저장(localStorage)이라 옛 판을 먼저 연 PC 는 새 시험 자료가 안 들어가던 것 → 판이 다르거나 없으면 열 때 비우고 표준 가상 자료 + 시험 자료로 다시 맞춤 (같은 판이면 그대로 · 사용자가 넣은 자료는 판이 바뀔 때 사라짐) */
const SEED_VER = '14', PV_KEY = 'fx.pv.seed';
function pvCheck() { let v = ''; try { v = localStorage.getItem(PV_KEY) || ''; } catch (_) {} if (v === SEED_VER) return; try { localStorage.removeItem('fx.demo.v1'); localStorage.removeItem('fx.pv.auto'); } catch (_) {} S.pvNeed = true; }
async function pvAuto() {
  if (!S.pvNeed || S.role !== '사장') return;
  S.pvNeed = false;
  await demoFull(true); const r = hasT12() ? true : await seedT12();
  if (r === true && !(S.demoReport && S.demoReport.bad && S.demoReport.bad.length)) { try { localStorage.setItem(PV_KEY, SEED_VER); } catch (_) {} }
  S.prm.vd = ''; render(true);
}
ACTS.pvreset = async () => { if (!await ask('표준 자료로 다시 맞출까요?\n이 기기에 넣은 자료는 지워지고, 모든 PC 와 같은 가상 자료 + 시험 자료(판 ' + SEED_VER + ')로 바뀝니다.', '다시 맞추기', '취소')) return; try { localStorage.removeItem(PV_KEY); } catch (_) {} location.reload(); };
/* ===== 시연 자료 (공장노트 9장 시험 자료 + 가상 업체 · 품목) ===== */
async function demoSeed() {
  if (!S.demo) return;
  if (Object.keys(S.d.mspec).length && !await ask('이미 기계가 있습니다. 시연 자료를 더 넣을까요?', '넣기', '취소')) return;
  const ms = [
    Object.assign(newM('JJ'), { inch: '32', feeder: '96', count: '6', span: '4', gamas: [{ chim: '1600', count: '4' }, { chim: '2000', count: '3' }] }),
    Object.assign(newM('JJ'), { inch: '36', feeder: '108', count: '4', span: '0', gamas: [{ chim: '1800', count: '5' }] }),
    Object.assign(newM('SG'), { inch: '30', feeder: '90', count: '12', span: '12', gamas: [{ chim: '2260', count: '8' }] })];
  assignHogi(ms, usedHogiNos()); const p = planFromDraft(S.fac, ms, tname), ops = [];
  p.specs.forEach(s => ops.push({ c: 'mspec', id: s.code, d: stamp(Object.assign({}, s), true) }));
  p.hogis.forEach(h => ops.push({ c: 'hogi', id: h.code, d: stamp(Object.assign({}, h), true) }));
  p.gamas.forEach(g => ops.push({ c: 'gama', id: g.code, d: stamp(Object.assign({}, g), true) }));
  const c1 = nextSerial('FC', 4, Object.keys(S.d.cust)), c2 = 'FC' + String(+c1.slice(2) + 1).padStart(4, '0');
  ops.push({ c: 'cust', id: c1, d: stamp({ code: c1, kinds: ['고객사(발주처)'], name: '푸른텍스(시연)', person: '홍길동', phone: '031-000-0000', addr: '경기도 포천시', state: '거래중', active: true }, true) });
  ops.push({ c: 'cust', id: c2, d: stamp({ code: c2, kinds: ['원사 구매처'], name: '다라방적(시연)', state: '거래중', active: true }, true) });
  const g1 = p.gamas[0], g4 = p.gamas[3], i1 = nextSerial('FG', 4, Object.keys(S.d.item)), i2 = 'FG' + String(+i1.slice(2) + 1).padStart(4, '0');
  ops.push({ c: 'item', id: i1, d: stamp({ code: i1, cust: c1, custName: '푸른텍스(시연)', name: '면30수 쭈리', kind: '몸판', gamaCode: g1.code, inch: g1.inch, chim: g1.chim, gauge: g1.gauge, gaugeAuto: g1.gaugeAuto, gaugeRaw: g1.gaugeRaw, gaugeManual: false, yarns: '면30수 100%', loss: 3, state: '작업중', active: true }, true) });
  ops.push({ c: 'item', id: i2, d: stamp({ code: i2, cust: c1, custName: '푸른텍스(시연)', name: 'TC 싱글 30수', kind: '몸판', gamaCode: g4.code, inch: g4.inch, chim: g4.chim, gauge: g4.gauge, gaugeAuto: g4.gaugeAuto, gaugeRaw: g4.gaugeRaw, gaugeManual: false, state: '작업중', active: true }, true) });
  ops.push({ c: 'hogi', id: p.hogis[0].code, d: { item: i1 }, merge: true }, { c: 'hogi', id: p.hogis.find(h => h.typeCode === 'SG').code, d: { item: i2 }, merge: true });

}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e3a8a">
<title>편직공장 ERP 미리보기 f3 (erp3)</title>
<style>
/* 편직공장 ERP f3 (erp3) — FABIWOS 가족 화면 (2026-10-11 대표: "FABIWOS 디자인을 따라 쉽게 다루게")
   PC = index.html 653 틀: 흰 머리줄(로고 · 화면 이름 · 기능 단추 · 이름/등급) · 왼쪽 메뉴(오늘 · 즐겨찾기 · 색 묶음 카테고리 접기 · 고른 표시) · 화면 제목 줄 · 업체코드식 [+ 추가] 펼침 입력 · 표
   휴대폰 = k.html 653 틀: 남청 머리 띠 · 앱 이름 칩 · 아래 탭 · 큰 카드 · 큰 단추
   색 · 글자 · 칸 · 모서리 변수는 네 앱과 같은 이름 · 같은 값(hotfix653 색기준 통일) — 휴대폰 값이 기본, PC 값은 body.pc
   화면 코드에 색 값을 직접 쓰지 않는다. 기계 종류 색만 자료(mtype.color)에서 온다(공장노트 6-3). sticky 는 기계 등록 머리띠 · PC 표 머리 두 곳만 */
:root{--brand-800:#1e3a8a;--brand-700:#1d4ed8;--brand-600:#2563eb;--brand-100:#eff6ff;--brand-line:#bfdbfe;--st-prog-bg:#fffbeb;--st-prog-ink:#92400e;--st-prog-line:#fcd34d;--st-prog-solid:#b45309;--st-ok-bg:#ecfdf5;--st-ok-ink:#065f46;--st-ok-line:#a7f3d0;--st-ok-solid:#047857;--st-warn-bg:#fff7ed;--st-warn-ink:#9a3412;--st-warn-line:#fed7aa;--st-warn-solid:#c2410c;--st-bad-bg:#fef2f2;--st-bad-ink:#b91c1c;--st-bad-line:#fecaca;--st-bad-solid:#b91c1c;--st-info-bg:#eaf1ff;--st-info-ink:#1d4ed8;--st-info-line:#bfdbfe;--st-info-solid:#1d4ed8;--st-adm-bg:#f1f5f9;--st-adm-ink:#334155;--st-adm-line:#cbd5e1;--st-adm-solid:#334155;--pr-knit:#047857;--pr-dye:#6d28d9;--pr-qc:#1d4ed8;--ink:#0f172a;--gray-700:#334155;--gray-600:#475569;--gray-500:#64748b;--gray-300:#cbd5e1;--gray-200:#e2e8f0;--gray-100:#f1f5f9;--gray-50:#f8fafc;--surface:#fff;--fs-xs:12px;--fs-sm:13px;--fs-body:15px;--fs-md:16px;--fs-lg:18px;--fs-xl:22px;--ctl-h:44px;--btn-s:24px;--btn-m:28px;--tap:44px;--r-s:8px;--r-m:12px;--r-l:16px}
/* index.html 화면 토큰(hotfix150 · 443) · k.html 기본 글자색 */
:root{--font-gothic:'Pretendard Variable',Pretendard,'Malgun Gothic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --ui-canvas:#f4f5f7;--ui-surface:#ffffff;--ui-line:#e6e8ec;--ui-line-soft:#eef0f3;--ui-text:#1f2430;--ui-text-sub:#6b7280;--ui-text-mute:#9aa1ac;
  --ui-shadow-sm:0 1px 2px rgba(16,24,40,0.04),0 1px 3px rgba(16,24,40,0.06);--ui-shadow:0 4px 14px rgba(16,24,40,0.06),0 1px 3px rgba(16,24,40,0.05);--ui-shadow-lg:0 12px 40px rgba(16,24,40,0.14);--ui-focus:0 0 0 3px rgba(37,99,235,0.16);
  --erp-line:#e5e7eb;--erp-blue-deep:#1e40af;--cat-sale:#be123c;--cat-q:#0e7490;--cat-stock:#0f766e;--fav:#a16207;
  --sub:#475569;--dim:#94a3b8;--line:#e2e8f0;--red:#dc2626;--amber:#b45309;
  /* 이 앱만 쓰는 것 — 자동값(파랑) · 손으로 고친 값(주황) (공장노트 5-3) */
  --auto:#0e7490;--auto-bg:#ecfeff;--man:#9a3412;--man-bg:#fff7ed}
body.pc{--fs-xs:11px;--fs-sm:12px;--fs-body:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--ctl-h:32px;--btn-s:24px;--btn-m:28px;--tap:28px;--r-s:6px;--r-m:8px;--r-l:12px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ui-canvas);color:var(--ink);font:16px/1.5 var(--font-gothic);letter-spacing:-0.01em;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
.hide{display:none!important}
button,select,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{min-height:var(--tap);padding:0 14px;border-radius:var(--r-m);border:1px solid var(--gray-300);background:var(--surface);color:var(--gray-700);font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:hover{border-color:#93c5fd}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:1px}
.btn-p{background:var(--brand-700);border-color:var(--brand-700);color:#fff;font-weight:800}
.btn-p:hover{background:var(--brand-800);border-color:var(--brand-800)}
.btn-l{min-height:52px;font-size:17px}
.btn-xl{min-height:60px;font-size:20px;width:100%;border-radius:15px;font-weight:900}
.btn-t{border-color:transparent;background:transparent;color:var(--brand-700);text-decoration:underline;text-underline-offset:3px}
.btn-t:hover{border-color:transparent}
input,select,textarea{min-height:var(--tap);width:100%;padding:8px 12px;border:1px solid var(--gray-300);border-radius:var(--r-m);background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand-600);box-shadow:var(--ui-focus);outline:0}
textarea{min-height:88px;resize:vertical}
input[readonly]{background:var(--gray-50)}
h1,h2,h3{margin:0;line-height:1.3}
h2{font-size:20px;font-weight:900;letter-spacing:-.3px}
h3{font-size:16px}
.sub{color:var(--gray-600);font-size:14px}
.na{color:var(--gray-500);font-size:13px}
.msg{color:var(--st-bad-ink);font-size:15px;font-weight:700;min-height:0}
.msg:empty{display:none}
.msg.ok{color:var(--st-ok-ink)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--gray-600);overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Consolas,monospace}
.sp{flex:1 1 auto}
/* 꼬리표 — FABIWOS 표 안 알약 */
.pill{display:inline-block;padding:1px 9px;border-radius:9px;font-size:13px;font-weight:800;line-height:1.5;white-space:nowrap;background:var(--gray-200);color:var(--gray-700)}
.pill+.pill{margin-left:4px}
.pill.bl{background:var(--st-info-bg);color:var(--st-info-ink)}
.pill.gr{background:var(--st-ok-bg);color:var(--st-ok-ink)}
.pill.am{background:var(--st-prog-bg);color:var(--st-prog-ink)}
.pill.pu{background:#f5f3ff;color:var(--pr-dye)}
.pill.or{background:var(--st-warn-bg);color:var(--st-warn-ink)}
.pill.rd{background:var(--st-bad-bg);color:var(--st-bad-ink)}
.badge{display:inline-block;font-size:13px;font-weight:800;border-radius:9px;padding:0 8px;background:var(--auto-bg);color:var(--auto);border:1px solid #a5e3ee;white-space:nowrap;line-height:1.5}
.badge.man{background:var(--man-bg);color:var(--man);border-color:var(--st-warn-line)}
.badge.off{background:var(--gray-100);color:var(--gray-600);border-color:var(--gray-300)}

/* 로그인 — k.html 로그인처럼 남청 바탕 + 흰 카드 */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 18px;background:radial-gradient(120% 70% at 20% 0%,var(--brand-600) 0%,var(--brand-700) 45%,var(--brand-800) 100%)}
.lg{width:100%;max-width:380px;background:var(--surface);border-radius:20px;padding:26px 22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ui-shadow-lg)}
.lg h1{font-size:24px;font-weight:900;color:var(--brand-800);letter-spacing:-.3px}
.lg .fac{display:flex;align-items:center;gap:6px}
.lg .fac span{font-weight:800;color:var(--gray-600)}
.lg input{min-height:52px;font-size:18px}
.fl-l{font-size:14px;font-weight:700;color:var(--gray-600)}

/* ===== 틀: 머리 띠 · (왼쪽 메뉴) · 본문 · 고정 단추 띠 · 아래 탭 — 본문만 스크롤 ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{flex:0 0 auto;position:relative;z-index:6;display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 14px 8px 12px;background:var(--brand-800);color:#fff;box-shadow:0 2px 10px rgba(30,58,138,.22)}
.mnb{flex:none;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:12px;background:rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.mnb i{display:block;width:20px;height:2.5px;border-radius:2px;background:#fff}
.hd-m{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.apc{display:inline-block;font-size:19px;font-weight:900;letter-spacing:.5px;line-height:1.3;padding:1px 10px;border-radius:8px;background:rgba(255,255,255,.18);white-space:nowrap}
.hd-s{max-width:100%;font-size:13.5px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s #rl::before{content:' · '}
#top .tt{display:none}
#net{flex:none;font-size:13px;font-weight:800;background:var(--st-warn-bg);color:var(--st-warn-ink);border-radius:8px;padding:2px 8px}
#demo-bar{flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--st-prog-bg);color:var(--st-prog-ink);font-size:13px;font-weight:700;padding:5px 14px;border-bottom:1px solid var(--st-prog-line)}
#err-bar{flex:0 0 auto;background:var(--st-bad-bg);color:var(--st-bad-ink);font-size:14px;padding:6px 12px}
#err-bar:empty{display:none}
#body{flex:1 1 auto;display:flex;min-height:0}
#main{flex:1 1 auto;min-width:0;overflow:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch}
/* 아래 탭 — k.html .nav */
#bot{flex:0 0 auto;display:flex;gap:2px;background:#fff;border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(15,23,42,.06)}
#bot button{flex:1 1 0;min-width:0;min-height:54px;border:0;background:none;border-radius:14px;padding:5px 2px;font-size:13px;font-weight:800;color:var(--gray-500);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
#bot button svg{width:24px;height:24px}
#bot button.on{color:var(--brand-700);background:var(--brand-100)}
/* 휴대폰 메뉴 — k.html 서랍 */
#side{position:fixed;z-index:55;left:0;top:0;bottom:0;width:min(84vw,340px);background:#fff;overflow:auto;overscroll-behavior:contain;transform:translateX(-105%);transition:transform .2s ease-out;padding:0 0 calc(20px + env(safe-area-inset-bottom));box-shadow:6px 0 28px rgba(0,0,0,.2)}
#side.open{transform:none}
.sd-who{background:var(--brand-800);color:#fff;padding:18px 18px 16px}
.sd-who b{display:block;font-size:21px;font-weight:900}
.sd-who .sub{color:#fff;opacity:.88;font-size:13.5px}
.sd-g{padding:2px 10px}
.sd-c{margin:12px 8px 4px;font-size:13px;font-weight:800;color:var(--gray-500);letter-spacing:.5px}
.sd-i{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;border:0;background:none;border-radius:13px;padding:0 12px;font-size:16.5px;font-weight:700;color:var(--ink);text-align:left}
.sd-i:hover{border:0;background:var(--gray-100)}
.sd-i.on{background:var(--brand-100);color:var(--brand-800)}
.sd-i small{flex:none;background:var(--gray-100);color:var(--gray-500);border-radius:11px;padding:1px 9px;font-size:13px;font-weight:700;white-space:nowrap}
.sd-i.nx{color:var(--gray-500);font-weight:600}
.sd-f{margin:14px 10px 0;padding:12px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sd-f .na{padding-left:4px}
@media (min-width:900px){
  #side{position:static;transform:none;flex:0 0 250px;width:250px;transition:none;box-shadow:none;border-right:1px solid var(--line)}
  #menuBtn,#bot{display:none!important}
  #main{padding:20px 28px}
}
#dim{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.45);display:none}
#dim.on{display:block}
/* 창 — 휴대폰은 아래에서 올라오는 판 · 넓으면 가운데 */
#sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:none;box-shadow:0 -10px 30px rgba(15,23,42,.18)}
#sheet.on{display:block}
#sheet h2{font-size:20px;padding-right:4px}
@media (min-width:700px){#sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);border-radius:14px;max-height:88vh;padding:20px 22px;box-shadow:var(--ui-shadow-lg)}}
#ask{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:16px}
#ask.on{display:flex}
.ask-in{background:var(--surface);border-radius:16px;padding:20px 18px 16px;width:min(440px,100%);display:flex;flex-direction:column;gap:16px;box-shadow:var(--ui-shadow-lg)}
.ask-t{font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.ask-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ask-b button{min-width:100px}
#toast{position:fixed;z-index:90;pointer-events:none;left:50%;top:auto;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;max-width:92vw;display:none;box-shadow:var(--ui-shadow-lg)}
#toast.on{display:block}
body.pc #toast{bottom:24px}
body.fxb #toast{top:72px;bottom:auto}   /* 고정 단추 띠([저장] · [다음])가 있는 화면은 위쪽 — 단추를 덮지 않게 */
/* 고정 단추 띠 — 본문과 아래 탭 사이(스크롤 밖 · sticky 아님): 중량 [저장] · 기계 등록 [이전][다음] 이 늘 같은 자리 */
#fixbar{flex:0 0 auto;padding:8px 14px;background:var(--ui-canvas);border-top:1px solid var(--line)}
#fixbar:empty{display:none}
#fixbar>div{max-width:640px;margin:0 auto}
#fixbar .kpw{max-width:480px}
#done{position:fixed;z-index:85;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,58,138,.92);color:#fff;text-align:center;padding:16px}
#done.on{display:flex}
#done b{display:block;font-size:46px;letter-spacing:.02em;line-height:1.2;font-weight:900}
#done span{display:block;font-size:30px;margin-top:6px;font-weight:800}

/* ===== 공통 덩어리 (휴대폰) ===== */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1 1 180px;min-width:0}
.bar h2{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.empty{background:var(--surface);border:1px dashed var(--gray-300);border-radius:var(--r-l);padding:20px 16px;color:var(--gray-600);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface)}
.seg button.on{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.ck{display:inline-flex;align-items:center;gap:7px}
.ck::before{content:'';flex:none;width:15px;height:15px;border:1.5px solid var(--gray-500);border-radius:4px;background:#fff}
.ck.on::before{background:var(--brand-700);border-color:var(--brand-700);box-shadow:inset 0 0 0 2.5px #fff}
.sec-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:15px;font-weight:800;color:var(--gray-600);margin:16px 2px 8px}
.sec-t span{font-size:13px;font-weight:600;color:var(--gray-500)}
.nx1{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;display:flex;flex-direction:column;gap:4px;max-width:720px}
.nx1 b{font-size:16px}
.nx1 .sub{font-size:14px}

/* 표 — 넓으면 표, 휴대폰은 한 줄씩 카드 */
.tbw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{background:var(--gray-50);color:var(--gray-600);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--ui-line);white-space:nowrap}
.tb td{padding:6px 10px;border-bottom:1px solid var(--ui-line-soft);vertical-align:middle;white-space:nowrap}
.tb tr.off td{color:var(--gray-500)}
.tb .acts{display:flex;gap:6px;flex-wrap:nowrap}
.tb .acts button{min-height:var(--tap);padding:0 12px;font-size:14px}
.tb td.wr{white-space:normal;min-width:120px;overflow-wrap:anywhere}
.acts button[data-act="off"],.acts button[data-act="end"]{border-color:var(--st-bad-line);color:var(--st-bad-ink)}
.acts button[data-act="on"]{border-color:var(--st-ok-line);color:var(--st-ok-ink)}
@media (max-width:699px){
  .tbw{background:transparent;border:0;border-radius:0;overflow:visible}
  .tb.cardy thead{display:none}
  .tb.cardy,.tb.cardy tbody,.tb.cardy tr,.tb.cardy td{display:block;width:100%}
  .tb.cardy tr{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;padding:10px 0 8px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 24px -18px rgba(30,58,138,.45)}
  .tb.cardy tr.off{background:var(--gray-50)}
  .tb.cardy td{display:flex;gap:10px;white-space:normal;border:0;padding:3px 14px;overflow-wrap:anywhere;font-size:15px}
  .tb.cardy td::before{content:attr(data-l);flex:0 0 96px;color:var(--gray-500);font-size:13px;font-weight:700;padding-top:2px}
  .tb.cardy td .v{flex:1 1 auto;min-width:0}
  .tb.cardy td.act{padding-top:8px}
  .tb.cardy td.act::before{content:none}
  .tb.cardy .acts{flex-wrap:wrap}
  .tb.cardy .acts button{flex:1 1 auto}
}

/* 양식 */
.form{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.fl{display:flex;flex-direction:column;gap:5px}
.fl-l em{font-style:normal;color:var(--st-bad-ink);font-size:13px;margin-left:6px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.f3{grid-template-columns:1fr 1fr}}
.ro{min-height:var(--tap);display:flex;align-items:center;padding:0 2px}
.photo-ph{border:1px dashed var(--gray-300);border-radius:10px;padding:14px;color:var(--gray-600);font-size:14px;background:var(--gray-50)}
.sh-b{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.sh-b button{min-width:92px}
/* 게이지 — 자동값은 파란 테두리, 손으로 고친 값은 주황 테두리 (공장노트 5-3) */
.gin.g-auto{border:2px solid var(--auto);background:var(--auto-bg)}
.gin.g-man{border:2px solid var(--man);background:var(--man-bg)}
.gs{font-size:16px;color:var(--auto);font-weight:700;overflow-wrap:anywhere}
.au{border:2px solid var(--auto)!important;background:var(--auto-bg)!important}
.mn{border:2px solid var(--man)!important;background:var(--man-bg)!important}

/* ===== 휴대폰 첫 화면: 오늘 요약 · [생산 적기] · 호기 판 ===== */
.bd-sum{background:linear-gradient(135deg,var(--brand-100),#fff);border:1px solid var(--brand-line);border-radius:20px;padding:12px 14px}
.bd-d{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bd-d b{font-size:18px;font-weight:900;color:var(--brand-800)}
.bd-d span{font-size:14px;font-weight:700;color:var(--gray-600)}
.kd-t{width:100%;margin-top:8px;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--gray-200);border-radius:12px;overflow:hidden;table-layout:fixed}
.kd-t th{padding:6px 2px 0;font-size:13px;font-weight:700;color:var(--gray-500);text-align:center}
.kd-t td{padding:0 2px 7px;text-align:center;white-space:nowrap;font-size:14px;color:var(--gray-600)}
.kd-t td b{font-size:24px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.kd-t td+td,.kd-t th+th{border-left:1px solid var(--gray-100)}
.k-go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:68px;margin:12px 0 4px;border:0;border-radius:15px;padding:12px 8px;background:var(--brand-700);color:#fff;font-size:21px;font-weight:900;box-shadow:0 8px 18px -10px rgba(29,78,216,.7)}
.k-go small{font-size:13.5px;font-weight:700;opacity:.9}
.k-go:hover{background:var(--brand-800)}
.hgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hg{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--gray-200);border-radius:16px;padding:10px 12px 10px 16px;min-height:122px;display:flex;flex-direction:column;gap:2px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 24px -18px rgba(30,58,138,.45)}
.hg::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.hg:active,.hg:hover{background:var(--brand-100)}
.hg-no{font-size:23px;font-weight:900;line-height:1.2}
.hg-sp{font-size:13px;color:var(--gray-600)}
.hg-it{font-size:15px;font-weight:800;overflow-wrap:anywhere;line-height:1.35}
.hg-cu{font-size:13px;color:var(--gray-600)}
.hg-to{margin-top:auto;font-size:14px;color:var(--gray-600)}
.hg-to b{font-size:18px;font-weight:900;color:var(--brand-800)}
.hg.stop{background:var(--gray-100)}
.hg.noit .hg-it{color:var(--gray-500);font-weight:700}
.hg.noit::before{background:color-mix(in srgb,var(--tc) 40%,#ffffff)}
/* [생산 적기] 호기 고르기 창 */
.pk-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pk-h h2{flex:1 1 auto}
.pk-last{width:100%;min-height:56px;margin-bottom:10px;border:2px solid var(--brand-700);background:var(--brand-100);color:var(--brand-800);font-size:17px;font-weight:900;border-radius:14px}
.pk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pk-g button{position:relative;overflow:hidden;min-height:70px;padding:6px 6px 6px 12px;border-radius:14px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;gap:0}
.pk-g button::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc)}
.pk-g b{font-size:22px;font-weight:900;color:var(--ink)}
.pk-g small{font-size:13px;font-weight:600;color:var(--gray-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* 중량 키패드 */
.kp{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.kp .msg{min-height:22px;line-height:22px}
.kp .msg:empty{display:block}
.kp-h{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--gray-200);border-radius:16px;padding:8px 12px 8px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--ui-shadow-sm)}
.kp-h::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.kp-t{font-size:16px;overflow-wrap:anywhere}
.kp-t b{font-size:21px;font-weight:900}
.kp-n{font-size:15px;color:var(--gray-600)}
.kp-n b{font-size:20px;font-family:ui-monospace,Consolas,monospace;color:var(--brand-800)}
.kp-hb{display:flex;gap:6px;flex-wrap:wrap}
.kp-v{background:var(--surface);border:2px solid var(--brand-700);border-radius:16px;padding:2px 16px;text-align:right;font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.3}
.kp-v small{font-size:20px;margin-left:6px;color:var(--gray-600)}
.kp-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp-k button{min-height:52px;font-size:26px;font-weight:800;border-radius:14px;border-color:var(--gray-200);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.06)}
.kp-k button:active{background:var(--brand-100)}
.kp-k button[data-k="지움"]{font-size:18px;color:var(--gray-600)}
.kp-rec{font-size:14px;color:var(--gray-600)}
.kp-rec div{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.kp-rec div b{font-family:ui-monospace,Consolas,monospace;color:var(--ink)}

/* 일지 */
.dl-g{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:var(--ui-shadow-sm)}
.dl-g::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.dl-gh{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px 8px 18px;background:var(--brand-100)}
.dl-gh b{font-size:18px;font-weight:900}
.dl-gh .sp{flex:1 1 auto}
.dl{width:100%;border-collapse:collapse;font-size:15px}
.dl th{font-size:13px;color:var(--gray-500);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:700}
.dl th:first-child,.dl td:first-child{padding-left:18px}
.dl td{padding:0 10px;height:48px;border-bottom:1px solid var(--line);cursor:pointer}
.dl tr:hover td{background:var(--gray-50)}
.dl td.no{font-family:ui-monospace,Consolas,monospace;font-weight:700;white-space:nowrap}
.dl td.kg{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl td.nt{color:var(--gray-600);font-size:14px;overflow-wrap:anywhere}
.st-ok{color:var(--st-ok-ink);font-weight:700}
.st-cut{color:var(--st-warn-ink);font-weight:700}
.st-wait{display:inline-block;background:var(--st-prog-bg);color:var(--st-prog-ink);border:1px solid var(--st-prog-line);border-radius:9px;padding:0 8px;font-size:13px;font-weight:800;white-space:nowrap}
@media (max-width:699px){.dl .it{display:none}}
.ra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ra button{min-height:54px;font-size:17px;font-weight:800;border-radius:14px}
.hist{font-size:14px;color:var(--gray-600);margin-top:10px}
.hist div{padding:3px 0;border-bottom:1px dashed var(--line)}

/* 기계 등록 — 휴대폰 한 화면 한 질문 */
.wz{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wz-top{display:flex;align-items:center;gap:8px}
.wz-top .pg{margin-left:auto;font-weight:800;color:var(--gray-600)}
.wz-fold{display:flex;flex-direction:column;gap:6px}
.wz-fold button{text-align:left;padding:8px 12px;border-left:6px solid var(--tc);font-size:14px;line-height:1.45;white-space:normal;border-radius:12px}
.wz-head{position:sticky;top:0;z-index:3;background:var(--tc);color:#fff;border-radius:12px;padding:10px 14px;font-weight:900;font-size:17px}
.wz-q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ui-shadow-sm)}
.wz-q h2{font-size:20px}
.wz-q input{font-size:22px;min-height:56px;font-weight:700}
.wz-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.wz-types button{min-height:60px;background:var(--tc);border-color:var(--tc);color:#fff;font-size:19px;font-weight:900;border-radius:14px}
.wz-types button.add{background:var(--surface);color:var(--brand-700);border:1px dashed var(--brand-line);font-size:16px}
.wz-quick{display:flex;flex-wrap:wrap;gap:8px}
.wz-quick button{min-width:72px;min-height:50px;font-size:18px;font-weight:800;border-radius:12px}
.wz-nav{display:flex;gap:8px}
.wz-nav button{flex:1 1 0;min-height:56px;font-size:18px;border-radius:15px}
.wz-more{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wz-more button{min-height:60px;font-size:17px;font-weight:800;border-radius:14px}
.wz-more button.end{grid-column:1/-1;background:var(--brand-700);border-color:var(--brand-700);color:#fff}
.wz-prop{font-size:18px;font-weight:800;line-height:1.7}
.wz-res li{margin:3px 0;overflow-wrap:anywhere}

/* 기계 코드 목록 — 종류마다 세로 띠 (공장노트 6-3) */
.tgrp{border-left:6px solid var(--tc);background:var(--surface);border-radius:var(--r-l);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px;padding:10px 14px;box-shadow:var(--ui-shadow-sm)}
.tgrp>h3{color:var(--tc);font-size:17px;font-weight:900;margin-bottom:6px}
.spec{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.spec:first-of-type{border-top:0}
.spec.off{opacity:.75}
.sp-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:16px}
.sp-chips{display:flex;flex-wrap:wrap;gap:6px}
.sp-chips button{min-width:64px;font-weight:800}
.sp-chips button.off{color:var(--gray-500);border-style:dashed}
.sp-g{font-size:14px;color:var(--gray-600)}
.sp-act{display:flex;flex-wrap:wrap;gap:6px}

/* 쉬운 등록 — 휴대폰 한 화면 한 질문 (기계 등록과 같은 모양) */
.qw{display:flex;flex-direction:column;gap:12px}
.qw-top{display:flex;align-items:center;gap:8px}
.qw-top b{font-size:17px}
.qw-top .pg{margin-left:auto;font-weight:800;color:var(--gray-600)}
.qw-fold{display:flex;flex-direction:column;gap:6px}
.qw-fold button{display:flex;gap:8px;align-items:center;text-align:left;white-space:normal;line-height:1.4;padding:6px 12px;border-left:5px solid var(--brand-700);font-size:15px;border-radius:12px}
.qw-fold button span{flex:0 0 auto;color:var(--gray-600);font-size:13px}
.qw-q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qw-q h2{font-size:20px}
.qw-q .form{margin:0}
.qw-q input:not([type=date]){font-size:19px;min-height:52px;font-weight:700}
.qw-hint{color:var(--auto);font-size:15px;font-weight:700;overflow-wrap:anywhere}
.qw-hint:empty{display:none}
.qw-nav{display:flex;gap:8px}
.qw-nav button{flex:1 1 0;min-height:56px;font-size:18px;border-radius:15px}
.qw-alt{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.qw-done{background:var(--st-ok-bg);border:1px solid var(--st-ok-line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.qw-done b{font-size:20px;color:var(--st-ok-ink)}
.qw-done .nm{font-size:18px;font-weight:800;overflow-wrap:anywhere}

/* ===== PC 관리자 틀 (body.pc) — index.html 653 과 같은 모양 · 글자 13px 이상 · 표 줄 32px ===== */
.pc-only{display:none!important}
body.pc .pc-only{display:inline-flex!important}
body.pc #top{min-height:56px;padding:0 16px 0 0;gap:12px;background:#fff;color:var(--ui-text);box-shadow:none;border-bottom:1px solid var(--ui-line)}
body.pc .mnb{background:var(--gray-100);border:1px solid var(--erp-line);margin-left:10px}
body.pc .mnb i{background:var(--gray-700)}
body.pc #top .brand{order:0;flex-direction:column;justify-content:center;flex:0 0 232px;align-self:stretch;padding:0 18px;border-right:1px solid var(--erp-line);cursor:pointer}
body.pc #top .brand b{font-size:19px;font-weight:900;color:var(--erp-blue-deep);letter-spacing:-.3px;line-height:1.2}
body.pc #top .brand small{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:0}
body.pc #top .tt{order:1;display:block;flex:1 1 auto;min-width:0;padding-left:6px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.pc #net{order:2}
body.pc .hb{order:3;align-items:center;gap:6px}
body.pc .hd-m{order:4;flex:0 0 auto;align-items:flex-end;gap:0;max-width:220px}
body.pc .apc{display:none}
body.pc .hd-s{opacity:1;font-size:13px;color:var(--gray-600);font-weight:700}
body.pc #fn{color:var(--ink);font-weight:800}
body.pc #viewBtn{order:5}
body.pc #top button{align-items:center;justify-content:center;min-height:32px;height:32px;padding:0 14px;font-size:13px;font-weight:800;border-radius:8px}
body.pc #top .mnb{width:36px;height:36px;min-height:36px;padding:0}
.hb button{background:var(--brand-700);border:1px solid var(--brand-700);color:#fff}
.hb button:hover{background:var(--brand-800)}
.hb button.lt{background:var(--st-info-bg);border-color:var(--st-info-line);color:var(--st-info-ink)}
.hb button.gy,#viewBtn{background:var(--st-adm-bg);border-color:var(--st-adm-line);color:var(--st-adm-ink)}
.hb button.on{background:var(--brand-800);border-color:var(--brand-800);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brand-700)}
.hb button.lt.on,.hb button.gy.on{background:var(--st-info-bg);color:var(--st-info-ink);border:2px solid currentColor;box-shadow:none;padding:0 13px}
body.pc #bot{display:none!important}
@media (max-width:899px){body.pc #top .brand,body.pc .hb{display:none!important}}
@media (min-width:900px){body.pc #menuBtn{display:none!important}}
/* PC 왼쪽 메뉴 — index.html .hwside (흰 바탕 · 카테고리 색 묶음 · 고른 화면 색 · 즐겨찾기) */
body.pc #side{background:#fff;border-right:1px solid var(--erp-line);padding:8px 8px 16px;box-shadow:none}
@media (min-width:900px){body.pc #side{flex:0 0 232px;width:232px}}
body.pc .sd-who{display:none}
.sd-home{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;height:36px;margin:0 0 4px;padding:0 10px;border:0;border-radius:8px;background:var(--brand-100);color:var(--brand-800);font-size:14px;font-weight:800;text-align:left}
.sd-home svg{width:18px;height:18px;flex:none}
.sd-home:hover{border:0;background:#dbeafe}
.sd-home.on{background:var(--brand-700);color:#fff}
body.pc .sd-g{--gc:var(--gray-600);padding:0;margin-top:8px}
.sd-fh{min-height:30px;display:flex;align-items:center;padding:0 10px;border-radius:8px;font-size:13px;font-weight:800;color:var(--gc);background:color-mix(in srgb,var(--gc) 9%,#fff);box-shadow:inset 3px 0 0 var(--gc);margin-bottom:3px}
.sd-fe{font-size:13px;color:var(--gray-500);padding:4px 10px 6px 18px;line-height:1.5}
.sd-fi{display:flex;align-items:center;width:100%;height:32px;min-height:32px;padding:0 8px 0 18px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--gray-700);text-align:left}
.sd-fi:hover{border:0;background:var(--gray-100);color:var(--erp-blue-deep)}
.sd-fi.on{background:color-mix(in srgb,var(--gc) 10%,#fff);color:var(--gc);font-weight:800}
body.pc .sd-c{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;height:32px;margin:0 0 3px;padding:0 10px;border:0;border-radius:8px;background:color-mix(in srgb,var(--gc) 9%,#fff);box-shadow:inset 3px 0 0 var(--gc);color:var(--gc);font-size:13px;font-weight:800;letter-spacing:-.1px;text-align:left}
body.pc .sd-c::after{content:'';flex:0 0 auto;width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);margin-right:2px;opacity:.7}
body.pc .sd-c[aria-expanded="true"]::after{transform:rotate(45deg)}
body.pc .sd-c:hover{background:color-mix(in srgb,var(--gc) 16%,#fff)}
body.pc .sd-i{height:32px;min-height:32px;padding:0 6px 0 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-700)}
body.pc .sd-i:hover{background:var(--gray-100);color:var(--erp-blue-deep)}
body.pc .sd-i.on{background:color-mix(in srgb,var(--gc) 10%,#fff);color:var(--gc);font-weight:800}
body.pc .sd-i.nx{color:var(--dim);font-weight:500}
body.pc .sd-i small{background:none;padding:0;font-size:13px;font-weight:600;color:var(--dim)}
.sd-st{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:var(--gray-300);visibility:hidden}
.sd-st svg{width:14px;height:14px}
.sd-i:hover .sd-st,.sd-st.on{visibility:visible}
.sd-st.on{color:#eab308}
.sd-st.on svg{fill:currentColor}
.sd-st:hover{background:#fef9c3;color:#a16207}
body.pc .sd-f{margin:14px 0 0;padding:10px 4px 0}
body.pc .sd-f button{min-height:30px;height:30px;font-size:13px;border-radius:8px}
body.pc .sd-f .na{font-size:13px}
body.pc #main{padding:0}
body.pc #main.np{padding:16px 20px}
body.pc #fixbar{background:#fff;border-top-color:var(--ui-line)}
body.pc #sheet button{min-height:36px;font-size:14px}
body.pc #sheet input,body.pc #sheet select{min-height:38px;font-size:14px;border-radius:8px}
body.pc #sheet textarea{font-size:14px;border-radius:8px}
body.pc .fl-l{font-size:13px}
body.pc .sub{font-size:13px}
/* PC 화면 한 장: 제목 줄(흰 띠) + 몸통 */
.pcv{display:flex;flex-direction:column;height:100%;min-height:0;font-size:13px}
.pcv button{min-height:32px;height:32px;padding:0 14px;font-size:13px;border-radius:8px}
.pcv input,.pcv select{min-height:32px;padding:3px 10px;font-size:13px;border-radius:8px;border-color:var(--ui-line)}
.pg-h{flex:0 0 auto;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--ui-line);padding:13px 20px}
.pg-h h2{font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.3px}
.pg-s{color:var(--ui-text-sub);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.pg-b{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 20px 16px}
.pg-b.sc{overflow:auto}
.pc-note{color:var(--ui-text-sub)}
.pc-note b{color:var(--gray-700)}
.pg-add{display:flex;align-items:center;gap:10px}
.pg-hint{font-size:13px;color:var(--dim)}
.pcv button.btn-p{font-weight:800}
.pc-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pc-f .pc-q{flex:0 1 360px;width:auto;height:36px;min-height:36px;padding:0 12px}
.pc-f input[type=date]{width:auto}
.pc-sel{display:inline-flex;align-items:center;gap:6px;color:var(--gray-600);white-space:nowrap;font-weight:700}
.pc-sel select{width:auto;min-width:96px;max-width:220px}
.pc-f .seg{gap:4px}
.pcv button.ck{font-weight:700;color:var(--gray-700);border-color:var(--ui-line)}
.pcv button.ck.on{color:var(--brand-800);border-color:var(--brand-line);background:var(--brand-100)}
.pc-l{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;gap:6px}
.pc-sum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--gray-600)}
.pc-sum b{color:var(--ink)}

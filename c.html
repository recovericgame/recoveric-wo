<!--
  hotfix620 (2026-10-09 · 대표 "카톡처럼 · 로그인 화면 · 삼선 메뉴 · 사진 바로 올리기 · 공지 · 뒤로 · 크롬으로 열기 · 썸네일"):
    대화 화면은 공용 HWChat(편직팀 · 염/가공소 · 현장 QC 앱과 같은 모양) · 뒤로는 HWBack(세 앱과 같은 규칙) · 공지 = 글 notice:1 / { kind:'notice_on', ref } / 내리기 { kind:'notice_off', ref }
    내 글 판단은 메일(다른 기기에서 보낸 내 글도 내 글) · 현장 QC 답장도 지우기(field_del · 최고관리자) · ?embed=1 = FABIWOS [대화] 창 안
  이음 (c.html) — 현일텍스 본사 대화 앱 · hotfix619 (2026-10-09)
  본사(직원 구글 계정)가 편직팀 · 염/가공소 · 현장 QC 모든 대화를 한 곳에서 보고, 업체마다 대화한다. 휴대폰(앱 설치) · PC 같은 주소.
  자료는 FABIWOS 와 같은 곳(proc_log)을 쓴다 — 새 상자 없음. FABIWOS [대화] 창 · 업체 앱 · 현장 QC 앱과 같은 글을 보고 쓴다.
    편직팀  : 업체 { by:'vendor', kind:'issue', issue:'메시지', k:'chat', part:'gs' } · 우리 { by:'us', kind:'note', k:'chat', part:'gs', label:보낸 사람 }
    염/가공 : 같은 모양 · part 없음
    현장 QC : { vendor:'__field', kind:'field' | 'field_reply'(ref) | 'field_ack'(ref) | 'field_del'(ref · 최고관리자) , k:'dev:기기' }
    답장 chip 're:글 id' · 보내기 취소 { kind:'cancel', ref } · 읽음 { kind:'st', stage:'chat_seen', ref }
    첨부 att = { p: Storage 경로 chat/{업체 | __field}/YYYYMM/파일, n: 이름, t: 형식, s: 크기, w, h } — 사진은 줄여서(긴 쪽 1920) 올림 · 지우기 없음
-->
<style>
:root{--ink:#0f172a;--sub:#64748b;--line:#e8ecef;--bg:#f5f7f8;--card:#fff;--brand:#0f3d3a;--brand2:#0f766e;--amber:#f5a524;--gs:#047857;--gsb:#e7f8ef;--pc:#6d28d9;--pcb:#f2eefe;--qc:#1d4ed8;--qcb:#eaf1ff;--red:#ef4444;--safeB:env(safe-area-inset-bottom);--safeT:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
svg{flex:none}
/* 로그인 */
#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 0%,#17615b 0%,#0f3d3a 55%,#0a2a28 100%);color:#fff;padding:24px;z-index:50;overflow:auto}
.lg-card{width:min(380px,100%);text-align:center}
.lg-logo{width:104px;height:104px;border-radius:30px;box-shadow:0 18px 44px rgba(0,0,0,.4)}
#login h1{font-size:40px;margin:18px 0 6px;letter-spacing:6px;font-weight:800}
.lg-sub{margin:0 0 28px;color:#b8efe6;font-size:14.5px;line-height:1.65}
.lg-main{width:100%;min-height:58px;border:0;border-radius:16px;background:#fff;color:#0f3d3a;font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:12px;padding:10px 16px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.lg-main .lg-av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.lg-main span.t{flex:1;min-width:0}.lg-main small{display:block;font-size:12.5px;color:#64748b;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-main .go{color:#0f766e;font-size:14px;flex:none}
.lg-other{margin-top:12px;width:100%;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#e6fffb;font-weight:700}
.lg-err{margin-top:14px;color:#fde68a;font-size:13.5px;min-height:18px;line-height:1.5}
.lg-inst{margin-top:22px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px}
.lg-inapp{background:#fff7d6;color:#7a4b00;border-radius:16px;padding:14px 14px 12px;margin-bottom:16px;text-align:left;font-size:13.5px;line-height:1.5}
.lg-inapp b{display:block;font-size:15px;color:#5c3700}
.lg-inapp button,.inapp button{margin-top:10px;width:100%;height:44px;border:0;border-radius:12px;background:#0f3d3a;color:#fff;font-weight:800;font-size:15px}
.lg-foot{position:absolute;bottom:calc(16px + var(--safeB));font-size:11.5px;color:rgba(255,255,255,.45);letter-spacing:1px}
/* 틀 */
#app{position:fixed;inset:0;display:grid;grid-template-columns:1fr;background:var(--bg)}
#rail{display:none}
#side{display:flex;flex-direction:column;min-height:0;background:var(--card)}
#main{display:none;flex-direction:column;min-height:0;min-width:0;position:relative;background:#cfe3d7}
#app.inroom #side{display:none}
#app.inroom #main{display:flex}
.lh{display:flex;align-items:center;gap:4px;padding:10px 8px 6px;padding-top:calc(10px + var(--safeT));background:#fff}
.lh .lt{flex:1;min-width:0;padding-left:4px}
.lh .lt b{font-size:21px;font-weight:800;letter-spacing:-.3px}
.lh .lt small{display:block;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ib{width:42px;height:42px;border-radius:14px;border:0;background:transparent;color:#334155;display:flex;align-items:center;justify-content:center;flex:none;position:relative}
.ib:hover{background:#f1f5f9}
.ib svg{width:23px;height:23px}
.ib em{position:absolute;top:5px;right:5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ib.inst{width:auto;padding:0 12px;height:34px;border-radius:17px;background:#0f766e;color:#fff;font-weight:800;font-size:13px;gap:5px}
.ib.inst svg{width:16px;height:16px}
.inapp{margin:4px 12px 8px;background:#fff7d6;color:#7a4b00;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.inapp b{display:block;color:#5c3700;font-size:14px}
.pask{display:flex;align-items:center;gap:10px;margin:2px 12px 8px;background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;line-height:1.4}
.pask span{flex:1}
.pask button{border:0;background:#0f766e;color:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;flex:none}
.pask .x{background:transparent;color:#64748b;padding:4px 6px}
.find{padding:2px 12px 8px}
.find input{width:100%;height:42px;border:0;border-radius:13px;padding:0 14px;background:#f1f4f6;outline:none;font-size:15px}
.filt{display:flex;gap:6px;padding:4px 12px 8px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:#f1f4f6;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;color:#475569;display:flex;align-items:center;gap:5px}
.chip.on{background:#0f172a;color:#fff}
.chip em{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;min-width:18px;text-align:center;line-height:17px}
#rooms{flex:1;overflow:auto;padding:0 0 calc(10px + var(--safeB))}
.room{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 16px;position:relative}
.room:hover{background:#f7f9fa}
.room.on{background:#eef4f3}
.av{width:50px;height:50px;border-radius:19px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;letter-spacing:-.5px}
.av.gs{background:linear-gradient(135deg,#10b981,#047857)}.av.pc{background:linear-gradient(135deg,#a78bfa,#6d28d9)}.av.qc{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.room .rb{flex:1;min-width:0}
.room .r1{display:flex;align-items:center;gap:6px}
.room .r1 b{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px}
.tag.gs{background:var(--gsb);color:var(--gs)}.tag.pc{background:var(--pcb);color:var(--pc)}.tag.qc{background:var(--qcb);color:var(--qc)}
.tag.g-post{background:#ecfdf5;color:#047857}.tag.g-print{background:#fdf2f8;color:#be185d}.tag.g-yarn{background:#fff7ed;color:#c2410c}
.grp{font-size:11.5px;font-weight:800;color:#64748b;letter-spacing:.2px;padding:12px 18px 4px}   /* hotfix624: 대화방 묶음 머리 */
.room .tm{margin-left:auto;flex:none;font-size:11.5px;color:#94a3b8}
.room .r2{display:flex;align-items:center;gap:8px;margin-top:4px}
.room .pv{flex:1;min-width:0;font-size:13.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .na{font-size:11px;color:#b45309;flex:none}
.room .nt{flex:none;color:#d97706}
.badge{flex:none;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;border-radius:11px;padding:0 7px;min-width:21px;height:21px;line-height:21px;text-align:center}
.empty{color:var(--sub);text-align:center;padding:48px 16px;font-size:14px;line-height:1.7}
/* 대화방 */
.rtop{display:flex;align-items:center;gap:2px;padding:6px 4px 6px 6px;padding-top:calc(6px + var(--safeT));background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.rtop .filt{flex:1;min-width:0;padding:0 6px 0 2px}
.rtop + .th-h{padding-top:8px}
.th-h{display:flex;align-items:center;gap:6px;padding:8px 8px;background:rgba(207,227,215,.96);backdrop-filter:blur(6px);padding-top:calc(8px + var(--safeT));position:relative;z-index:4}
.th-h .av{width:38px;height:38px;border-radius:14px;font-size:13px}
.th-h .tt{flex:1;min-width:0;padding-left:2px}
.th-h b{font-size:16.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-h small{display:block;color:#3b4a54;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-h .ib{color:#1f2a30}
.th-h .ib:hover{background:rgba(255,255,255,.35)}
#nbar{position:absolute;left:0;right:0;z-index:3}
#thread{flex:1;overflow:auto;overscroll-behavior:contain;background:#cfe3d7}
#thread .hwk-th{min-height:100%;padding-top:var(--nbh,8px)}
#cmpw{flex:none}
#cmpw .hwk-cmp{--hwk-safe:var(--safeB)}
.noroom{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#3b4a54;text-align:center;padding:30px;font-size:14px;line-height:1.7}
.noroom img{width:88px;height:88px;border-radius:26px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
#drop{position:absolute;inset:10px;background:rgba(15,118,110,.12);border:3px dashed var(--brand2);border-radius:18px;display:none;align-items:center;justify-content:center;font-weight:800;color:var(--brand2);font-size:18px;z-index:9;pointer-events:none}
#main.dragging #drop{display:flex}
/* 서랍 메뉴 */
.dw{position:fixed;inset:0;z-index:60;pointer-events:none}
.dw-bg{position:absolute;inset:0;background:rgba(15,23,42,.42);opacity:0;transition:opacity .2s}
.dw-p{position:absolute;top:0;bottom:0;left:0;width:min(320px,86vw);background:#fff;transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:12px 0 40px rgba(15,23,42,.2)}
.dw.on{pointer-events:auto}.dw.on .dw-bg{opacity:1}.dw.on .dw-p{transform:none}
.dw-h{background:linear-gradient(150deg,#17615b,#0f3d3a);color:#fff;padding:18px 18px 16px;padding-top:calc(18px + var(--safeT));display:flex;gap:12px;align-items:center}
.dw-h .me{width:48px;height:48px;border-radius:17px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.dw-h b{display:block;font-size:17px}.dw-h small{display:block;color:#b8efe6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-b{flex:1;overflow:auto;padding:10px 8px calc(16px + var(--safeB))}
.dw-s{font-size:12px;font-weight:800;color:#94a3b8;padding:12px 12px 6px;letter-spacing:.5px}
.dw-i{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:700;font-size:15px;color:#1e293b;text-align:left}
.dw-i:hover,.dw-i.on{background:#f1f5f4}
.dw-i.on{color:#0f766e}
.dw-i svg{width:21px;height:21px;color:#64748b}
.dw-i.on svg{color:#0f766e}
.dw-i span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-i small{font-weight:500;color:#94a3b8;font-size:12px}
.dw-i .dot{width:9px;height:9px;border-radius:5px;flex:none;margin:0 6px}
.dw-i.v{padding:8px 12px;font-size:14px;font-weight:600}
.dw-i.red{color:#dc2626}.dw-i.red svg{color:#dc2626}
.dw-ver{text-align:center;color:#cbd5e1;font-size:11.5px;padding:14px}
/* 들어온 글 알림 (오른쪽에서 밀려 나옴) */
#slides{position:fixed;right:16px;bottom:20px;z-index:95;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.sl{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 14px 40px rgba(15,23,42,.25);border:1px solid #e2e8f0;cursor:pointer;animation:slin .28s cubic-bezier(.2,.8,.2,1)}
.sl.out{animation:slout .25s forwards}
@keyframes slin{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes slout{to{transform:translateX(120%);opacity:0}}
.sl .av{width:42px;height:42px;border-radius:15px;font-size:13px}
.sl .sb{flex:1;min-width:0}.sl .sb b{display:block;font-size:14px}.sl .sb p{margin:2px 0 0;font-size:13.5px;color:#475569;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sl .sb small{color:#94a3b8;font-size:11.5px}
.sl .x{border:0;background:none;color:#94a3b8;font-size:16px;padding:0 2px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safeB));transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:2147483200;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:#b91c1c}
/* 시트 */
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}

#sheet .sb.on{background:#ecfdf5;color:#065f46}

#sheet .st-g{font-size:12.5px;font-weight:800;color:var(--sub);margin:14px 2px 6px}

#sheet .st-r .tx{flex:1;min-width:0;font-weight:700;font-size:15px}
#sheet .st-r .tx small{display:block;font-weight:500;color:var(--sub);font-size:12.5px;margin-top:2px;line-height:1.45}
#sheet .st-b{flex:none;border:0;border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;background:#0f172a;color:#fff;cursor:pointer}
#sheet .st-b.lt{background:#fff;color:#0f172a;border:1px solid #cbd5e1}

#sheet .sw{flex:none;position:relative;width:52px;height:30px;border-radius:999px;border:0;background:#cbd5e1;cursor:pointer;transition:.15s;padding:0}

#sheet .seg{flex:none;display:flex;background:#e2e8f0;border-radius:10px;padding:3px;gap:2px}

#sheet .seg button.on{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#sheet ol.st-ol{margin:6px 0 12px;padding-left:22px;line-height:1.7;font-size:14.5px}
#sheet .st-code{display:flex;gap:8px;align-items:center;background:#0f172a;color:#e2e8f0;border-radius:12px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:14px;margin:8px 0}
#sheet .st-code span{flex:1;word-break:break-all}

<script>
(function () {
  if (window.HWBack) return;
  const K = 3;
  const B = { on: false, depth: 0, leaving: false, restoring: false, undo: null, ad: null, snackT: 0, log: [], typed: new Set() };
    const push = () => { try { history.pushState({ hwb: 600 }, ''); B.depth++; return true; } catch (_) { return false; } };
  const arm = () => { if (!B.on || B.leaving) return; let n = 0; while (B.depth < K && n++ < K) { if (!push()) break; } };
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(t => document.addEventListener(t, arm, true));
  document.addEventListener('input', e => { const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.type !== 'search' && !/찾기|검색/.test(t.placeholder || '')) B.typed.add(t); }, true);   /* 글자를 넣은 칸 — 창을 닫을 때 [다시 열기]를 줄지 봄 */
  document.addEventListener('pointerdown', e => { const s = el('hwb-snack'); if (s && s.classList.contains('on') && !s.contains(e.target)) hideSnack(); }, true);   /* 다른 곳을 누르면 알림줄은 바로 사라짐 */
  const css = `#hwb-snack{position:fixed;left:50%;bottom:calc(var(--hwb-nav,84px) + 12px);transform:translateX(-50%) translateY(16px);z-index:2147483000;background:#0f172a;color:#fff;border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:min(440px,calc(100vw - 24px));box-sizing:border-box;font-family:inherit}
#hwb-snack.on{opacity:.97;transform:translateX(-50%);pointer-events:auto}
#hwb-snack span{flex:1 1 auto;line-height:1.35;word-break:keep-all}
#hwb-snack button{flex:0 0 auto;border:0;border-radius:10px;background:#fbbf24;color:#0f172a;font-size:15px;font-weight:900;padding:10px 14px;font-family:inherit}
#hwb-exit{position:fixed;inset:0;z-index:2147483001;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;font-family:inherit}
#hwb-exit.on{display:flex}
#hwb-exit .b{width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(15,23,42,.25)}
#hwb-exit b{display:block;font-size:19px;color:#0f172a;margin-bottom:6px}
#hwb-exit p{margin:0 0 16px;color:#64748b;font-size:14.5px;line-height:1.55}
#hwb-exit .r{display:flex;gap:10px}
#hwb-exit .r button{flex:1;height:54px;border-radius:14px;font-size:17px;font-weight:900;font-family:inherit;border:1px solid #cbd5e1;background:#fff;color:#334155}
#hwb-exit .r button.go{border:0;background:#0f766e;color:#fff}
#hwb-bye{position:fixed;inset:0;z-index:2147483002;background:linear-gradient(160deg,#0f3b47,#134e5e 55%,#1e3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;font-family:inherit}
#hwb-bye div{font-size:15.5px;opacity:.88;line-height:1.6}#hwb-bye b{font-size:26px}
#hwb-bye button{margin-top:16px;border:0;border-radius:14px;padding:14px 26px;font-size:17px;font-weight:800;background:#fff;color:#0f3b47;font-family:inherit}`;
  const el = id => document.getElementById(id);
  function ensure() {
    if (!el('hwb-css')) { const s = document.createElement('style'); s.id = 'hwb-css'; s.textContent = css; document.head.appendChild(s); }
    if (!el('hwb-snack')) { const d = document.createElement('div'); d.id = 'hwb-snack'; d.setAttribute('role', 'status'); d.innerHTML = '<span></span><button type="button" data-hwb-undo>다시 열기</button>'; document.body.appendChild(d);
      d.querySelector('button').addEventListener('click', () => { const f = B.undo; hideSnack(); if (f) { B.restoring = true; try { f(); } catch (e) { console.warn('[hwb undo]', e); } finally { B.restoring = false; } B.log.push('undo'); } }); }
    if (!el('hwb-exit')) { const d = document.createElement('div'); d.id = 'hwb-exit'; d.innerHTML = '<div class="b" role="dialog"><b></b><p>넣은 기록은 모두 저장돼 있습니다.<br>◁(뒤로)를 한 번 더 눌러도 나갑니다.</p><div class="r"><button type="button" data-no>계속 쓰기</button><button type="button" class="go" data-go>나가기</button></div></div>'; document.body.appendChild(d);
      d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-no]')) { closeExit(); return; } if (e.target.closest('[data-go]')) bye(); }); }
  }
  function navH() { try { const n = B.ad && B.ad.navEl && B.ad.navEl(); const r = n && n.getBoundingClientRect(); const vis = r && r.height > 0 && getComputedStyle(n).display !== 'none' && getComputedStyle(n).visibility !== 'hidden'; const h = vis ? Math.max(0, window.innerHeight - r.top) : 0; document.documentElement.style.setProperty('--hwb-nav', Math.round(h || 12) + 'px'); } catch (_) {} }   /* 606: 아래 메뉴는 position:fixed 라 offsetParent 가 비어 높이를 0 으로 봤음 → 알림줄이 메뉴를 가렸음. 이제 메뉴 윗선 위에 뜸 */
  function snack(msg, fn) { ensure(); navH(); const s = el('hwb-snack'); s.querySelector('span').textContent = msg; B.undo = fn || null; s.querySelector('button').style.display = fn ? '' : 'none'; s.classList.add('on'); clearTimeout(B.snackT); B.snackT = setTimeout(hideSnack, 5000); }
  function hideSnack() { clearTimeout(B.snackT); B.undo = null; const s = el('hwb-snack'); if (s) s.classList.remove('on'); }
  function exitOpen() { const e = el('hwb-exit'); return !!(e && e.classList.contains('on')); }
  function openExit() { ensure(); hideSnack(); const e = el('hwb-exit'); e.querySelector('b').textContent = ((B.ad && B.ad.title) || '앱') + ' — 나가시겠습니까?'; e.classList.add('on'); B.log.push('exit-ask'); }
  function closeExit() { const e = el('hwb-exit'); if (e) e.classList.remove('on'); }
  function bye() {
    closeExit(); hideSnack(); B.leaving = true; B.log.push('bye');
    const n = B.depth; B.depth = 0; if (n > 0) { try { history.go(-n); } catch (_) {} }
    try { window.close(); } catch (_) {}
    setTimeout(() => { if (!B.leaving) return; let d = el('hwb-bye'); if (!d) { d = document.createElement('div'); d.id = 'hwb-bye'; document.body.appendChild(d); }
      d.innerHTML = '<b>나갔습니다</b><div>넣은 기록은 모두 저장돼 있습니다.<br>휴대폰 ◁(뒤로)를 한 번 더 누르면 앱이 닫힙니다.</div><button type="button">다시 쓰기</button>';
      d.querySelector('button').onclick = () => { d.remove(); B.leaving = false; arm(); }; }, 260);
  }
    function back() {
    if (!B.ad) return 'none';
    if (exitOpen()) { bye(); return 'bye'; }
    let Ls = []; try { Ls = B.ad.layers() || []; } catch (_) {}
    for (const L of Ls) {
      let o = false; try { o = !!L.open(); } catch (_) {} if (!o) continue;
      let dirty = false; try { const box = L.el && L.el(); if (box) for (const t of B.typed) { if (t.isConnected && box.contains(t)) { dirty = true; break; } } } catch (_) {}
      let st; try { st = L.close(); } catch (e) { console.warn('[hwb close]', e); }
      B.typed.clear();
      if (dirty && L.reopen && st !== false) snack((L.label || '창') + ' 닫음 · 적던 값 보관', () => L.reopen(st)); else hideSnack();   /* 606: 글자를 넣던 창만 [다시 열기] — 메뉴 · 목록 · 보기 창은 그냥 닫음 */
      B.log.push('layer:' + (L.name || '')); return 'layer:' + (L.name || '');
    }
    let home = true; try { home = !B.ad.isHome || !!B.ad.isHome(); } catch (_) {}
    if (!home) { hideSnack(); B.restoring = true; try { B.ad.goHome(); } catch (e) { console.warn('[hwb home]', e); } finally { B.restoring = false; } B.log.push('home'); return 'home'; }   /* 606: 다른 탭 · 찾기 · 고른 카드 → 한 번에 첫 화면 */
    openExit(); return 'exit';
  }
  window.addEventListener('popstate', e => { if (!B.on) return; if (B.leaving) return; if (B.depth > 0) B.depth--; try { e.stopImmediatePropagation(); } catch (_) {} if (B.depth < 1) push(); back(); });   /* 손을 안 대고 ◁ 를 계속 눌러도 맨 처음 칸까지 내려가지 않게 한 칸은 늘 남김 */
    window.HWBack = {
    init(ad) { B.ad = ad; ensure(); if (!B.on) { B.on = true; push(); } },
    note() {},   /* 606: 화면마다 적어 두던 것 없앰(옛 호출 자리 그대로 두어도 됨) */
    reset() { hideSnack(); B.typed.clear(); },
    off() { B.on = false; hideSnack(); closeExit(); },
    back, arm, get on() { return B.on; }, get restoring() { return B.restoring; }, _B: B
  };
})();

</script>
<script>
/* ===== HWChat 대화 화면 공용 (hotfix620 · 대표 10/9 "카톡처럼 쉽고 멋있게") — 이음 · 편직팀 앱 · 염/가공소 앱 · 현장 QC 앱이 같은 모양
 *   말풍선(내 글 노랑 · 받은 글 흰색) · 같은 사람 1분 안 글은 묶음(이름 · 사진은 첫 글, 시간은 끝 글) · 안 읽음 1
 *   길게 누르기 / 오른쪽 클릭 = 답장 · 복사 · 저장 · 공지 · 삭제 · 오른쪽으로 밀기 = 답장 · 위쪽 공지 줄
 *   [+] = 앨범 · 카메라 · 파일(종류 고르기) · 자주 쓰는 말 · 공지 — 고르면 바로 올라감(진행 % · 실패하면 다시 보내기)
 *   사진은 긴 쪽 1600 JPEG 로 줄여 올림 · Storage chat/{업체 | __field}/YYYYMM/파일 · 글에는 att = { p, n, t, s, w, h } ===== */
(function () {
  if (window.HWChat) return;
  const CSS = `
.hwk-th{--hwk-bg:#cfe3d7;background:var(--hwk-bg);padding:8px 10px 14px;font-size:15px;color:#191f23;-webkit-user-select:text;user-select:text}

.hwk-av.sp{visibility:hidden;height:1px}
.hwk-av.c-us{background:linear-gradient(135deg,#14b8a6,#0f766e)}.hwk-av.c-gs{background:linear-gradient(135deg,#10b981,#047857)}.hwk-av.c-pc{background:linear-gradient(135deg,#a78bfa,#6d28d9)}.hwk-av.c-qc{background:linear-gradient(135deg,#60a5fa,#1d4ed8)}
.hwk-av.c-0{background:linear-gradient(135deg,#f59e0b,#d97706)}.hwk-av.c-1{background:linear-gradient(135deg,#ec4899,#be185d)}.hwk-av.c-2{background:linear-gradient(135deg,#06b6d4,#0e7490)}.hwk-av.c-3{background:linear-gradient(135deg,#84cc16,#4d7c0f)}.hwk-av.c-4{background:linear-gradient(135deg,#f97316,#c2410c)}
.hwk-c{display:flex;flex-direction:column;min-width:0;max-width:calc(100% - 96px)}
.hwk-r.out .hwk-c{align-items:flex-end;max-width:calc(100% - 52px)}
.hwk-nm{font-size:12.5px;color:#3b4a54;margin:0 0 5px 2px;font-weight:500}

async function pushOn() { const ok = await pushReg(true); toast(ok ? '이 기기 알림을 켰습니다' : '알림을 켜지 못했습니다 — ' + (S.pushErr || '주소창 왼쪽 자물쇠 → 알림 허용'), !ok); paintPushAsk(); }

  const show = can && !(Notification.permission === 'granted' && ls.raw('hwc.push')) && Notification.permission !== 'denied' && !ls.raw('hwc.pno'); el.classList.toggle('hide', !show); }

    if (location.protocol !== 'https:' || !('serviceWorker' in navigator) || typeof Notification === 'undefined') { S.pushErr = '이 브라우저는 알림을 못 받습니다'; return false; }

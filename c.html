<!--
  이음 (c.html) — 현일텍스 본사 대화 앱 · hotfix619 (2026-10-09)
  본사(직원 구글 계정)가 편직팀 · 염/가공소 · 현장 QC 모든 대화를 한 곳에서 보고, 업체마다 대화한다. 휴대폰(앱 설치) · PC 같은 주소.
  자료는 FABIWOS 와 같은 곳(proc_log)을 쓴다 — 새 상자 없음. FABIWOS [대화] 창 · 업체 앱 · 현장 QC 앱과 같은 글을 보고 쓴다.
    편직팀  : 업체 { by:'vendor', kind:'issue', issue:'메시지', k:'chat', part:'gs' } · 우리 { by:'us', kind:'note', k:'chat', part:'gs', label:보낸 사람 }
    염/가공 : 같은 모양 · part 없음
    현장 QC : { vendor:'__field', kind:'field' | 'field_reply'(ref) | 'field_ack'(ref) | 'field_del'(ref · 최고관리자) , k:'dev:기기' }
    답장 chip 're:글 id' · 보내기 취소 { kind:'cancel', ref } · 읽음 { kind:'st', stage:'chat_seen', ref }
    첨부 att = { p: Storage 경로 chat/{업체 | __field}/YYYYMM/파일, n: 이름, t: 형식, s: 크기, w, h } — 사진은 줄여서(긴 쪽 1920) 올림 · 지우기 없음
-->
<style>
:root{--ink:#0f172a;--sub:#64748b;--line:#e2e8f0;--bg:#f4f6f8;--card:#fff;--brand:#0f3d3a;--brand2:#0f766e;--accent:#f59e0b;--gs:#047857;--gsb:#ecfdf5;--pc:#6d28d9;--pcb:#f5f3ff;--qc:#1e3a8a;--qcb:#eff6ff;--red:#dc2626;--me:#0f766e;--meText:#fff;--safeB:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
/* 로그인 */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f3d3a 0%,#134e4a 55%,#0f766e 100%);color:#fff;padding:24px;z-index:50}
#login .lg-in{width:min(380px,100%);text-align:center}
#login img{width:96px;height:96px;border-radius:24px;box-shadow:0 16px 40px rgba(0,0,0,.35)}
#login h1{font-size:34px;margin:18px 0 4px;letter-spacing:2px;font-weight:800}
#login p{margin:0 0 26px;color:#ccfbf1;font-size:14.5px;line-height:1.6}
#login button{width:100%;height:54px;border:0;border-radius:14px;background:#fff;color:#0f3d3a;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
#login .lg-err{margin-top:14px;color:#fde68a;font-size:13.5px;min-height:18px}
/* 틀 */
#app{position:fixed;inset:0;display:grid;grid-template-columns:360px 1fr;background:var(--bg)}
#side{display:flex;flex-direction:column;min-height:0;background:var(--card);border-right:1px solid var(--line)}
#main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px);background:var(--brand);color:#fff;padding-top:calc(12px + env(safe-area-inset-top))}
.top .logo{width:34px;height:34px;border-radius:10px;flex:none}
.top b{font-size:19px;letter-spacing:1px}
.top small{display:block;font-size:11.5px;color:#99f6e4;font-weight:500;letter-spacing:0}
.top .sp{flex:1}
.icb{width:38px;height:38px;border-radius:11px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.icb svg{width:20px;height:20px}
.filt{display:flex;gap:6px;padding:10px 12px 6px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:700;color:#334155;display:flex;align-items:center;gap:5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip em{font-style:normal;background:var(--red);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;min-width:18px;text-align:center}
.find{padding:4px 12px 8px}
.find input{width:100%;height:40px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#f8fafc;outline:none}
.find input:focus{border-color:var(--brand2);background:#fff}
#rooms{flex:1;overflow:auto;padding:0 6px 10px}
.room{display:flex;gap:11px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 8px;border-radius:13px;position:relative}
.room:hover{background:#f8fafc}
.room.on{background:#ecfdf5}
.av{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff}
.av.gs{background:linear-gradient(135deg,#059669,#047857)}.av.pc{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.av.qc{background:linear-gradient(135deg,#2563eb,#1e3a8a)}
.room .rb{flex:1;min-width:0}
.room .r1{display:flex;align-items:center;gap:6px}
.room .r1 b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 6px}
.tag.gs{background:var(--gsb);color:var(--gs)}.tag.pc{background:var(--pcb);color:var(--pc)}.tag.qc{background:var(--qcb);color:var(--qc)}
.room .tm{margin-left:auto;flex:none;font-size:11.5px;color:var(--sub)}
.room .r2{display:flex;align-items:center;gap:6px;margin-top:3px}
.room .pv{flex:1;min-width:0;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room .na{font-size:11px;color:#b45309}
.badge{flex:none;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;border-radius:10px;padding:1px 7px;min-width:20px;text-align:center}
.empty{color:var(--sub);text-align:center;padding:40px 16px;font-size:14px;line-height:1.7}
/* 대화 */
.th-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top))}
.th-h .back{display:none;border:0;background:none;width:36px;height:36px;border-radius:10px;align-items:center;justify-content:center}
.th-h .back svg{width:22px;height:22px}
.th-h .av{width:38px;height:38px;border-radius:12px;font-size:14px}
.th-h b{font-size:16px}
.th-h small{display:block;color:var(--sub);font-size:12px}
.th-h .sp{flex:1}
#thread{flex:1;overflow:auto;padding:12px 14px 6px;background:var(--bg);overscroll-behavior:contain}
.day{text-align:center;margin:12px 0 8px}.day span{background:#e2e8f0;color:#475569;font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 11px}
.m{display:flex;flex-direction:column;align-items:flex-start;margin:7px 0;max-width:78%}
.m.out{margin-left:auto;align-items:flex-end}
.m .who{font-size:12px;color:var(--sub);font-weight:700;margin:0 4px 3px}
.m .re{font-size:12px;color:var(--sub);margin:0 4px 3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid #cbd5e1;padding-left:7px}
.bub{padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-top-left-radius:5px;max-width:100%}
.m.out .bub{background:var(--me);border-color:var(--me);color:var(--meText);border-top-left-radius:16px;border-top-right-radius:5px}
.m .meta{font-size:11.5px;color:#94a3b8;margin:3px 4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meta .rd{color:#059669;font-weight:700}.meta .ur{color:#d97706;font-weight:700}
.meta button{border:0;background:none;padding:0;font-size:11.5px;color:#2563eb;font-weight:700;text-decoration:underline}
.meta button.x{color:#b91c1c}
.m.local .bub{opacity:.75}
.att-img{display:block;max-width:min(260px,100%);max-height:320px;border-radius:13px;border:1px solid var(--line);background:#e2e8f0;object-fit:cover;min-width:120px;min-height:90px;margin-bottom:3px;cursor:zoom-in}
.att-f{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-width:220px;max-width:280px;text-align:left;margin-bottom:3px;color:var(--ink)}
.att-f .fi{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none;background:#64748b}
.att-f .fi.pdf{background:#dc2626}.att-f .fi.xls{background:#16a34a}.att-f .fi.doc{background:#2563eb}.att-f .fi.ppt{background:#ea580c}.att-f .fi.hwp{background:#0891b2}
.att-f .fn{flex:1;min-width:0}.att-f .fn b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.att-f .fn small{color:var(--sub);font-size:12px}
.up{font-size:11.5px;color:#0f766e;font-weight:700}
/* 쓰기 */
.cmp{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + var(--safeB))}
.rbar{display:flex;align-items:center;gap:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:11px;padding:6px 10px;margin-bottom:7px;font-size:13px}
.rbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar button,.tray button.rm{border:0;background:none;color:#b91c1c;font-weight:800}
.tray{display:flex;gap:8px;overflow-x:auto;margin-bottom:7px;padding-bottom:2px}
.tray .ti{position:relative;flex:none;width:72px;height:72px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;text-align:center;padding:4px;word-break:break-all;color:#334155}
.tray .ti img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.tray .ti .rm{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:11px;background:rgba(15,23,42,.65);color:#fff;font-size:13px;line-height:22px;z-index:2}
.qk{display:flex;gap:6px;overflow-x:auto;margin-bottom:7px;scrollbar-width:none}.qk::-webkit-scrollbar{display:none}
.qk button{flex:none;border:1px solid #cbd5e1;background:#fff;border-radius:15px;padding:4px 11px;font-size:13px;font-weight:700;color:#334155}
.row{display:flex;gap:8px;align-items:flex-end}
.plus{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#f8fafc;display:flex;align-items:center;justify-content:center;flex:none;color:#334155}
.plus svg{width:22px;height:22px}
#tx{flex:1;min-height:44px;max-height:140px;resize:none;border:1.5px solid #cbd5e1;border-radius:14px;padding:10px 12px;outline:none;line-height:1.45;background:#fff}
#tx:focus{border-color:var(--brand2)}
.send{height:44px;padding:0 18px;border-radius:14px;border:0;background:var(--brand2);color:#fff;font-weight:800;flex:none}
.send:disabled{opacity:.5}
.att-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.att-menu label{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:12px 6px;background:#f8fafc;font-size:13px;font-weight:700;cursor:pointer}
.att-menu label svg{width:26px;height:26px}
.att-menu input{display:none}
.noroom{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--sub);text-align:center;padding:30px}
.noroom img{width:84px;height:84px;border-radius:22px;opacity:.9}
#drop{position:absolute;inset:0;background:rgba(15,118,110,.12);border:3px dashed var(--brand2);border-radius:16px;display:none;align-items:center;justify-content:center;font-weight:800;color:var(--brand2);font-size:18px;z-index:5;pointer-events:none}
#main.dragging #drop{display:flex}
#main{position:relative}
/* 보기 · 시트 */
#viewer{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:80;display:flex;flex-direction:column}
#viewer .vh{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px;padding-top:calc(12px + env(safe-area-inset-top))}
#viewer .vh a,#viewer .vh button{color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:8px 14px;font-weight:700;text-decoration:none;font-size:14px}
#viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{background:#fff;border-radius:20px 20px 0 0;width:min(560px,100%);max-height:86vh;overflow:auto;padding:16px 16px calc(16px + var(--safeB))}
#sheet h3{margin:2px 0 10px;font-size:17px}
#sheet .sb{display:block;width:100%;text-align:left;border:0;background:#f8fafc;border-radius:12px;padding:13px 14px;margin-bottom:7px;font-weight:700}
#sheet .sb small{display:block;font-weight:500;color:var(--sub);font-size:12.5px;margin-top:2px}
#sheet .sb.red{color:#b91c1c}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%) translateY(20px);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:90;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#toast.err{background:#b91c1c}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #main{display:none}
  #app.inroom #side{display:none}
  #app.inroom #main{display:flex}
  .th-h .back{display:flex}
  .m{max-width:86%}
}
@media (min-width:821px){ .cmp .hint{display:block} }
.cmp .hint{display:none;font-size:11px;color:#94a3b8;margin-top:4px}
</style>
</head>

    <div class="filt" id="filt"></div>
